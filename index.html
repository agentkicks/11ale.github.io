<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById(
        "customPlayer"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const centerPlay =
    document.getElementById(
        "centerPlay"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const muteBtn =
    document.getElementById(
        "muteBtn"
    );

const volume =
    document.getElementById(
        "volume"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

const subtitleBtn =
    document.getElementById(
        "subtitleBtn"
    );

const subtitlePanel =
    document.getElementById(
        "subtitlePanel"
    );

const closeSubtitlePanel =
    document.getElementById(
        "closeSubtitlePanel"
    );

const chooseSubtitle =
    document.getElementById(
        "chooseSubtitle"
    );

const subtitleFile =
    document.getElementById(
        "subtitleFile"
    );

const subtitleStatus =
    document.getElementById(
        "subtitleStatus"
    );

const syncBack =
    document.getElementById(
        "syncBack"
    );

const syncForward =
    document.getElementById(
        "syncForward"
    );

const syncValue =
    document.getElementById(
        "syncValue"
    );

const resetSync =
    document.getElementById(
        "resetSync"
    );

const autoSync =
    document.getElementById(
        "autoSync"
    );

const autoSyncStatus =
    document.getElementById(
        "autoSyncStatus"
    );


/* =========================================================
   VARIABLES
========================================================= */

let subtitleTrack = null;

let originalVTTText = null;

let subtitleSync = 0;

let subtitleURL = null;

let lastUIUpdate = 0;


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {

        return "0:00";

    }


    const mins =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");


    return `${mins}:${secs}`;

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (video.paused) {

        video.play()
            .catch(() => {});

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);


centerPlay.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   PLAY STATE
========================================================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent =
            "❚❚";

        centerPlay.innerHTML =
            "<span>❚❚</span>";

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent =
            "▶";

        centerPlay.innerHTML =
            "<span>▶</span>";

    }
);


/* =========================================================
   METADATA
========================================================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);


/* =========================================================
   OPTIMIZED PROGRESS
========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        const now =
            performance.now();


        if (
            now - lastUIUpdate < 100
        ) {

            return;

        }


        lastUIUpdate = now;


        currentTime.textContent =
            formatTime(
                video.currentTime
            );


        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);


/* =========================================================
   PROGRESS SEEK
========================================================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                video.duration
            )
        ) {

            return;

        }


        video.currentTime =
            (
                progress.value / 100
            ) * video.duration;

    }
);


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(
                volume.value
            );

        video.muted = false;

        updateMuteIcon();

    }
);


function updateMuteIcon() {

    muteBtn.textContent =
        video.muted ||
        video.volume === 0
            ? "🔇"
            : "🔊";

}


muteBtn.addEventListener(
    "click",

            !video.muted;

        updateMuteIcon();

    }
);


/* =========================================================
   FULLSCREEN

fullscreenBtn.addEventListener(

                !document.fullscreenElement
            ) {

                await player.requestFullscreen();

/* =========================================================

subtitleBtn.addEventListener(

chooseSubtitle.addEventListener(

        subtitleFile.click();

/* =========================================================
   SRT → WEBVTT
========================================================= */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();


    vtt = vtt.replace(
        /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
        "$1.$2"
    );


    vtt = vtt.replace(
        /^\d+\s*$/gm,
        ""
    );


    return (
        "WEBVTT\n\n" +
        vtt
    );

}


/* =========================================================
   LOAD SRT / VTT
========================================================= */

subtitleFile.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;

        }


        try {

            let subtitleText =
                await file.text();


            if (
                extension === "srt"
            ) {

                subtitleText =
                    srtToVtt(
                        subtitleText
                    );

            }


            originalVTTText =
                subtitleText;


            subtitleSync = 0;


            updateSyncDisplay();


            subtitleStatus.textContent =
                `Loaded: ${file.name}`;


            autoSyncStatus.textContent =
                "Choose a sync point, then click Auto Sync.";


            applySubtitleSync();


        } catch (error) {

            console.error(
                "Subtitle error:",
                error
            );


            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitleSync() {

    if (!originalVTTText) {

        return;

    }


    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );


    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );


    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }


    subtitleURL =
        URL.createObjectURL(
            blob
        );


    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }


    subtitleTrack =
        document.createElement(
            "track"
        );


    subtitleTrack.kind =
        "subtitles";


    subtitleTrack.label =
        "Subtitles";


    subtitleTrack.srclang =
        "en";


    subtitleTrack.src =
        subtitleURL;


    subtitleTrack.default =
        true;


    video.appendChild(
        subtitleTrack
    );


    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    "showing";

            }

        }
    );

}


/* =========================================================
   SHIFT VTT TIMING
========================================================= */

function shiftVTT(
    vtt,
    offset
) {

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;


    return vtt.replace(
        timestampRegex,
        (timestamp) => {

            const parts =
                timestamp.split(":");


            let hours = 0;

            let minutes = 0;

            let seconds = 0;


            if (
                parts.length === 3
            ) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }


            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;


            total =
                Math.max(
                    0,
                    total
                );


            const newHours =
                Math.floor(
                    total / 3600
                );


            const remaining =
                total % 3600;


            const newMinutes =
                Math.floor(
                    remaining / 60
                );


            const newSeconds =
                remaining % 60;


            return (

                String(newHours)
                    .padStart(2, "0")

                + ":"

                + String(newMinutes)
                    .padStart(2, "0")

                + ":"

                + newSeconds
                    .toFixed(3)
                    .padStart(6, "0")

            );

        }
    );

}


/* =========================================================
   SYNC DISPLAY
========================================================= */

function updateSyncDisplay() {

    let value =
        subtitleSync.toFixed(1);


    if (
        subtitleSync > 0
    ) {

        value =
            "+" + value;

    }


    syncValue.textContent =
        value + "s";

}


/* =========================================================
   MANUAL SYNC
========================================================= */

syncBack.addEventListener(
    "click",
    () => {

        subtitleSync -= 0.5;

        updateSyncDisplay();

        applySubtitleSync();

        autoSyncStatus.textContent =
            "Manual sync adjustment applied.";

    }
);


syncForward.addEventListener(
    "click",
    () => {

        subtitleSync += 0.5;

        updateSyncDisplay();

        applySubtitleSync();

        autoSyncStatus.textContent =
            "Manual sync adjustment applied.";

    }
);


resetSync.addEventListener(
    "click",
    () => {

        subtitleSync = 0;

        updateSyncDisplay();

        applySubtitleSync();

        autoSyncStatus.textContent =
            "Sync reset to 0.0s.";

    }
);


/* =========================================================
   AUTO SYNC — PARSE CUES
========================================================= */

function getSubtitleCues(vtt) {

    const cues = [];

    const lines =
        vtt
            .replace(/\r/g, "")
            .split("\n");


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();


        if (
            !line.includes("-->")
        ) {

            continue;

        }


        const parts =
            line.split("-->");


        if (
            parts.length !== 2
        ) {

            continue;

        }


        const start =
            parseVTTTime(
                parts[0].trim()
            );


        const end =
            parseVTTTime(
                parts[1].trim()
            );


        if (
            !Number.isFinite(start) ||
            !Number.isFinite(end)
        ) {

            continue;

        }


        let text = "";


        for (
            let j = i + 1;
            j < lines.length;
            j++
        ) {

            const next =
                lines[j].trim();


            if (!next) {

                break;

            }


            if (
                next.includes("-->")
            ) {

                break;

            }


            if (
                !/^\d+$/.test(next)
            ) {

                text +=
                    (text ? " " : "") +
                    next;

            }

        }


        if (text) {

            cues.push({

                start: start,

                end: end,

                text:
                    cleanSubtitleText(
                        text
                    )

            });

        }

    }


    return cues;

}


/* =========================================================
   PARSE VTT TIME
========================================================= */

function parseVTTTime(time) {

    time =
        time
            .split(" ")[0]
            .trim();


    const parts =
        time.split(":");


    let hours = 0;

    let minutes = 0;

    let seconds = 0;


    if (
        parts.length === 3
    ) {

        hours =
            Number(parts[0]);

        minutes =
            Number(parts[1]);

        seconds =
            Number(parts[2]);

    } else if (
        parts.length === 2
    ) {

        minutes =
            Number(parts[0]);

        seconds =
            Number(parts[1]);

    } else {

        return NaN;

    }


    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );

}


/* =========================================================
   CLEAN SUBTITLE TEXT
========================================================= */

function cleanSubtitleText(text) {

    return text

        .replace(
            /<[^>]*>/g,
            ""
        )

        .replace(
            /\{[^}]*\}/g,
            ""
        )

        .replace(
            /&nbsp;/gi,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()

        .toLowerCase();

}


/* =========================================================
   FIND CLOSEST CUE
========================================================= */

function findSubtitleNearTime(
    cues,
    time
) {

    if (!cues.length) {

        return null;

    }


    let closest = null;

    let closestDistance =
        Infinity;


    for (
        const cue of cues
    ) {

        const distance =
            Math.abs(
                cue.start - time
            );


        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closest = cue;

        }

    }


    return closest;

}


/* =========================================================
   FORMAT SYNC OFFSET
========================================================= */

function formatSyncOffset(
    value
) {

    if (
        value === 0
    ) {

        return "0.0s";

    }


    return (
        value > 0
            ? "+"
            : ""
    ) +
    value.toFixed(1) +
    "s";

}


/* =========================================================
   SMART AUTO SYNC
========================================================= */

async function performAutoSync() {

    if (!originalVTTText) {

        autoSyncStatus.textContent =
            "Load an SRT or VTT first.";

        return;

    }


    if (
        !Number.isFinite(
            video.currentTime
        )
    ) {

        autoSyncStatus.textContent =
            "Video position unavailable.";

        return;

    }


    autoSync.classList.add(
        "syncing"
    );


    autoSyncStatus.textContent =
        "Analyzing subtitle timing…";


    try {

        /*
         * Everything here runs locally.
         *
         * The video is never uploaded.
         */

        const cues =
            getSubtitleCues(
                originalVTTText
            );


        if (!cues.length) {

            autoSyncStatus.textContent =
                "No valid subtitle cues found.";

            return;

        }


        const videoTime =
            video.currentTime;


        const closestCue =
            findSubtitleNearTime(
                cues,
                videoTime
            );


        if (!closestCue) {

            autoSyncStatus.textContent =
                "Couldn't find a matching cue.";

            return;

        }


        /*
         * Calculate the difference
         * between the video position
         * and subtitle timestamp.
         */

        const calculatedOffset =
            videoTime -
            closestCue.start;


        /*
         * Reject obviously incorrect
         * synchronization points.
         */

        if (
            Math.abs(
                calculatedOffset
            ) > 30
        ) {

            autoSyncStatus.textContent =
                "No reliable sync point found.";

            return;

        }


        /*
         * Round to 0.1 seconds.
         */

        subtitleSync =
            Math.round(
                calculatedOffset * 10
            ) / 10;


        updateSyncDisplay();


        applySubtitleSync();


        autoSyncStatus.textContent =
            "Synced " +
            formatSyncOffset(
                subtitleSync
            ) +
            " successfully.";


    } catch (error) {

        console.error(
            "Auto Sync error:",
            error
        );


        autoSyncStatus.textContent =
            "Auto Sync failed.";

    } finally {

        autoSync.classList.remove(
            "syncing"
        );

    }

}


/* =========================================================
   AUTO SYNC BUTTON
========================================================= */

autoSync.addEventListener(
    "click",
    performAutoSync
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.target.tagName ===
            "INPUT" ||

            event.target.tagName ===
            "TEXTAREA"
        ) {

            return;

        }


        /* SPACE / K */

        if (
            event.key === " " ||

            event.key.toLowerCase() ===
            "k"
        ) {

            event.preventDefault();

            togglePlay();

            return;

        }


        /* MUTE */

        if (
            event.key.toLowerCase() ===
            "m"
        ) {

            event.preventDefault();

            video.muted =
                !video.muted;

            updateMuteIcon();

            return;

        }


        /* FULLSCREEN */

        if (
            event.key.toLowerCase() ===
            "f"
        ) {

            event.preventDefault();

            fullscreenBtn.click();

            return;

        }


        /* LEFT */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            return;

        }


        /* RIGHT */

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.min(
                    video.duration ||
                    Infinity,

                    video.currentTime + 5
                );

            return;

        }


        /* SUBTITLE SYNC */

        if (
            !subtitlePanel.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key === "["
        ) {

            subtitleSync -= 0.5;

            updateSyncDisplay();

            applySubtitleSync();

        }


        if (
            event.key === "]"
        ) {

            subtitleSync += 0.5;

            updateSyncDisplay();

            applySubtitleSync();

        }


        if (
            event.key === "\\"
        ) {

            subtitleSync = 0;

            updateSyncDisplay();

            applySubtitleSync();

        }

    }
);


/* =========================================================
   CLOSE SUBTITLE MENU
========================================================= */

document.addEventListener(
    "click",
    (event) => {

        if (
            !subtitlePanel.contains(
                event.target
            ) &&

            !subtitleBtn.contains(
                event.target
            )
        ) {

            subtitlePanel.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (subtitleURL) {

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateSyncDisplay();

updateMuteIcon();

</script>
