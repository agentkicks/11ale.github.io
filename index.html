<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
}

.cineva-player {
    position: relative;
    width: calc(100% - 120px);
    max-width: 1500px;
    margin: 40px auto;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}

.cineva-player video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
}

/* Bottom gradient */

.cineva-player::after {
    content: "";
    position: absolute;
    pointer-events: none;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
    z-index: 2;
}

/* Top fullscreen */

.top-fullscreen {
    position: absolute;
    top: 20px;
    left: 12px;
    z-index: 10;

    padding: 10px 14px;

    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.15);

    background: rgba(35,35,35,.9);

    color: white;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    backdrop-filter: blur(10px);

    transition: .2s;
}

.top-fullscreen:hover {
    background: rgba(60,60,60,.95);
}

/* Movie information */

.movie-info {
    position: absolute;
    left: 28px;
    bottom: 82px;
    z-index: 4;
    color: white;
}

.watching {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #aeb2bb;
    font-size: 14px;

    margin-bottom: 10px;
}

.watching span {
    width: 4px;
    height: 20px;

    border-radius: 4px;

    background: #ff1f2d;

    display: block;
}

.movie-info h1 {
    margin: 0 0 14px 0;

    font-size: 30px;
    font-weight: 700;

    letter-spacing: -.4px;
}

.movie-meta {
    display: flex;
    gap: 10px;

    align-items: center;

    color: #c8cbd1;
    font-size: 15px;
}

.movie-meta b {
    color: #777;
    font-weight: normal;
}

/* Controls */

.controls {
    position: absolute;

    bottom: 0;
    left: 28px;
    right: 28px;

    z-index: 5;
}

/* Progress */

.progress-container {
    width: 100%;
    height: 5px;

    background: rgba(255,255,255,.25);

    border-radius: 10px;

    cursor: pointer;

    position: relative;
}

.progress-filled {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;
    width: 0%;

    background: #ff202b;

    border-radius: 10px;
}

/* Control row */

.control-row {
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: space-between;
}

.left-controls,
.right-controls {
    display: flex;

    align-items: center;

    gap: 14px;
}

/* Buttons */

.control-button {
    width: 38px;
    height: 38px;

    border: none;

    background: transparent;

    color: white;

    font-size: 20px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    transition: .2s;
}

.control-button:hover {
    background: rgba(255,255,255,.12);
}

/* Time */

.time {
    color: #ddd;

    font-size: 13px;

    white-space: nowrap;
}

/* Settings */

.settings-button {
    height: 38px;

    padding: 0 16px;

    border: none;

    border-radius: 8px;

    background: rgba(20,20,20,.8);

    color: white;

    display: flex;

    align-items: center;

    gap: 10px;

    cursor: pointer;

    font-size: 13px;

    backdrop-filter: blur(10px);
}

.settings-button:hover {
    background: rgba(50,50,50,.9);
}

/* Mobile */

@media(max-width: 800px) {

    .cineva-player {
        width: 100%;
        margin: 20px 0;
    }

    .movie-info {
        left: 18px;
        bottom: 75px;
    }

    .movie-info h1 {
        font-size: 21px;
    }

    .movie-meta {

    }

    .controls {
        left: 18px;
        right: 18px;
    }

    .settings-button span {
        display: none;
    }
}

</style>


<script>

const video = document.getElementById("movieVideo");

const playButton =
    document.getElementById("playButton");

const muteButton =
    document.getElementById("muteButton");

const progressContainer =
    document.getElementById("progressContainer");

const progressFilled =
    document.getElementById("progressFilled");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const player =
    document.getElementById("cinevaPlayer");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const topFullscreen =
    document.getElementById("topFullscreen");


/* Time */

function formatTime(seconds) {

    if (!isFinite(seconds))
        return "0:00";

    const hours = Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    if (hours > 0) {

        return `${hours}:${minutes
            .toString()
            .padStart(2,"0")}:${secs}`;

    }

    return `${minutes}:${secs}`;
}


/* Play / Pause */

playButton.addEventListener("click", () => {

    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }

});

video.addEventListener("play", () => {
    playButton.textContent = "❚❚";
});

video.addEventListener("pause", () => {
    playButton.textContent = "▶";
});


/* Click video */

video.addEventListener("click", () => {

    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }

});


/* Duration */

video.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(video.duration);

});


/* Progress */

video.addEventListener("timeupdate", () => {

    if (!video.duration)
        return;

    const percent =
        (video.currentTime / video.duration) * 100;

    progressFilled.style.width =
        percent + "%";

    currentTime.textContent =
        formatTime(video.currentTime);

});


/* Seek */

progressContainer.addEventListener("click", (e) => {

    const rect =
        progressContainer.getBoundingClientRect();

    const percent =
        (e.clientX - rect.left) / rect.width;

    video.currentTime =
        percent * video.duration;

});


/* Mute */

muteButton.addEventListener("click", () => {

    video.muted = !video.muted;

    muteButton.textContent =
        video.muted ? "🔇" : "🔊";

});


/* Fullscreen */

function fullscreen() {

    if (!document.fullscreenElement) {

        player.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

}

fullscreenButton.addEventListener(
    "click",
    fullscreen
);

topFullscreen.addEventListener(
    "click",
    fullscreen
);


/* Double click fullscreen */

video.addEventListener(
    "dblclick",
    fullscreen
);


/* Space = play/pause */

document.addEventListener("keydown", (e) => {

    if (
        e.code === "Space" &&
        document.activeElement.tagName !== "INPUT"
    ) {

        e.preventDefault();

        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }

    }

});


/* Arrow keys */

document.addEventListener("keydown", (e) => {

    if (e.key === "ArrowRight") {
        video.currentTime += 10;
    }

    if (e.key === "ArrowLeft") {
        video.currentTime -= 10;
    }

});

</script>
