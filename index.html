<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Browser tab logo -->
<link rel="icon" type="image/png" href="logo.png">

<title>CineView — Home</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');


* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Poppins, sans-serif;
    background: #050507;
    color: white;
}

body {
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        linear-gradient(
            90deg,
            rgba(5,5,8,.96),
            rgba(5,5,8,.68),
            rgba(5,5,8,.93)
        ),
        url("https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg");

    background-size: cover;
    background-position: center;

    filter: blur(2px);
    transform: scale(1.04);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.8) 100%
        );
}

/* NAVBAR */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1150px, calc(100% - 30px));
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(15,15,20,.58);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);

    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.5px;
}

.logo span {
    color: #ff3155;
}

.nav-links {
    display: flex;
    gap: 7px;
    margin-left: 32px;
}

.nav-links a {
    color: rgba(255,255,255,.6);

    text-decoration: none;

    padding: 9px 14px;

    border-radius: 10px;

    font-size: 13px;

    transition: .2s;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;
    background: rgba(255,255,255,.08);
}

.nav-spacer {
    flex: 1;
}

.nav-status {
    padding: 8px 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.55);

    font-size: 11px;
}

/* HERO */

.hero {
    min-height: 100vh;

    width: min(1150px, calc(100% - 30px));

    margin: auto;

    display: flex;
    align-items: center;

    padding-top: 80px;
}

.hero-content {
    max-width: 650px;

    animation:
        heroIn .7s ease forwards;
}

@keyframes heroIn {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 12px;

    border-radius: 100px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.1);

    color:
        rgba(255,255,255,.75);

    font-size: 11px;
}

.badge-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff3155;

    box-shadow:
        0 0 12px rgba(255,49,85,.9);
}

h1 {
    margin: 18px 0 12px;

    font-size:
        clamp(46px, 8vw, 82px);

    line-height: .95;

    letter-spacing: -4px;
}

.description {
    max-width: 540px;

    color:
        rgba(255,255,255,.62);

    font-size: 14px;

    line-height: 1.8;
}

.buttons {
    display: flex;
    gap: 10px;

    margin-top: 28px;
}

.watch-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 13px 21px;

    border-radius: 12px;

    background: #ff3155;

    color: white;

    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    box-shadow:
        0 10px 35px rgba(255,49,85,.25);

    transition:
        transform .2s,
        background .2s;
}

.watch-btn:hover {
    transform: translateY(-2px);
    background: #ff4565;
}

.info-btn {
    padding: 13px 21px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.07);

    color: white;

    font-family: Poppins;

    font-size: 13px;

    cursor: pointer;

    transition: .2s;
}

.info-btn:hover {
    background:
        rgba(255,255,255,.12);
}

/* MOBILE */

@media(max-width:700px) {

    .navbar {
        top: 10px;
        height: 58px;
        padding: 0 15px;
    }

    .nav-links {
        display: none;
    }

    .nav-status {
        display: none;
    }

    .hero {
        padding-top: 100px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<nav class="navbar">

    <div class="logo">
        Cine<span>View</span>
    </div>

    <div class="nav-links">

        <a
            href="index.html"
            class="active"
        >
            Home
        </a>

        <a href="watch.html">
            Watch
        </a>

    </div>

    <div class="nav-spacer"></div>

    <div class="nav-status">
        Featured
    </div>

</nav>

<main class="hero">

    <section class="hero-content">

        <div class="badge">
            <span class="badge-dot"></span>
            Featured Movie
        </div>

        <h1>
            Spider-Man
        </h1>

        <p class="description">
            Step into a cinematic experience with a
            glass-style interface, custom controls,
            fullscreen playback and subtitle support.
        </p>

        <div class="buttons">

            <a
                href="watch.html"
                class="watch-btn"
            >
                ▶&nbsp; Watch Now
            </a>

            <button
                class="info-btn"
                onclick="window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                })"
            >
                More Info
            </button>

        </div>

    </section>

</main>

</body>
</html>
