<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineView — Home</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Poppins, sans-serif;
    background: #050507;
    color: white;
}

body {
    overflow-x: hidden;
    scrollbar-width: none;
}

body::-webkit-scrollbar {
    display: none;
}

/* BACKGROUND */

.background {
    position: fixed;
    top: -35px;
    left: -35px;
    width: calc(100% + 70px);
    height: calc(100% + 70px);

    z-index: 0;

    background-image:
        linear-gradient(
            90deg,
            rgba(5,5,8,.72),
            rgba(5,5,8,.45),
            rgba(5,5,8,.72)
        ),
        url("BND.png");

    background-size: cover;
    background-position: center;

    filter: blur(5px);

    transform: translate3d(0,0,0) scale(1.08);

    will-change: transform;

    pointer-events: none;
}

.background::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 5%,
            rgba(0,0,0,.72) 100%
        );
}

/* NAVBAR */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1150px, calc(100% - 30px));
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 18px;

    background: rgba(15,15,20,.58);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);

    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.5px;
}

.logo img {
    width: 31px;
    height: 31px;

    object-fit: contain;

    border-radius: 8px;

    display: block;
}

.logo span {
    color: #ff3155;
}

.nav-links {
    display: flex;
    gap: 7px;
    margin-left: 32px;
}

.nav-links a {
    position: relative;

    color: rgba(255,255,255,.6);

    text-decoration: none;

    padding: 9px 14px;

    border-radius: 10px;

    font-size: 13px;

    transition: .2s;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;
    background: rgba(255,255,255,.08);
}

/* ACTIVE LINE */

.nav-links a.active::after {
    content: "";

    position: absolute;

    left: 14px;
    right: 14px;
    bottom: 2px;

    height: 2px;

    border-radius: 999px;

    background: rgba(255,255,255,.9);

    box-shadow:
        0 0 8px rgba(255,255,255,.25);
}

.nav-spacer {
    flex: 1;
}

.nav-status {
    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.05);

    border: 1px solid rgba(255,255,255,.07);

    color: rgba(255,255,255,.55);

    font-size: 11px;
}

/* HERO */

.hero {
    position: relative;

    z-index: 2;

    min-height: 100vh;

    width: min(1150px, calc(100% - 30px));

    margin: auto;

    display: flex;
    align-items: center;

    padding-top: 80px;
}

.hero-content {
    max-width: 650px;

    animation:
        heroIn .7s ease forwards;
}

@keyframes heroIn {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 12px;

    border-radius: 100px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);

    color: rgba(255,255,255,.75);

    font-size: 11px;
}

.badge-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff3155;

    box-shadow:
        0 0 12px rgba(255,49,85,.9);
}

h1 {
    margin: 18px 0 12px;

    font-size:
        clamp(46px, 8vw, 82px);

    line-height: .95;

    letter-spacing: -4px;
}

.description {
    max-width: 540px;

    color: rgba(255,255,255,.62);

    font-size: 14px;

    line-height: 1.8;
}

.buttons {
    display: flex;
    gap: 10px;

    margin-top: 28px;
}

.watch-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 13px 21px;

    border-radius: 12px;

    background: #ff3155;

    color: white;

    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    box-shadow:
        0 10px 35px rgba(255,49,85,.25);

    transition:
        transform .2s,
        background .2s,
        box-shadow .2s;
}

.watch-btn:hover {
    transform: translateY(-2px);

    background: #ff4565;

    box-shadow:
        0 14px 40px rgba(255,49,85,.35);
}

.info-btn {
    padding: 13px 21px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.07);

    color: white;

    font-family: Poppins;

    font-size: 13px;

    cursor: pointer;

    transition: .2s;
}

.info-btn:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-2px);
}

/* CUSTOM SCROLLBAR */

.custom-scrollbar {
    position: fixed;

    top: 0;
    right: 5px;

    width: 6px;
    height: 100vh;

    z-index: 9999;

    pointer-events: none;
}

.custom-scrollbar-thumb {
    position: absolute;

    top: 0;
    right: 0;

    width: 5px;
    min-height: 45px;

    border-radius: 999px;

    background: rgba(255,255,255,.3);

    box-shadow:
        0 0 10px rgba(255,255,255,.08);
}

/* MOBILE */

@media(max-width:700px) {

    .navbar {
        top: 10px;
        height: 58px;
        padding: 0 15px;
    }

    .logo {
        font-size: 18px;
    }

    .logo img {
        width: 27px;
        height: 27px;
    }

    .nav-links {
        display: none;
    }

    .nav-status {
        display: none;
    }

    .hero {
        padding-top: 100px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 13px;
    }

    .buttons {
        flex-wrap: wrap;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion: reduce) {

    .background {
        transform: scale(1.08) !important;
    }
}
</style>

</head>

<body>

<!-- BACKGROUND -->

<div
    class="background"
    id="background"
></div>

<!-- CUSTOM SCROLLBAR -->

<div class="custom-scrollbar">
    <div
        class="custom-scrollbar-thumb"
        id="scrollbarThumb"
    ></div>
</div>

<!-- NAVBAR -->

<nav class="navbar">

```
<div class="logo">

    <img
        src="logo.png"
        alt="CineView"
    >

    Cine<span>View</span>

</div>

<div class="nav-links">

    <a
        href="index.html"
        class="active"
    >
        Home
    </a>

    <a href="watch.html">
        Watch
    </a>

</div>

<div class="nav-spacer"></div>

<div class="nav-status">
    Featured
</div>
```

</nav>

<!-- HERO -->

<main class="hero">

```
<section class="hero-content">

    <div class="badge">

        <span class="badge-dot"></span>

        Featured Movie

    </div>

    <h1>
        Spider-Man
    </h1>

    <p class="description">

        Step into a cinematic experience with a
        glass-style interface, custom controls,
        fullscreen playback and subtitle support.

    </p>

    <div class="buttons">

        <a
            href="watch.html"
            class="watch-btn"
        >
            ▶&nbsp; Watch Now
        </a>

        <button
            class="info-btn"
            onclick="window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            })"
        >
            More Info
        </button>

    </div>

</section>
```

</main>

<script>

/* =========================
   MOUSE BACKGROUND EFFECT
========================= */

const background =
    document.getElementById(
        "background"
    );

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

document.addEventListener(
    "mousemove",
    (event) => {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;

        const y =
            (event.clientY /
            window.innerHeight) - 0.5;

        targetX = x * -24;
        targetY = y * -16;

    }
);

document.addEventListener(
    "mouseleave",
    () => {

        targetX = 0;
        targetY = 0;

    }
);

function animateBackground() {

    currentX +=
        (targetX - currentX) * 0.055;

    currentY +=
        (targetY - currentY) * 0.055;

    background.style.transform =
        `translate3d(
            ${currentX}px,
            ${currentY}px,
            0
        ) scale(1.08)`;

    requestAnimationFrame(
        animateBackground
    );
}

animateBackground();


/* =========================
   CUSTOM SCROLLBAR
========================= */

const scrollbarThumb =
    document.getElementById(
        "scrollbarThumb"
    );

function updateScrollbar() {

    const scrollHeight =
        document.documentElement.scrollHeight;

    const clientHeight =
        window.innerHeight;

    const scrollTop =
        window.scrollY;

    if (
        scrollHeight <= clientHeight
    ) {

        scrollbarThumb.style.display =
            "none";

        return;

    }

    scrollbarThumb.style.display =
        "block";

    const thumbHeight =
        Math.max(
            45,
            (
                clientHeight /
                scrollHeight
            ) * clientHeight
        );

    const maxTop =
        clientHeight -
        thumbHeight;

    const maxScroll =
        scrollHeight -
        clientHeight;

    const thumbTop =
        maxScroll > 0
            ? (
                scrollTop /
                maxScroll
            ) * maxTop
            : 0;

    scrollbarThumb.style.height =
        thumbHeight + "px";

    scrollbarThumb.style.transform =
        `translateY(${thumbTop}px)`;

}

window.addEventListener(
    "scroll",
    updateScrollbar,
    {
        passive: true
    }
);

window.addEventListener(
    "resize",
    updateScrollbar
);

updateScrollbar();

</script>

</body>
</html>
