<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const muteBtn =
    document.getElementById("muteBtn");

const volume =
    document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById(
        "closeSubtitlePanel"
    );

const chooseSubtitle =
    document.getElementById(
        "chooseSubtitle"
    );

const subtitleFile =
    document.getElementById(
        "subtitleFile"
    );

const subtitleStatus =
    document.getElementById(
        "subtitleStatus"
    );

const syncBack =
    document.getElementById(
        "syncBack"
    );

const syncForward =
    document.getElementById(
        "syncForward"
    );

const syncValue =
    document.getElementById(
        "syncValue"
    );

const resetSync =
    document.getElementById(
        "resetSync"
    );


/* =========================================================
   VARIABLES
========================================================= */

let subtitleTrack = null;

let originalVTTText = null;

let subtitleSync = 0;

let subtitleURL = null;

let lastUIUpdate = 0;


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${mins}:${secs}`;
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (video.paused) {

        video.play()
            .catch(() => {});

    } else {

        video.pause();

    }

}

playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);

video.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   PLAY STATE
========================================================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

        centerPlay.innerHTML =
            "<span>❚❚</span>";

    }
);

video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

        centerPlay.innerHTML =
            "<span>▶</span>";

    }
);


/* =========================================================
   METADATA
========================================================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);


/* =========================================================
   OPTIMIZED PROGRESS
========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        const now =
            performance.now();

        if (
            now - lastUIUpdate < 100
        ) {
            return;
        }

        lastUIUpdate = now;

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);


/* =========================================================
   PROGRESS SEEK
========================================================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                video.duration
            )
        ) {
            return;
        }

        video.currentTime =
            (
                progress.value / 100
            ) * video.duration;

    }
);


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted = false;

        updateMuteIcon();

    }
);

function updateMuteIcon() {

    muteBtn.textContent =
        video.muted ||
        video.volume === 0
            ? "🔇"
            : "🔊";

}

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await player.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   SUBTITLE MENU
========================================================= */

subtitleBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        subtitlePanel.classList.toggle(
            "active"
        );

    }
);

closeSubtitlePanel.addEventListener(
    "click",
    () => {

        subtitlePanel.classList.remove(
            "active"
        );

    }
);


/* =========================================================
   OPEN FILE PICKER
========================================================= */

chooseSubtitle.addEventListener(
    "click",
    () => {

        subtitleFile.click();

    }
);


/* =========================================================
   SRT → WEBVTT
========================================================= */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();


    /*
     * SRT:
     * 00:00:01,000
     *
     * WebVTT:
     * 00:00:01.000
     */

    vtt = vtt.replace(
        /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
        "$1.$2"
    );


    /*
     * Remove SRT cue numbers.
     */

    vtt = vtt.replace(
        /^\d+\s*$/gm,
        ""
    );


    return "WEBVTT\n\n" + vtt;
}


/* =========================================================
   LOAD SRT / VTT
========================================================= */

subtitleFile.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;
        }


        try {

            let subtitleText =
                await file.text();


            /*
             * Convert SRT automatically.
             */

            if (
                extension === "srt"
            ) {

                subtitleText =
                    srtToVtt(
                        subtitleText
                    );

            }


            originalVTTText =
                subtitleText;


            subtitleSync = 0;

            updateSyncDisplay();


            subtitleStatus.textContent =
                `Loaded: ${file.name}`;


            applySubtitleSync();


        } catch (error) {

            console.error(
                "Subtitle error:",
                error
            );

            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitleSync() {

    if (!originalVTTText) {
        return;
    }


    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );


    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );


    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }


    subtitleURL =
        URL.createObjectURL(
            blob
        );


    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }


    subtitleTrack =
        document.createElement(
            "track"
        );


    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "Subtitles";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        true;


    video.appendChild(
        subtitleTrack
    );


    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    "showing";

            }

        }
    );

}


/* =========================================================
   SHIFT VTT TIMING
========================================================= */

function shiftVTT(
    vtt,
    offset
) {

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;


    return vtt.replace(
        timestampRegex,
        (timestamp) => {

            const parts =
                timestamp.split(":");


            let hours = 0;
            let minutes = 0;
            let seconds = 0;


            if (
                parts.length === 3
            ) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }


            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;


            total =
                Math.max(
                    0,
                    total
                );


            const newHours =
                Math.floor(
                    total / 3600
                );


            const remaining =
                total % 3600;


            const newMinutes =
                Math.floor(
                    remaining / 60
                );


            const newSeconds =
                remaining % 60;


            return (

                String(newHours)
                    .padStart(2, "0")

                + ":"

                + String(newMinutes)
                    .padStart(2, "0")

                + ":"

                + newSeconds
                    .toFixed(3)
                    .padStart(6, "0")

            );

        }
    );
}


/* =========================================================
   SYNC DISPLAY
========================================================= */

function updateSyncDisplay() {

    let value =
        subtitleSync.toFixed(1);


    if (
        subtitleSync > 0
    ) {

        value =
            "+" + value;

    }


    syncValue.textContent =
        value + "s";

}


/* =========================================================
   SYNC BUTTONS
========================================================= */

syncBack.addEventListener(
    "click",
    () => {

        subtitleSync -= 0.5;

        updateSyncDisplay();

        applySubtitleSync();

    }
);


syncForward.addEventListener(
    "click",
    () => {

        subtitleSync += 0.5;

        updateSyncDisplay();

        applySubtitleSync();

    }
);


resetSync.addEventListener(
    "click",
    () => {

        subtitleSync = 0;

        updateSyncDisplay();

        applySubtitleSync();

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }


        /* Space / K = Play */

        if (
            event.key === " " ||
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            togglePlay();

            return;
        }


        /* M = Mute */

        if (
            event.key.toLowerCase() === "m"
        ) {

            event.preventDefault();

            video.muted =
                !video.muted;

            updateMuteIcon();

            return;
        }


        /* F = Fullscreen */

        if (
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            fullscreenBtn.click();

            return;
        }


        /* Left = -5 seconds */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            return;
        }


        /* Right = +5 seconds */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

            return;
        }


        /*
         * Subtitle sync keyboard controls.
         */

        if (
            !subtitlePanel.classList.contains(
                "active"
            )
        ) {
            return;
        }


        if (
            event.key === "["
        ) {

            subtitleSync -= 0.5;

            updateSyncDisplay();

            applySubtitleSync();

        }


        if (
            event.key === "]"
        ) {

            subtitleSync += 0.5;

            updateSyncDisplay();

            applySubtitleSync();

        }


        if (
            event.key === "\\"
        ) {

            subtitleSync = 0;

            updateSyncDisplay();

            applySubtitleSync();

        }

    }
);


/* =========================================================
   CLOSE SUBTITLE MENU
========================================================= */

document.addEventListener(
    "click",
    (event) => {

        if (
            !subtitlePanel.contains(
                event.target
            ) &&
            !subtitleBtn.contains(
                event.target
            )
        ) {

            subtitlePanel.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (subtitleURL) {

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateSyncDisplay();

updateMuteIcon();

</script>
