<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineView — Home</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    font-family: Poppins, sans-serif;

    background: transparent;
    color: white;
}

/* =========================
   CUSTOM SCROLLBAR
========================= */

html {
    scrollbar-width: thin;
    scrollbar-color:
        rgba(255,255,255,.28)
        rgba(255,255,255,.04);
}

html::-webkit-scrollbar {
    width: 7px;
}

html::-webkit-scrollbar-track {
    background: rgba(255,255,255,.025);
}

html::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.25);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
}

html::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,.42);
}

body {
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: -25px;

    z-index: -2;

    background-image:
        url("BND.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    filter: blur(8px);

    transform: scale(1.05);

    animation:
        backgroundFloat 18s ease-in-out infinite alternate;
}

.background::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(5,5,8,.52),
            rgba(5,5,8,.18),
            rgba(5,5,8,.58)
        );

    pointer-events: none;
}

@keyframes backgroundFloat {

    0% {
        transform:
            scale(1.05)
            translate3d(0,0,0);
    }

    50% {
        transform:
            scale(1.08)
            translate3d(-8px,4px,0);
    }

    100% {
        transform:
            scale(1.05)
            translate3d(8px,-4px,0);
    }
}

/* =========================
   NAVBAR
========================= */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(
            1150px,
            calc(100% - 30px)
        );

    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(15,15,20,.58);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.4);

    z-index: 100;

    animation:
        navbarIn .7s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes navbarIn {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(-20px)
            scale(.97);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}

/* =========================
   LOGO
========================= */

.logo {
    display: flex;
    align-items: center;
    justify-content: center;

    height: 44px;

    transition:
        transform .25s ease;
}

.logo:hover {
    transform:
        scale(1.05)
        rotate(-1deg);
}

.logo img {
    display: block;

    width: auto;
    height: 38px;

    max-width: 150px;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;
}

/* =========================
   NAV LINKS
========================= */

.nav-links {
    display: flex;

    gap: 7px;

    margin-left: 32px;
}

.nav-links a {
    position: relative;

    color:
        rgba(255,255,255,.6);

    text-decoration: none;

    padding:
        9px 14px;

    border-radius: 10px;

    font-size: 13px;

    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;
}

.nav-links a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 4px;

    width: 0;
    height: 2px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.8);

    transform:
        translateX(-50%);

    transition:
        width .25s ease;
}

.nav-links a:hover {
    color: white;

    background:
        rgba(255,255,255,.08);

    transform:
        translateY(-2px);
}

.nav-links a:hover::after,
.nav-links a.active::after {
    width: 18px;
}

.nav-links a.active {
    color: white;

    background:
        rgba(255,255,255,.08);
}

.nav-spacer {
    flex: 1;
}

/* =========================
   SETTINGS BUTTON
========================= */

.settings-button {
    width: 39px;
    height: 39px;

    margin-right: 9px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 11px;

    background:
        rgba(255,255,255,.055);

    color: white;

    cursor: pointer;

    font-size: 17px;

    transition:
        background .2s ease,
        transform .3s ease;
}

.settings-button:hover {
    background:
        rgba(255,255,255,.12);

    transform:
        rotate(45deg)
        scale(1.05);
}

/* =========================
   STATUS
========================= */

.nav-status {
    padding:
        8px 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.55);

    font-size: 11px;
}

/* =========================
   SETTINGS PANEL
========================= */

.settings-panel {
    position: fixed;

    top: 92px;
    right: 25px;

    width: 290px;

    padding: 18px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(12,12,17,.82);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

    z-index: 200;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-10px)
        scale(.96);

    transition:
        opacity .2s ease,
        transform .25s ease,
        visibility .25s;
}

.settings-panel.open {
    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

.settings-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 16px;
}

.settings-title strong {
    font-size: 14px;
}

.settings-title small {
    color:
        rgba(255,255,255,.4);

    font-size: 9px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 0;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.setting-info {
    display: flex;
    flex-direction: column;

    gap: 2px;
}

.setting-info strong {
    font-size: 12px;
}

.setting-info span {
    color:
        rgba(255,255,255,.4);

    font-size: 9px;
}

/* TOGGLE */

.toggle {
    position: relative;

    width: 43px;
    height: 24px;

    border: 0;

    border-radius: 30px;

    background:
        rgba(255,255,255,.15);

    cursor: pointer;

    transition:
        background .25s ease;
}

.toggle::after {
    content: "";

    position: absolute;

    top: 4px;
    left: 4px;

    width: 16px;
    height: 16px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.35);

    transition:
        transform .25s
        cubic-bezier(.16,1,.3,1);
}

.toggle.active {
    background:
        rgba(255,255,255,.4);
}

.toggle.active::after {
    transform:
        translateX(19px);
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;

    width:
        min(
            1150px,
            calc(100% - 30px)
        );

    margin: auto;

    display: flex;
    align-items: center;

    padding-top: 80px;
}

.hero-content {
    max-width: 650px;

    animation:
        heroIn .8s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes heroIn {

    0% {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.97);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================
   BADGE
========================= */

.badge {
    display: inline-flex;
    align-items: center;

    gap: 8px;

    padding:
        7px 12px;

    border-radius: 100px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:
        rgba(255,255,255,.75);

    font-size: 11px;

    animation:
        badgeIn .7s
        .15s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes badgeIn {

    from {
        opacity: 0;
        transform:
            translateY(12px)
            scale(.9);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.badge-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff3155;

    box-shadow:
        0 0 12px
        rgba(255,49,85,.9);

    animation:
        dotPulse 1.8s
        ease-in-out
        infinite;
}

@keyframes dotPulse {

    0%,
    100% {
        transform: scale(1);
        opacity: .7;
    }

    50% {
        transform: scale(1.5);
        opacity: 1;
    }
}

/* =========================
   TITLE
========================= */

h1 {
    margin:
        18px 0 12px;

    font-size:
        clamp(
            46px,
            8vw,
            82px
        );

    line-height: .95;

    letter-spacing: -4px;

    animation:
        titleIn .8s
        .08s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes titleIn {

    from {
        opacity: 0;
        transform:
            translateY(25px);
        filter:
            blur(10px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
        filter:
            blur(0);
    }
}

/* =========================
   DESCRIPTION
========================= */

.description {
    max-width: 540px;

    color:
        rgba(255,255,255,.72);

    font-size: 14px;

    line-height: 1.8;

    animation:
        descriptionIn .7s
        .22s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes descriptionIn {

    from {
        opacity: 0;
        transform:
            translateY(18px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 28px;

    animation:
        buttonsIn .7s
        .3s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes buttonsIn {

    from {
        opacity: 0;
        transform:
            translateY(18px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.watch-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding:
        13px 21px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.16);

    color: white;

    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.18);

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.watch-btn:hover {
    transform:
        translateY(-4px)
        scale(1.025);

    background:
        rgba(255,255,255,.2);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.3);
}

.watch-btn:active {
    transform:
        translateY(0)
        scale(.97);
}

.info-btn {
    padding:
        13px 21px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.07);

    color: white;

    font-family: Poppins;

    font-size: 13px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease;
}

.info-btn:hover {
    background:
        rgba(255,255,255,.13);

    transform:
        translateY(-4px);
}

.info-btn:active {
    transform:
        scale(.97);
}

/* =========================
   ANIMATION OFF
========================= */

html.animations-off *,
html.animations-off *::before,
html.animations-off *::after {
    animation: none !important;

    transition: none !important;

    scroll-behavior: auto !important;
}

html.animations-off .background {
    transform: scale(1.05) !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .navbar {
        top: 10px;

        height: 58px;

        padding: 0 15px;
    }

    .logo img {
        height: 32px;

        max-width: 120px;
    }

    .nav-links {
        display: none;
    }

    .nav-status {
        display: none;
    }

    .settings-button {
        margin-right: 0;
    }

    .settings-panel {
        top: 76px;
        right: 12px;

        width:
            calc(100% - 24px);
    }

    .hero {
        padding-top: 100px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 13px;
    }

    .background {
        inset: -25px;

        filter: blur(8px);

        background-position:
            center center;
    }

    .buttons {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        <img
            src="logo.png"
            alt="CineView"
        >
    </div>

    <div class="nav-links">

        <a
            href="index.html"
            class="active"
        >
            Home
        </a>

        <a href="watch.html">
            Watch
        </a>

    </div>

    <div class="nav-spacer"></div>

    <!-- SETTINGS -->

    <button
        class="settings-button"
        id="settingsButton"
        aria-label="Settings"
    >
        ⚙
    </button>

    <div class="nav-status">
        Featured
    </div>

</nav>


<!-- SETTINGS PANEL -->

<div
    class="settings-panel"
    id="settingsPanel"
>

    <div class="settings-title">

        <div>
            <strong>Settings</strong>

            <small>
                CineView preferences
            </small>
        </div>

    </div>

    <div class="setting-row">

        <div class="setting-info">

            <strong>
                Animations
            </strong>

            <span>
                Page and interface animations
            </span>

        </div>

        <button
            class="toggle active"
            id="animationToggle"
            aria-label="Toggle animations"
        ></button>

    </div>

</div>


<!-- HERO -->

<main class="hero">

    <section class="hero-content">

        <div class="badge">

            <span class="badge-dot"></span>

            Featured Movie

        </div>

        <h1>
            Spider-Man
        </h1>

        <p class="description">
            Step into a cinematic experience with a
            glass-style interface, custom controls,
            fullscreen playback and subtitle support.
        </p>

        <div class="buttons">

            <a
                href="watch.html"
                class="watch-btn"
            >
                ▶&nbsp; Watch Now
            </a>

            <button
                class="info-btn"
                onclick="window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                })"
            >
                More Info
            </button>

        </div>

    </section>

</main>


<script>

/* =========================
   SETTINGS
========================= */

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const settingsPanel =
    document.getElementById(
        "settingsPanel"
    );

const animationToggle =
    document.getElementById(
        "animationToggle"
    );

const html =
    document.documentElement;


/* =========================
   LOAD SETTINGS
========================= */

let animationsEnabled =
    localStorage.getItem(
        "cineview-animations"
    ) !== "false";


function updateAnimationSetting() {

    if (animationsEnabled) {

        html.classList.remove(
            "animations-off"
        );

        animationToggle.classList.add(
            "active"
        );

    } else {

        html.classList.add(
            "animations-off"
        );

        animationToggle.classList.remove(
            "active"
        );

    }

}


/* =========================
   TOGGLE ANIMATIONS
========================= */

animationToggle.addEventListener(
    "click",
    () => {

        animationsEnabled =
            !animationsEnabled;

        localStorage.setItem(
            "cineview-animations",
            animationsEnabled
        );

        updateAnimationSetting();

    }
);


/* =========================
   SETTINGS OPEN
========================= */

settingsButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        settingsPanel.classList.toggle(
            "open"
        );

    }
);


/* =========================
   CLOSE SETTINGS
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            !settingsPanel.contains(event.target) &&
            !settingsButton.contains(event.target)
        ) {

            settingsPanel.classList.remove(
                "open"
            );

        }

    }
);


/* =========================
   INITIALIZE
========================= */

updateAnimationSetting();

</script>

</body>
</html>
