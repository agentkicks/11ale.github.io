<script>

/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("video");

const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");

const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const muteBtn = document.getElementById("muteBtn");
const volume = document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const player =
    document.getElementById("customPlayer");


/* Subtitle elements */

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById("closeSubtitlePanel");

const chooseSubtitle =
    document.getElementById("chooseSubtitle");

const subtitleFile =
    document.getElementById("subtitleFile");

const subtitleStatus =
    document.getElementById("subtitleStatus");


/* Sync */

const syncBack =
    document.getElementById("syncBack");

const syncForward =
    document.getElementById("syncForward");

const syncValue =
    document.getElementById("syncValue");

const resetSync =
    document.getElementById("resetSync");


/* =========================
   VARIABLES
========================= */

let subtitleTrack = null;

let subtitleSync = 0;


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${mins}:${secs}`;
}


/* =========================
   PLAY / PAUSE
========================= */

playBtn.addEventListener("click", () => {

    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }

});


video.addEventListener("play", () => {

    playBtn.textContent = "❚❚";

});


video.addEventListener("pause", () => {

    playBtn.textContent = "▶";

});


/* =========================
   VIDEO METADATA
========================= */

video.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(video.duration);

});


/* =========================
   TIME UPDATE
========================= */

video.addEventListener("timeupdate", () => {

    currentTime.textContent =
        formatTime(video.currentTime);

    if (video.duration) {

        progress.value =
            (video.currentTime / video.duration) * 100;

    }

});


/* =========================
   PROGRESS
========================= */

progress.addEventListener("input", () => {

    video.currentTime =
        (progress.value / 100) *
        video.duration;

});


/* =========================
   VOLUME
========================= */

volume.addEventListener("input", () => {

    video.volume =
        Number(volume.value);

    video.muted = false;

    if (video.volume === 0) {

        muteBtn.textContent = "🔇";

    } else {

        muteBtn.textContent = "🔊";

    }

});


/* =========================
   MUTE
========================= */

muteBtn.addEventListener("click", () => {

    video.muted =
        !video.muted;

    muteBtn.textContent =
        video.muted
            ? "🔇"
            : "🔊";

});


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener("click", () => {

    if (!document.fullscreenElement) {

        if (player.requestFullscreen) {
            player.requestFullscreen();
        }

    } else {

        document.exitFullscreen();

    }

});


/* =========================
   VIDEO CLICK
========================= */

video.addEventListener("click", () => {

    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }

});


/* =========================
   SUBTITLE PANEL
========================= */

subtitleBtn.addEventListener("click", () => {

    subtitlePanel.classList.toggle("active");

});


closeSubtitlePanel.addEventListener("click", () => {

    subtitlePanel.classList.remove("active");

});


/* =========================
   CHOOSE VTT
========================= */

chooseSubtitle.addEventListener("click", () => {

    subtitleFile.click();

});


subtitleFile.addEventListener("change", (event) => {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    if (
        !file.name.toLowerCase().endsWith(".vtt")
    ) {

        subtitleStatus.textContent =
            "Please choose a .vtt file";

        return;

    }


    /* Remove previous track */

    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }


    /* Create object URL */

    const subtitleURL =
        URL.createObjectURL(file);


    /* Create new track */

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        file.name;

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        true;


    video.appendChild(
        subtitleTrack
    );


    subtitleStatus.textContent =
        `Loaded: ${file.name}`;


    /*
       Wait for browser to load
       the VTT before enabling it.
    */

    subtitleTrack.addEventListener(
        "load",
        () => {

            subtitleTrack.track.mode =
                "showing";

        }
    );

});


/* =========================
   SUBTITLE SYNC
========================= */

/*
   Positive value:
   subtitles appear later.

   Negative value:
   subtitles appear earlier.
*/

function updateSyncDisplay() {

    let text =
        subtitleSync.toFixed(1);

    if (subtitleSync > 0) {
        text = "+" + text;
    }

    text += "s";

    syncValue.textContent =
        text;

}


/*
   Important:
   Native browser WebVTT tracks don't
   provide a built-in timing offset.

   We therefore rebuild the VTT cues
   whenever the sync value changes.
*/

let originalVTTText = null;


/* =========================
   READ VTT FILE
========================= */

subtitleFile.addEventListener("change", async (event) => {

    const file =
        event.target.files[0];

    if (!file) return;

    try {

        originalVTTText =
            await file.text();

    } catch (error) {

        console.error(
            "Could not read subtitle file:",
            error
        );

    }

});


/* =========================
   SYNC FUNCTION
========================= */

function applySubtitleSync() {

    if (!originalVTTText) {
        return;
    }


    /*
       Modify timestamps inside
       the VTT file.
    */

    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );


    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );


    const newURL =
        URL.createObjectURL(blob);


    /*
       Remove old track.
    */

    if (subtitleTrack) {

        subtitleTrack.remove();

    }


    /*
       Create replacement track.
    */

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "Subtitles";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        newURL;

    subtitleTrack.default =
        true;


    video.appendChild(
        subtitleTrack
    );


    subtitleTrack.addEventListener(
        "load",
        () => {

            subtitleTrack.track.mode =
                "showing";

        }
    );

}


/* =========================
   SHIFT VTT TIMESTAMPS
========================= */

function shiftVTT(vtt, offset) {

    /*
       Matches:

       00:01:23.456

       and

       01:23.456
    */

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;


    return vtt.replace(
        timestampRegex,
        (timestamp) => {

            const parts =
                timestamp.split(":");


            let hours = 0;
            let minutes;
            let seconds;


            if (parts.length === 3) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }


            let total =
                hours * 3600 +
                minutes * 60 +
                seconds;


            total += offset;


            /*
               Prevent negative timestamps.
            */

            total =
                Math.max(0, total);


            const newHours =
                Math.floor(
                    total / 3600
                );

            total %= 3600;


            const newMinutes =
                Math.floor(
                    total / 60
                );

            const newSeconds =
                total % 60;


            const formattedSeconds =
                newSeconds
                    .toFixed(3)
                    .padStart(6, "0");


            return (
                String(newHours).padStart(2, "0")
                + ":" +
                String(newMinutes).padStart(2, "0")
                + ":" +
                formattedSeconds
            );

        }
    );

}


/* =========================
   -0.5 SECONDS
========================= */

syncBack.addEventListener("click", () => {

    subtitleSync -= 0.5;

    updateSyncDisplay();

    applySubtitleSync();

});


/* =========================
   +0.5 SECONDS
========================= */

syncForward.addEventListener("click", () => {

    subtitleSync += 0.5;

    updateSyncDisplay();

    applySubtitleSync();

});


/* =========================
   RESET SYNC
========================= */

resetSync.addEventListener("click", () => {

    subtitleSync = 0;

    updateSyncDisplay();

    applySubtitleSync();

});


/* =========================
   KEYBOARD SHORTCUTS
========================= */

/*
   While the subtitle panel is open:

   [ = subtitles earlier
   ] = subtitles later
   \ = reset
*/

document.addEventListener("keydown", (event) => {

    if (
        !subtitlePanel.classList.contains("active")
    ) {
        return;
    }


    if (event.key === "[") {

        subtitleSync -= 0.5;

        updateSyncDisplay();

        applySubtitleSync();

    }


    if (event.key === "]") {

        subtitleSync += 0.5;

        updateSyncDisplay();

        applySubtitleSync();

    }


    if (event.key === "\\") {

        subtitleSync = 0;

        updateSyncDisplay();

        applySubtitleSync();

    }

});


/* =========================
   INITIAL SYNC DISPLAY
========================= */

updateSyncDisplay();

</script>
```
