<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobalt Player</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    font-family:Poppins,Arial,sans-serif;
    background:#050507;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:68px;
    padding:0 28px;
    display:flex;
    align-items:center;
    z-index:100;
    background:linear-gradient(
        to bottom,
        rgba(5,5,8,.96),
        rgba(5,5,8,.78)
    );
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.site-brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
    letter-spacing:-.4px;
}

.brand-mark{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:linear-gradient(135deg,#e50914,#075cff);
    box-shadow:0 5px 18px rgba(229,9,20,.2);
    font-size:15px;
}

.site-nav{
    display:flex;
    align-items:center;
    gap:4px;
    margin-left:38px;
}

.nav-item{
    border:0;
    background:transparent;
    color:rgba(255,255,255,.55);
    padding:9px 14px;
    border-radius:9px;
    font-family:inherit;
    font-size:12px;
    font-weight:500;
    cursor:pointer;
    transition:.15s ease;
}

.nav-item:hover,
.nav-item.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
    margin-left:auto;
}

.header-btn{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.055);
    color:#fff;
    cursor:pointer;
    transition:.15s ease;
}

.header-btn:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.header-btn:active{
    transform:scale(.92);
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-menu{
    position:absolute;
    top:59px;
    right:20px;
    width:310px;
    padding:17px;
    border-radius:17px;
    background:rgba(12,12,18,.98);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 55px rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-7px) scale(.97);
    pointer-events:none;
    transition:.16s ease;
}

.settings-menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.settings-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.settings-heading strong{
    display:block;
    font-size:14px;
}

.settings-heading small{
    display:block;
    margin-top:2px;
    color:rgba(255,255,255,.4);
    font-size:9px;
}

.settings-heading button{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:19px;
    cursor:pointer;
}

.settings-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 3px;
}

.settings-option strong{
    display:block;
    font-size:11px;
}

.settings-option small{
    display:block;
    margin-top:2px;
    color:rgba(255,255,255,.4);
    font-size:9px;
}

.switch{
    position:relative;
    width:38px;
    height:21px;
    flex-shrink:0;
}

.switch input{
    display:none;
}

.switch span{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    cursor:pointer;
    transition:.15s ease;
}

.switch span:before{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.15s ease;
}

.switch input:checked+span{
    background:linear-gradient(135deg,#e50914,#075cff);
}

.switch input:checked+span:before{
    transform:translateX(17px);
}

.settings-divider{
    height:1px;
    margin:7px 0 9px;
    background:rgba(255,255,255,.07);
}

.settings-action{
    width:100%;
    height:39px;
    border:0;
    border-radius:9px;
    background:rgba(255,255,255,.05);
    color:#fff;
    font-family:inherit;
    font-size:10px;
    font-weight:600;
    cursor:pointer;
}

.settings-action:hover{
    background:rgba(255,255,255,.1);
}

/* =========================================================
   PAGE
========================================================= */

.watch-page{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:105px 20px 50px;
    overflow:hidden;
    isolation:isolate;
}

.poster-background{
    position:fixed;
    inset:0;
    z-index:-5;
    background-image:
        linear-gradient(
            rgba(5,5,7,.65),
            rgba(5,5,7,.88)
        ),
        url("https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg");
    background-size:cover;
    background-position:center;
    opacity:.55;
    pointer-events:none;
}

.watch-page:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;
    background:radial-gradient(
        circle at center,
        transparent 10%,
        rgba(0,0,0,.65) 100%
    );
}

/* =========================================================
   PLAYER
========================================================= */

.custom-player{
    position:relative;
    width:min(1100px,100%);
    aspect-ratio:16/9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    isolation:isolate;
    box-shadow:0 20px 55px rgba(0,0,0,.65);
    animation:playerAppear .35s ease-out;
}

@keyframes playerAppear{
    from{opacity:0}
    to{opacity:1}
}

.custom-player video{
    position:relative;
    z-index:2;
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    outline:none;
}

/* =========================================================
   PLAYER TOP
========================================================= */

.top-overlay{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:22px 24px;
    z-index:10;
    pointer-events:none;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        transparent
    );
}

.video-title{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    font-weight:600;
    text-shadow:0 2px 8px rgba(0,0,0,.7);
}

.title-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff1744;
    box-shadow:0 0 8px #ff1744;
}

/* =========================================================
   CENTER PLAY
========================================================= */

.center-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
    background:rgba(10,10,15,.82);
    color:#fff;
    font-size:25px;
    cursor:pointer;
    z-index:12;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
}

.custom-player:hover .center-play{
    opacity:.95;
    pointer-events:auto;
}

.center-play:hover{
    background:linear-gradient(135deg,#ff1744,#075cff);
    transform:translate(-50%,-50%) scale(1.06);
}

/* =========================================================
   CONTROLS
========================================================= */

.video-controls{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    min-height:82px;
    padding:30px 18px 13px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:20;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,.9) 65%
    );
}

.control-left,
.control-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.control-right{
    margin-left:auto;
}

.control-btn{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:10px;
    color:#fff;
    background:rgba(255,255,255,.055);
    cursor:pointer;
    font-family:inherit;
    transition:.15s ease;
}

.control-btn:hover{
    background:rgba(255,255,255,.15);
}

.control-btn:active{
    transform:scale(.92);
}

.cc-btn{
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
}

.video-controls span{
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
    color:rgba(255,255,255,.82);
}

.time-separator{
    opacity:.35;
}

.progress-wrap{
    flex:1;
    display:flex;
    align-items:center;
    min-width:80px;
}

input[type=range]{
    appearance:none;
    -webkit-appearance:none;
    height:4px;
    border-radius:20px;
    cursor:pointer;
    outline:none;
    background:rgba(255,255,255,.22);
}

#progress{
    width:100%;
}

#volume{
    width:75px;
}

input[type=range]::-webkit-slider-thumb{
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#fff;
}

input[type=range]::-moz-range-thumb{
    width:13px;
    height:13px;
    border:0;
    border-radius:50%;
    background:#fff;
}

/* =========================================================
   SUBTITLE PANEL
========================================================= */

.subtitle-panel{
    position:absolute;
    right:18px;
    bottom:76px;
    width:290px;
    padding:17px;
    border-radius:17px;
    background:rgba(12,12,18,.98);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 15px 40px rgba(0,0,0,.6);
    color:#fff;
    z-index:50;
    opacity:0;
    transform:translateY(10px) scale(.97);
    pointer-events:none;
    transition:.2s ease;
}

.subtitle-panel.active{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.subtitle-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.subtitle-header strong{
    display:block;
    font-size:15px;
}

.subtitle-header small{
    display:block;
    margin-top:2px;
    font-size:10px;
    color:rgba(255,255,255,.45);
}

.subtitle-header button{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.subtitle-file-btn{
    width:100%;
    height:43px;
    border:0;
    border-radius:11px;
    background:linear-gradient(
        135deg,
        #e50914,
        #ff1e2d 45%,
        #075cff
    );
    color:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
}

.subtitle-file-btn span{
    margin-right:5px;
}

.subtitle-status{
    margin-top:9px;
    padding:8px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.5);
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.setting-divider{
    height:1px;
    margin:15px 0;
    background:rgba(255,255,255,.08);
}

.sync-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
    font-size:11px;
    font-weight:600;
}

.sync-help{
    color:rgba(255,255,255,.35);
    font-size:9px;
    font-weight:400;
}

.sync-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.sync-controls button{
    flex:1;
    height:37px;
    border:0;
    border-radius:9px;
    background:rgba(255,255,255,.07);
    color:#fff;
    font-family:inherit;
    font-size:10px;
    cursor:pointer;
}

#syncValue{
    min-width:54px;
    text-align:center;
    font-family:monospace;
    font-size:12px;
    font-weight:600;
}

.reset-sync{
    width:100%;
    margin-top:8px;
    height:32px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:rgba(255,255,255,.45);
    font-family:inherit;
    font-size:10px;
    cursor:pointer;
}

/* =========================================================
   SUBTITLES
========================================================= */

video::cue{
    background:rgba(0,0,0,.72);
    color:#fff;
    font-family:Poppins,Arial,sans-serif;
    font-size:1.05em;
    font-weight:500;
    text-shadow:0 2px 5px rgba(0,0,0,.8);
}

/* =========================================================
   FULLSCREEN
========================================================= */

.custom-player:fullscreen{
    width:100vw;
    height:100vh;
    max-width:none;
    border-radius:0;
    box-shadow:none;
}

.custom-player:fullscreen video{
    width:100%;
    height:100%;
    object-fit:contain;
}

body:has(.custom-player:fullscreen) .poster-background{
    opacity:0;
    visibility:hidden;
}

/* =========================================================
   PERFORMANCE
========================================================= */

.performance-mode .poster-background,
.performance-mode .watch-page:after{
    display:none;
}

.performance-mode *{
    animation:none!important;
    transition:none!important;
}

.no-animations *,
.no-animations *:before,
.no-animations *:after{
    animation:none!important;
    transition:none!important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .site-header{
        height:58px;
        padding:0 12px;
    }

    .site-brand{
        font-size:14px;
    }

    .brand-mark{
        width:30px;
        height:30px;
    }

    .site-nav{
        display:none;
    }

    .header-btn{
        width:34px;
        height:34px;
    }

    .settings-menu{
        top:54px;
        right:10px;
        width:min(310px,calc(100vw - 20px));
    }

    .watch-page{
        padding:78px 12px 12px;
    }

    .custom-player{
        border-radius:14px;
    }

    .video-controls{
        min-height:68px;
        padding:24px 9px 8px;
        gap:5px;
    }

    .control-btn{
        width:32px;
        height:32px;
        border-radius:8px;
    }

    #volume{
        display:none;
    }

    .video-controls span{
        font-size:9px;
    }

    .subtitle-panel{
        right:8px;
        bottom:62px;
        width:min(290px,calc(100% - 16px));
    }

    .center-play{
        width:58px;
        height:58px;
        font-size:20px;
    }

    .top-overlay{
        padding:12px 14px;
    }

    .video-title{
        font-size:10px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *:before,
    *:after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="site-brand">
        <div class="brand-mark">C</div>
        <span>Cobalt</span>
    </div>

    <nav class="site-nav">
        <button class="nav-item active">Home</button>
        <button class="nav-item">Movies</button>
        <button class="nav-item">TV Shows</button>
    </nav>

    <div class="header-actions">

        <button
            class="header-btn"
            id="searchBtn"
            title="Search"
        >
            🔎
        </button>

        <button
            class="header-btn"
            id="settingsBtn"
            title="Settings"
        >
            ⚙
        </button>

    </div>

    <div
        class="settings-menu"
        id="settingsMenu"
    >

        <div class="settings-heading">

            <div>
                <strong>Player Settings</strong>
                <small>Customize playback</small>
            </div>

            <button id="closeSettings">×</button>

        </div>

        <div class="settings-option">

            <div>
                <strong>Animations</strong>
                <small>Interface animations</small>
            </div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="animationsToggle"
                    checked
                >
                <span></span>
            </label>

        </div>

        <div class="settings-option">

            <div>
                <strong>Background</strong>
                <small>Show movie background</small>
            </div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="backgroundToggle"
                    checked
                >
                <span></span>
            </label>

        </div>

        <div class="settings-option">

            <div>
                <strong>Autoplay</strong>
                <small>Start video automatically</small>
            </div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="autoplayToggle"
                >
                <span></span>
            </label>

        </div>

        <div class="settings-divider"></div>

        <button
            class="settings-action"
            id="performanceBtn"
        >
            ⚡ Performance Mode
        </button>

    </div>

</header>


<!-- =========================================================
     WATCH PAGE
========================================================= -->

<div class="watch-page">

    <div class="poster-background"></div>

    <div
        class="custom-player"
        id="customPlayer"
    >

        <video
            id="video"
            playsinline
            preload="none"
        >

            <source
                src="https://wild-frost-90b0.icarus035.workers.dev/?data=UszpJnE9DIU7yZAetkQaDyJzqXpF0cIOLu3KXP7BaEEGEA7BwSE0isXn1BDgYpUTaGwg1s03wn1BkpHMdIM0bAbmaCTWw1N04Af3FOPEBGhFQkVbADkppo5GR0D46Sq0Q--Gt6gE2VbMGdlWaKNB0W3hwCG3ieL0ZVondAMhGiEZQhIZJtgAy-0KzoGdIt8ML9NF2lIV5A"
                type="video/mp4"
            >

        </video>


        <input
            type="file"
            id="subtitleFile"
            accept=".srt,.vtt,text/vtt,application/x-subrip"
            hidden
        >


        <button
            class="center-play"
            id="centerPlay"
        >
            <span>▶</span>
        </button>


        <div class="top-overlay">

            <div class="video-title">

                <span class="title-dot"></span>

                Now Playing

            </div>

        </div>


        <!-- SUBTITLE PANEL -->

        <div
            class="subtitle-panel"
            id="subtitlePanel"
        >

            <div class="subtitle-header">

                <div>
                    <strong>Subtitles</strong>
                    <small>SRT / VTT • Playback settings</small>
                </div>

                <button id="closeSubtitlePanel">
                    ×
                </button>

            </div>

            <button
                class="subtitle-file-btn"
                id="chooseSubtitle"
            >
                <span>＋</span>
                Import Subtitle
            </button>

            <div
                class="subtitle-status"
                id="subtitleStatus"
            >
                No subtitles loaded
            </div>

            <div class="setting-divider"></div>

            <div class="sync-title">

                <span>Subtitle Sync</span>

                <span class="sync-help">
                    Adjust timing
                </span>

            </div>

            <div class="sync-controls">

                <button id="syncBack">
                    −0.5s
                </button>

                <div id="syncValue">
                    0.0s
                </div>

                <button id="syncForward">
                    +0.5s
                </button>

            </div>

            <button
                class="reset-sync"
                id="resetSync"
            >
                Reset Sync
            </button>

        </div>


        <!-- CONTROLS -->

        <div class="video-controls">

            <div class="control-left">

                <button
                    id="playBtn"
                    class="control-btn"
                >
                    ▶
                </button>

                <button
                    id="muteBtn"
                    class="control-btn"
                >
                    🔊
                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step=".01"
                    value="1"
                >

                <span id="currentTime">
                    0:00
                </span>

                <span class="time-separator">
                    /
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="progress-wrap">

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>


            <div class="control-right">

                <button
                    id="subtitleBtn"
                    class="control-btn cc-btn"
                >
                    CC
                </button>

                <button
                    id="fullscreenBtn"
                    class="control-btn"
                >
                    ⛶
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const muteBtn =
    document.getElementById("muteBtn");

const volume =
    document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById("closeSubtitlePanel");

const chooseSubtitle =
    document.getElementById("chooseSubtitle");

const subtitleFile =
    document.getElementById("subtitleFile");

const subtitleStatus =
    document.getElementById("subtitleStatus");

const syncBack =
    document.getElementById("syncBack");

const syncForward =
    document.getElementById("syncForward");

const syncValue =
    document.getElementById("syncValue");

const resetSync =
    document.getElementById("resetSync");


/* SETTINGS */

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsMenu =
    document.getElementById("settingsMenu");

const closeSettings =
    document.getElementById("closeSettings");

const animationsToggle =
    document.getElementById("animationsToggle");

const backgroundToggle =
    document.getElementById("backgroundToggle");

const autoplayToggle =
    document.getElementById("autoplayToggle");

const performanceBtn =
    document.getElementById("performanceBtn");


/* =========================================================
   VARIABLES
========================================================= */

let subtitleTrack = null;
let originalVTTText = null;
let subtitleSync = 0;
let subtitleURL = null;
let lastUIUpdate = 0;


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${mins}:${secs}`;
}


/* =========================================================
   PLAY
========================================================= */

function togglePlay(){

    if(video.paused){

        video.play().catch(()=>{});

    }else{

        video.pause();

    }
}

playBtn.addEventListener("click",togglePlay);
centerPlay.addEventListener("click",togglePlay);
video.addEventListener("click",togglePlay);


video.addEventListener("play",()=>{

    playBtn.textContent="❚❚";
    centerPlay.innerHTML="<span>❚❚</span>";

});

video.addEventListener("pause",()=>{

    playBtn.textContent="▶";
    centerPlay.innerHTML="<span>▶</span>";

});


/* =========================================================
   METADATA
========================================================= */

video.addEventListener("loadedmetadata",()=>{

    duration.textContent =
        formatTime(video.duration);

});


/* =========================================================
   PROGRESS
========================================================= */

video.addEventListener("timeupdate",()=>{

    const now =
        performance.now();

    if(now-lastUIUpdate<100){
        return;
    }

    lastUIUpdate=now;

    currentTime.textContent =
        formatTime(video.currentTime);

    if(
        Number.isFinite(video.duration) &&
        video.duration>0
    ){

        progress.value =
            (video.currentTime/video.duration)*100;

    }

});


progress.addEventListener("input",()=>{

    if(!Number.isFinite(video.duration)){
        return;
    }

    video.currentTime =
        (progress.value/100)*video.duration;

});


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener("input",()=>{

    video.volume =
        Number(volume.value);

    video.muted=false;

    updateMuteIcon();

});


function updateMuteIcon(){

    muteBtn.textContent =
        video.muted || video.volume===0
            ? "🔇"
            : "🔊";

}


muteBtn.addEventListener("click",()=>{

    video.muted=!video.muted;

    updateMuteIcon();

});


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener("click",async()=>{

    try{

        if(!document.fullscreenElement){

            await player.requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        console.error("Fullscreen error:",error);

    }

});


/* =========================================================
   SUBTITLE MENU
========================================================= */

subtitleBtn.addEventListener("click",event=>{

    event.stopPropagation();

    subtitlePanel.classList.toggle("active");

});

closeSubtitlePanel.addEventListener("click",()=>{

    subtitlePanel.classList.remove("active");

});


chooseSubtitle.addEventListener("click",()=>{

    subtitleFile.click();

});


/* =========================================================
   SRT → VTT
========================================================= */

function srtToVtt(srt){

    let vtt =
        srt
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .trim();

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    vtt =
        vtt.replace(/^\d+\s*$/gm,"");

    return "WEBVTT\n\n"+vtt;

}


/* =========================================================
   LOAD SUBTITLES
========================================================= */

subtitleFile.addEventListener("change",async event=>{

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();

    if(
        extension!=="srt" &&
        extension!=="vtt"
    ){

        subtitleStatus.textContent =
            "Please select an SRT or VTT file.";

        subtitleFile.value="";

        return;
    }

    try{

        let subtitleText =
            await file.text();

        if(extension==="srt"){

            subtitleText =
                srtToVtt(subtitleText);

        }

        originalVTTText =
            subtitleText;

        subtitleSync=0;

        updateSyncDisplay();

        subtitleStatus.textContent =
            `Loaded: ${file.name}`;

        applySubtitleSync();

    }catch(error){

        console.error(error);

        subtitleStatus.textContent =
            "Could not read subtitle file.";

    }

});


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitleSync(){

    if(!originalVTTText){
        return;
    }

    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob =
        new Blob(
            [syncedVTT],
            {type:"text/vtt"}
        );

    if(subtitleURL){

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    if(subtitleTrack){

        subtitleTrack.remove();

        subtitleTrack=null;

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind="subtitles";
    subtitleTrack.label="Subtitles";
    subtitleTrack.srclang="en";
    subtitleTrack.src=subtitleURL;
    subtitleTrack.default=true;

    video.appendChild(subtitleTrack);

    subtitleTrack.addEventListener("load",()=>{

        if(
            subtitleTrack &&
            subtitleTrack.track
        ){

            subtitleTrack.track.mode="showing";

        }

    });

}


/* =========================================================
   SHIFT SUBTITLES
========================================================= */

function shiftVTT(vtt,offset){

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;

    return vtt.replace(
        timestampRegex,
        timestamp=>{

            const parts =
                timestamp.split(":");

            let hours=0;
            let minutes=0;
            let seconds=0;

            if(parts.length===3){

                hours=Number(parts[0]);
                minutes=Number(parts[1]);
                seconds=Number(parts[2]);

            }else{

                minutes=Number(parts[0]);
                seconds=Number(parts[1]);

            }

            let total =
                hours*3600+
                minutes*60+
                seconds+
                offset;

            total=Math.max(0,total);

            const newHours =
                Math.floor(total/3600);

            const remaining =
                total%3600;

            const newMinutes =
                Math.floor(remaining/60);

            const newSeconds =
                remaining%60;

            return(
                String(newHours).padStart(2,"0")+
                ":"+
                String(newMinutes).padStart(2,"0")+
                ":"+
                newSeconds.toFixed(3).padStart(6,"0")
            );

        }
    );

}


/* =========================================================
   SYNC
========================================================= */

function updateSyncDisplay(){

    let value =
        subtitleSync.toFixed(1);

    if(subtitleSync>0){
        value="+"+value;
    }

    syncValue.textContent=value+"s";

}


syncBack.addEventListener("click",()=>{

    subtitleSync-=.5;

    updateSyncDisplay();
    applySubtitleSync();

});


syncForward.addEventListener("click",()=>{

    subtitleSync+=.5;

    updateSyncDisplay();
    applySubtitleSync();

});


resetSync.addEventListener("click",()=>{

    subtitleSync=0;

    updateSyncDisplay();
    applySubtitleSync();

});


/* =========================================================
   SETTINGS MENU
========================================================= */

settingsBtn.addEventListener("click",event=>{

    event.stopPropagation();

    settingsMenu.classList.toggle("active");

});


closeSettings.addEventListener("click",()=>{

    settingsMenu.classList.remove("active");

});


document.addEventListener("click",event=>{

    if(
        !settingsMenu.contains(event.target) &&
        !settingsBtn.contains(event.target)
    ){

        settingsMenu.classList.remove("active");

    }

});


/* =========================================================
   SETTINGS STORAGE
========================================================= */

function saveSettings(){

    localStorage.setItem(
        "cobaltPlayerSettings",
        JSON.stringify({

            animations:
                animationsToggle.checked,

            background:
                backgroundToggle.checked,

            autoplay:
                autoplayToggle.checked

        })
    );

}


function loadSettings(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "cobaltPlayerSettings"
                )
            );

        if(!saved){
            return;
        }

        animationsToggle.checked =
            saved.animations ?? true;

        backgroundToggle.checked =
            saved.background ?? true;

        autoplayToggle.checked =
            saved.autoplay ?? false;

        document.documentElement.classList.toggle(
            "no-animations",
            !animationsToggle.checked
        );

        const background =
            document.querySelector(
                ".poster-background"
            );

        if(background){

            background.style.display =
                backgroundToggle.checked
                    ? ""
                    : "none";

        }

    }catch{}

}


/* =========================================================
   ANIMATIONS
========================================================= */

animationsToggle.addEventListener("change",()=>{

    document.documentElement.classList.toggle(
        "no-animations",
        !animationsToggle.checked
    );

    saveSettings();

});


/* =========================================================
   BACKGROUND
========================================================= */

backgroundToggle.addEventListener("change",()=>{

    const background =
        document.querySelector(
            ".poster-background"
        );

    if(background){

        background.style.display =
            backgroundToggle.checked
                ? ""
                : "none";

    }

    saveSettings();

});


/* =========================================================
   AUTOPLAY
========================================================= */

autoplayToggle.addEventListener("change",()=>{

    video.autoplay =
        autoplayToggle.checked;

    saveSettings();

    if(autoplayToggle.checked){

        video.play().catch(()=>{});

    }

});


/* =========================================================
   PERFORMANCE MODE
========================================================= */

performanceBtn.addEventListener("click",()=>{

    document.body.classList.toggle(
        "performance-mode"
    );

    const enabled =
        document.body.classList.contains(
            "performance-mode"
        );

    performanceBtn.innerHTML =
        enabled
            ? "⚡ Performance Mode: ON"
            : "⚡ Performance Mode";

});


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",event=>{

    if(
        event.target.tagName==="INPUT" ||
        event.target.tagName==="TEXTAREA"
    ){
        return;
    }

    if(
        event.key===" " ||
        event.key.toLowerCase()==="k"
    ){

        event.preventDefault();
        togglePlay();
        return;

    }

    if(event.key.toLowerCase()==="m"){

        event.preventDefault();

        video.muted=!video.muted;

        updateMuteIcon();

        return;

    }

    if(event.key.toLowerCase()==="f"){

        event.preventDefault();

        fullscreenBtn.click();

        return;

    }

    if(event.key==="ArrowLeft"){

        event.preventDefault();

        video.currentTime =
            Math.max(
                0,
                video.currentTime-5
            );

        return;

    }

    if(event.key==="ArrowRight"){

        event.preventDefault();

        video.currentTime =
            Math.min(
                video.duration||Infinity,
                video.currentTime+5
            );

        return;

    }

    if(
        !subtitlePanel.classList.contains(
            "active"
        )
    ){
        return;
    }

    if(event.key==="["){

        subtitleSync-=.5;

        updateSyncDisplay();
        applySubtitleSync();

    }

    if(event.key==="]"){

        subtitleSync+=.5;

        updateSyncDisplay();
        applySubtitleSync();

    }

    if(event.key==="\\"){

        subtitleSync=0;

        updateSyncDisplay();
        applySubtitleSync();

    }

});


/* =========================================================
   CLOSE SUBTITLE MENU
========================================================= */

document.addEventListener("click",event=>{

    if(
        !subtitlePanel.contains(event.target) &&
        !subtitleBtn.contains(event.target)
    ){

        subtitlePanel.classList.remove("active");

    }

});

   CLEANUP

window.addEventListener("beforeunload",()=>{

    if(subtitleURL){

        URL.revokeObjectURL(subtitleURL);

        subtitleURL=null;

    }

});


/* =========================================================
   INIT
========================================================= */

updateSyncDisplay();
updateMuteIcon();
loadSettings();

</script>
