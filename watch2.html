<meta
    name="viewport"

<link rel="icon" type="image/png" href="logo.png">

>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #050507;
    color: white;
    font-family: "Poppins", Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
}

html {
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.25) transparent;
}

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.22);
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,.4);
}


/* =========================================================
   PAGE
========================================================= */

.watch-page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 105px 20px 35px;

    overflow: hidden;
    isolation: isolate;
}


/* =========================================================
   BACKGROUND
========================================================= */

.poster-background {
    position: fixed;
    inset: -25px;
    z-index: -5;

    background-image:
        linear-gradient(
            rgba(5,5,7,.62),
            rgba(5,5,7,.91)
        ),
        url("BND.png");

    background-size: cover;
    background-position: center;

    filter:
        blur(10px)
        saturate(.85)
        brightness(.7);

    opacity: .75;

    pointer-events: none;
    transform: scale(1.04);
}

.watch-page::after {
    content: "";

    position: fixed;
    inset: 0;

    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.78) 100%
        );
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width:
        min(
            1150px,
            calc(100% - 30px)
        );

    min-height: 64px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(15,15,20,.58);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.4);

    z-index: 1000;

    animation: navbarIn .5s ease-out;
}

@keyframes navbarIn {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(-12px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================================
   LOGO
========================================================= */

.logo {
    display: flex;
    align-items: center;

    gap: 9px;

    font-size: 21px;
    font-weight: 700;

    letter-spacing: -.5px;

    text-decoration: none;
    color: white;

    white-space: nowrap;
}

.logo img {
    width: 31px;
    height: 31px;

    object-fit: contain;
    border-radius: 8px;
}

.logo span {
    color: #ff3155;
}


/* =========================================================
   NAV LINKS
========================================================= */

.nav-links {
    display: flex;
    gap: 7px;
    margin-left: 32px;
}

.nav-links a {
    position: relative;

    color: rgba(255,255,255,.6);

    text-decoration: none;

    padding: 9px 14px;

    border-radius: 10px;

    font-size: 13px;

    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;
}

.nav-links a:hover {
    color: white;

    background:
        rgba(255,255,255,.08);

    transform:
        translateY(-1px);
}

.nav-links a.active {
    color: white;

    background:
        rgba(255,255,255,.08);
}

.nav-links a.active::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 3px;

    width: 18px;
    height: 2px;

    transform: translateX(-50%);

    border-radius: 10px;

    background: #ff3155;

    box-shadow:
        0 0 8px
        rgba(255,49,85,.7);
}

.nav-spacer {
    flex: 1;
}

.nav-status {
    padding: 8px 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.55);

    font-size: 11px;
}


/* =========================================================
   PLAYER
========================================================= */

.custom-player {
    position: relative;

    width:
        min(
            1100px,
            100%
        );

    aspect-ratio: 16 / 9;

    background: #000;

    border-radius: 18px;

    overflow: hidden;
    isolation: isolate;

    box-shadow:
        0 24px 70px
        rgba(0,0,0,.7),

        0 0 0 1px
        rgba(255,255,255,.055);

    animation:
        playerAppear .35s ease-out;
}

@keyframes playerAppear {

    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.custom-player video {
    position: relative;

    z-index: 2;

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    outline: none;
}


/* =========================================================
   TOP OVERLAY
========================================================= */

.top-overlay {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    padding: 22px 24px;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.18),
            transparent
        );

    transition:
        opacity .25s ease;
}

.video-title {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    font-size: 13px;
    font-weight: 600;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.7);
}

.title-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff3657;

    box-shadow:
        0 0 8px
        rgba(255,54,87,.75);
}


/* =========================================================
   CENTER PLAY
========================================================= */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius: 50%;

    background:
        rgba(8,8,12,.82);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 30;

    opacity: 0;

    pointer-events: none;
    visibility: hidden;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease,
        visibility .2s ease;
}

.custom-player.video-paused .center-play {
    opacity: .95;
    visibility: visible;
    pointer-events: auto;
}

.custom-player.video-playing .center-play {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

.custom-player.controls-hidden .center-play {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

.center-play:hover {
    background:
        rgba(255,30,55,.88);

    transform:
        translate(-50%,-50%)
        scale(1.06);
}

.center-play:active {
    transform:
        translate(-50%,-50%)
        scale(.94);
}

.center-play span {
    margin-left: 4px;
}


/* =========================================================
   CONTROLS
========================================================= */

.video-controls {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    min-height: 82px;

    padding:
        30px
        18px
        13px;

    display: flex;
    align-items: center;

    gap: 10px;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.94) 70%
        );

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.custom-player.controls-hidden .video-controls {
    opacity: 0;
    pointer-events: none;

    transform:
        translateY(8px);
}

.custom-player.controls-hidden .top-overlay {
    opacity: 0;
}

.control-left,
.control-right {
    display: flex;

    align-items: center;

    gap: 7px;
}

.control-right {
    margin-left: auto;
}

.control-btn {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 10px;

    color: white;

    background:
        rgba(255,255,255,.055);

    cursor: pointer;

    font-family:
        "Poppins",
        sans-serif;

    transition:
        background .15s ease,
        transform .15s ease;
}

.control-btn:hover {
    background:
        rgba(255,255,255,.13);
}

.control-btn:active {
    transform: scale(.92);
}

.cc-btn {
    font-size: 11px;
    font-weight: 700;

    letter-spacing: .5px;
}

.video-controls span {
    font-size: 12px;
    font-weight: 500;

    white-space: nowrap;

    color:
        rgba(255,255,255,.82);
}

.time-separator {
    opacity: .35;
}

.progress-wrap {
    flex: 1;

    display: flex;
    align-items: center;

    min-width: 80px;
}

input[type="range"] {
    appearance: none;
    -webkit-appearance: none;

    height: 4px;

    border-radius: 20px;

    cursor: pointer;

    outline: none;

    background:
        rgba(255,255,255,.22);
}

#progress {
    width: 100%;
}

#volume {
    width: 75px;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: none;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}


/* =========================================================
   QUALITY
========================================================= */

.quality-select {
    height: 38px;

    padding: 0 10px;

    border: 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.055);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 10px;

    font-weight: 600;

    outline: none;

    cursor: pointer;
}

.quality-select:hover {
    background:
        rgba(255,255,255,.13);
}

.quality-select:disabled {
    opacity: .55;
    cursor: wait;
}

.quality-select option {
    background: #111116;
    color: white;
}


/* =========================================================
   SUBTITLES
========================================================= */

video::cue {
    background: transparent !important;

    color: #fff;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 1.08em;

    font-weight: 500;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.95),

        0 0 7px
        rgba(0,0,0,.75);
}


/* =========================================================
   SUBTITLE PANEL
========================================================= */

.subtitle-panel {
    position: absolute;

    right: 18px;
    bottom: 76px;

    width: 300px;

    padding: 17px;

    border-radius: 17px;

    background:
        rgba(12,12,18,.97);

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.65);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    color: white;

    z-index: 50;

    opacity: 0;

    transform:
        translateY(10px)
        scale(.97);

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.subtitle-panel.active {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

.subtitle-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.subtitle-header strong {
    display: block;
    font-size: 15px;
}

.subtitle-header small {
    display: block;

    margin-top: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,.45);
}

.subtitle-header button {
    width: 30px;
    height: 30px;

    border: 0;

    border-radius: 8px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.subtitle-header button:hover {
    background:
        rgba(255,255,255,.14);
}


/* =========================================================
   SUBTITLE OPTIONS
========================================================= */

.subtitle-options {
    display: flex;

    flex-direction: column;

    gap: 7px;

    margin-bottom: 10px;
}

.subtitle-option {
    width: 100%;

    min-height: 42px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 10px;

    background:
        rgba(255,255,255,.045);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition:
        background .15s ease,
        border .15s ease;
}

.subtitle-option:hover {
    background:
        rgba(255,255,255,.10);
}

.subtitle-option.active {
    border-color:
        rgba(255,49,85,.5);

    background:
        rgba(255,49,85,.12);
}

.subtitle-option-status {
    color:
        #49e88a;

    font-size: 9px;
}

.subtitle-file-btn {
    width: 100%;

    height: 43px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 11px;

    background:
        rgba(255,255,255,.075);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}

.subtitle-file-btn:hover {
    background:
        rgba(255,255,255,.12);
}

.subtitle-status {
    margin-top: 9px;

    padding:
        8px
        10px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.5);

    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   FULLSCREEN
========================================================= */

.custom-player:fullscreen,
.custom-player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    border-radius: 0;

    box-shadow: none;

    background: #000;
}

.custom-player:fullscreen video,
.custom-player:-webkit-full-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

body:has(.custom-player:fullscreen)
.poster-background,

body:has(.custom-player:-webkit-full-screen)
.poster-background {
    opacity: 0;
    visibility: hidden;
}


/* =========================================================
   VERSION
========================================================= */

.version-badge {
    position: fixed;

    right: 14px;
    bottom: 12px;

    z-index: 99999;

    padding:
        6px
        10px;

    border-radius: 9px;

    background:
        rgba(15,15,20,.65);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    color:
        rgba(255,255,255,.6);

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .4px;

    pointer-events: none;

    user-select: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .watch-page {
        padding:
            95px
            12px
            30px;
    }

    .navbar {
        top: 10px;

        height: 58px;

        padding:
            0 15px;
    }

    .custom-player {
        border-radius: 14px;
    }

    .quality-select {
        height: 32px;

        padding:
            0 7px;

        font-size: 9px;
    }

    .control-btn {
        width: 34px;
        height: 34px;
    }
}


@media (max-width: 700px) {

    .watch-page {
        padding:
            82px
            12px
            30px;
    }

    .navbar {
        width:
            calc(100% - 20px);
    }

    .nav-links {
        margin-left: 12px;
        gap: 2px;
    }

    .nav-links a {
        padding:
            8px
            10px;

        font-size: 11px;
    }

    .nav-status {
        display: none;
    }

    .logo {
        font-size: 15px;

        max-width: 210px;

        overflow: hidden;
        text-overflow: ellipsis;
    }

    .logo img {
        width: 27px;
        height: 27px;

        flex-shrink: 0;
    }

    .custom-player {
        width: 100%;
        border-radius: 14px;
    }

    .top-overlay {
        padding:
            12px
            14px;
    }

    .video-controls {
        min-height: 68px;

        padding:
            24px
            9px
            8px;

        gap: 5px;
    }

    .control-btn {
        width: 32px;
        height: 32px;

        border-radius: 8px;
    }

    #volume {
        display: none;
    }

    .video-controls span {
        font-size: 9px;
    }

    .quality-select {
        height: 32px;

        border-radius: 8px;

        font-size: 8px;
    }

    .subtitle-panel {
        right: 8px;
        bottom: 62px;

        width:
            min(
                300px,
                calc(100% - 16px)
            );
    }

    .center-play {
        width: 58px;
        height: 58px;

        font-size: 20px;
    }

    .version-badge {
        right: 8px;
        bottom: 8px;

        font-size: 9px;
    }
}


@supports (padding: env(safe-area-inset-bottom)) {

    .watch-page {
        padding-bottom:
            max(
                35px,
                env(safe-area-inset-bottom)
            );
    }
}


@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

</style>
</head>

/* =========================================================

========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    seconds = Math.max(
        0,
        Math.floor(seconds)
    );

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* =========================================================
   PLAYER STATE

function updatePlayerState() {

    } else {

        player.classList.add(
            "video-playing"
        );

        centerPlay.innerHTML =

    }

}

}

/* =========================================================

========================================================= */

let lastUIUpdate = 0;

video.addEventListener(
    "timeupdate",
    () => {

        const now =
            performance.now();

        if (
            now - lastUIUpdate < 100
        ) {
            return;
        }

        lastUIUpdate = now;

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                video.duration
            )
        ) {
            return;
        }

        video.currentTime =
            (
                progress.value / 100
            ) *
            video.duration;

        resetControlsTimer();

    }
);


/* =========================================================
   VOLUME
========================================================= */

/* =========================================================
   QUALITY
========================================================= */

qualitySelect.addEventListener(
    "change",
    async () => {

        const selected =
            qualitySelect.value;

        if (
            selected === currentQuality ||
            switchingQuality
        ) {
            return;
        }

        switchingQuality = true;

        const oldQuality =
            currentQuality;

        const oldTime =
            video.currentTime;

        const wasPlaying =
            !video.paused;

        qualitySelect.disabled = true;

        try {

            const newURL =
                QUALITY_SOURCES[selected];

            if (!newURL) {
                throw new Error(
                    "Quality source missing"
                );
            }

            videoSource.src =
                newURL;

            video.load();

            await new Promise(
                (resolve, reject) => {

                    let finished = false;

                    const timeout =
                        setTimeout(
                            () => {

                                cleanup();

                                reject(
                                    new Error(
                                        "Video timeout"
                                    )
                                );

                            },
                            15000
                        );

                    function cleanup() {

                        if (finished) {
                            return;
                        }

                        finished = true;

                        clearTimeout(timeout);

                        video.removeEventListener(
                            "canplay",
                            success
                        );

                        video.removeEventListener(
                            "error",
                            failure
                        );

                    }

                    function success() {

                        cleanup();

                        resolve();

                    }

                    function failure() {

                        cleanup();

                        reject(
                            new Error(
                                "Video failed"
                            )
                        );

                    }

                    video.addEventListener(
                        "canplay",
                        success,
                        { once: true }
                    );

                    video.addEventListener(
                        "error",
                        failure,
                        { once: true }
                    );

                }
            );

            currentQuality =
                selected;

            if (
                Number.isFinite(
                    video.duration
                )
            ) {

                video.currentTime =
                    Math.min(
                        oldTime,
                        Math.max(
                            0,
                            video.duration - .1
                        )
                    );

            }

            if (wasPlaying) {

                await video.play().catch(
                    () => {}
                );

            }

        } catch (error) {

            console.warn(
                "Quality switch failed:",
                error
            );

            qualitySelect.value =
                oldQuality;

            currentQuality =
                oldQuality;

            videoSource.src =
                QUALITY_SOURCES[oldQuality];

            video.load();

            video.addEventListener(
                "loadedmetadata",
                () => {

                    if (
                        Number.isFinite(
                            oldTime
                        )
                    ) {

                        video.currentTime =
                            Math.min(
                                oldTime,
                                video.duration ||
                                oldTime
                            );

                    }

                    if (wasPlaying) {

                        video.play().catch(
                            () => {}
                        );

                    }

                },
                { once: true }
            );

        } finally {

            switchingQuality = false;

            qualitySelect.disabled = false;

        }

        resetControlsTimer();

    }
);

/* =========================================================
   SRT → VTT
========================================================= */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    vtt =
        vtt.replace(
            /^\d+\s*$/gm,
            ""
        );

    return (
        "WEBVTT\n\n" +
        vtt
    );

}


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitle(
    subtitleText,
    filename
) {

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }

    const blob =
        new Blob(
            [subtitleText],
            {
                type: "text/vtt"
            }
        );

    subtitleURL =
        URL.createObjectURL(
            blob
        );

    subtitleTrack =
        document.createElement(
            "track"
        );

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "English";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        subtitlesEnabled;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    subtitlesEnabled
                        ? "showing"
                        : "hidden";

            }

        }
    );

    subtitleStatus.textContent =
        "English — " +
        filename;

    githubSubtitleStatus.textContent =
        subtitlesEnabled
            ? "ON"
            : "OFF";

    githubSubtitle.classList.toggle(
        "active",
        subtitlesEnabled
    );

    noneSubtitle.classList.toggle(
        "active",
        !subtitlesEnabled
    );

}


/* =========================================================
   LOAD SUBTITLES.SRT FROM GITHUB
========================================================= */

async function loadGitHubSubtitle() {

    subtitleStatus.textContent =
        "Loading subtitles.srt...";

    try {

        const response =
            await fetch(
                GITHUB_SUBTITLE_URL,
                {
                    cache: "no-cache"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Subtitle file not found"
            );

        }

        let text =
            await response.text();

        text =
            srtToVtt(text);

        subtitlesEnabled = true;

        applySubtitle(
            text,
            "subtitles.srt"
        );

        updateSubtitleButton();

    } catch (error) {

        console.error(
            "Subtitle loading failed:",
            error
        );

        subtitleStatus.textContent =
            "subtitles.srt not found";

        githubSubtitleStatus.textContent =
            "ERROR";

    }

}

   IMPORT SRT / VTT
========================================================= */

subtitleFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Use an SRT or VTT file.";

            return;

        }

        try {

            let text =
                await file.text();

            if (
                extension === "srt"
            ) {

                text =
                    srtToVtt(text);

            }

            subtitlesEnabled = true;

            applySubtitle(
                text,
                file.name
            );

            updateSubtitleButton();

        } catch (error) {

            console.error(error);

            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen() {

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (isFullscreen) {

        try {

            if (
                document.exitFullscreen
            ) {

                await document.exitFullscreen();

            } else if (
                document.webkitExitFullscreen
            ) {

                document.webkitExitFullscreen();

            }

        } catch (error) {

            console.warn(error);

        }

        return;
    }


    if (
        typeof
        video.webkitEnterFullscreen ===
        "function"
    ) {

        try {

            video.webkitEnterFullscreen();

            return;

        } catch (error) {

            console.warn(error);

        }

    }


    try {

        if (
            player.requestFullscreen
        ) {

            await player.requestFullscreen();

        } else if (
            player.webkitRequestFullscreen
        ) {

            player.webkitRequestFullscreen();

        }

    } catch (error) {

        console.warn(
            "Fullscreen failed:",
            error
        );

    }

}

fullscreenBtn.addEventListener(
    "click",
    toggleFullscreen
);


/* =========================================================
   CONTROLS AUTO HIDE
========================================================= */

let controlsTimer = null;


function showControls() {

    player.classList.remove(
        "controls-hidden"
    );

}


function hideControls() {

    /*
        NEVER hide controls while paused.
    */

    if (
        video.paused ||
        subtitlePanel.classList.contains(
            "active"
        )
    ) {

        return;

    }

    player.classList.add(
        "controls-hidden"
    );

    /*
        Explicitly hide center button.
        Prevents Android TV hover/focus
        from keeping it visible.
    */

    centerPlay.style.opacity = "0";
    centerPlay.style.visibility = "hidden";
    centerPlay.style.pointerEvents = "none";

}


function resetControlsTimer() {

    showControls();

    clearTimeout(
        controlsTimer
    );

    if (!video.paused) {

        controlsTimer =
            setTimeout(
                hideControls,
                3000
            );

    }

}

   PLAYER INTERACTION
========================================================= */

player.addEventListener(

    {

    }

player.addEventListener(
    "touchmove",

    {

player.addEventListener(
    "mouseenter",

player.addEventListener(
    "focusin",

        resetControlsTimer();

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "SELECT" ||
            event.target.tagName === "TEXTAREA"
        ) {

            return;

        }


        if (
            event.key === " " ||
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            togglePlay();

        }


        if (
            event.key.toLowerCase() === "m"
        ) {

            video.muted =
                !video.muted;

            updateMuteIcon();

        }


        if (
            event.key.toLowerCase() === "f"
        ) {

            toggleFullscreen();

        }


        if (
            event.key.toLowerCase() === "c"
        ) {

            toggleSubtitles();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }


        if (
            event.key === "ArrowRight"
        ) {

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

        }


        resetControlsTimer();

    }
);


/* =========================================================
   SERVER
========================================================= */

function selectServer(
    server,
    button
) {

    document
        .querySelectorAll(
            ".server-card"
        )
        .forEach(
            card => {

                card.classList.remove(
                    "active"
                );

            }
        );

    button.classList.add(
        "active"
    );


    if (
        server === "cineview"
    ) {

        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );

    }

}

document.addEventListener(
    "fullscreenchange",
    () => {

        if (
            document.fullscreenElement
        ) {

            resetControlsTimer();

        } else {

            showControls();

        }

    }
);

document.addEventListener(
    "webkitfullscreenchange",
    () => {

        if (
            document.webkitFullscreenElement
        ) {

            resetControlsTimer();

        } else {

            showControls();

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (subtitleURL) {

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updatePlayerState();

updateMuteIcon();

updateSubtitleButton();

showControls();

</script>

</body>
</html>
