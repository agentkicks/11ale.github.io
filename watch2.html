<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CineView — Watch 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #050507;
    color: white;
    font-family: "Poppins", Arial, sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: -30px;
    z-index: -2;

    background:
        linear-gradient(
            rgba(5,5,7,.55),
            rgba(5,5,7,.94)
        ),
        url("BND.png");

    background-size: cover;
    background-position: center;

    filter:
        blur(12px)
        brightness(.65)
        saturate(.8);

    transform: scale(1.05);
}

/* NAVBAR */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1150px, calc(100% - 30px));
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;

    background: rgba(15,15,20,.65);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    z-index: 1000;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;

    color: white;
    text-decoration: none;

    font-size: 21px;
    font-weight: 700;
}

.logo img {
    width: 31px;
    height: 31px;

    object-fit: contain;
    border-radius: 8px;
}

.logo span {
    color: #ff3155;
}

.nav-links {
    display: flex;
    gap: 6px;
    margin-left: 30px;
}

.nav-links a {
    padding: 9px 14px;

    color: rgba(255,255,255,.6);

    text-decoration: none;

    border-radius: 10px;

    font-size: 13px;

    transition: .2s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;
    background: rgba(255,255,255,.08);
}

.nav-spacer {
    flex: 1;
}

.status {
    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.05);

    color: rgba(255,255,255,.5);

    font-size: 11px;
}

/* PAGE */

.page {
    width: 100%;
    min-height: 100vh;

    padding: 105px 20px 40px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* PLAYER */

.player {
    position: relative;

    width: min(1100px, 100%);
    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #000;

    border-radius: 18px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.06);

    isolation: isolate;
}

.player video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: #000;

    outline: none;

    z-index: 1;
}

/* LOADING */

.loading {
    position: absolute;
    inset: 0;

    z-index: 30;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 12px;

    background: rgba(0,0,0,.3);

    transition:
        opacity .25s ease,
        visibility .25s ease;

    pointer-events: none;
}

.loading.hidden {
    opacity: 0;
    visibility: hidden;
}

.spinner {
    width: 38px;
    height: 38px;

    border: 3px solid rgba(255,255,255,.15);
    border-top-color: #ff3155;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-size: 12px;
    color: rgba(255,255,255,.7);
}

/* TOP */

.top {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    padding: 22px;

    z-index: 8;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent
        );

    transition: opacity .25s ease;
}

.title {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
    font-weight: 600;
}

.dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff3155;

    box-shadow: 0 0 9px #ff3155;
}

/* CENTER PLAY */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;

    background: rgba(10,10,15,.82);

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 25;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
}

.player.paused .center-play {
    opacity: 1;
    pointer-events: auto;
}

.center-play:hover {
    transform:
        translate(-50%, -50%)
        scale(1.08);

    background: #ff3155;
}

/* CONTROLS */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    min-height: 82px;

    padding: 30px 16px 12px;

    display: flex;
    align-items: center;

    gap: 8px;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.95)
        );

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.player.controls-hidden .controls {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
}

.player.controls-hidden .top {
    opacity: 0;
}

.control-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.right {
    margin-left: auto;
}

.control-btn {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 10px;

    background: rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.14);
}

.control-btn:active {
    transform: scale(.92);
}

.time {
    font-size: 11px;

    color: rgba(255,255,255,.75);

    white-space: nowrap;
}

.progress-wrap {
    flex: 1;
    min-width: 50px;
}

input[type="range"] {
    appearance: none;
    -webkit-appearance: none;

    width: 100%;
    height: 4px;

    border-radius: 20px;

    background: rgba(255,255,255,.25);

    cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 13px;
    height: 13px;

    border: 0;
    border-radius: 50%;

    background: white;
}

.volume {
    width: 75px !important;
}

.quality {
    height: 38px;

    padding: 0 10px;

    border: 0;
    border-radius: 10px;

    background: rgba(255,255,255,.06);

    color: white;

    font-size: 10px;

    outline: none;
}

.quality option {
    background: #111116;
}

/* MOBILE */

@media (max-width: 700px) {

    .page {
        padding: 82px 10px 25px;
    }

    .navbar {
        top: 10px;

        width: calc(100% - 20px);
        height: 58px;

        padding: 0 14px;
    }

    .logo {
        font-size: 17px;
    }

    .logo img {
        width: 27px;
        height: 27px;
    }

    .nav-links {
        margin-left: 10px;
    }

    .nav-links a {
        padding: 8px 9px;
        font-size: 11px;
    }

    .status {
        display: none;
    }

    .player {
        border-radius: 12px;
    }

    .controls {
        min-height: 65px;
        padding: 23px 8px 7px;
        gap: 4px;
    }

    .control-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
    }

    .volume {
        display: none;
    }

    .time {
        font-size: 9px;
    }

    .quality {
        height: 32px;
        padding: 0 6px;
        font-size: 8px;
    }

    .center-play {
        width: 58px;
        height: 58px;
        font-size: 20px;
    }
}

/* FULLSCREEN */

.player:fullscreen,
.player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    border-radius: 0;
}

.player:fullscreen video,
.player:-webkit-full-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}
</style>
</head>

<body>

<div class="background"></div>

<nav class="navbar">

    <a href="index.html" class="logo">

        <img src="logo.png" alt="CineView">

        Cine<span>View</span>

    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="watch.html">
            Watch
        </a>

        <a href="watch2.html" class="active">
            Watch 2
        </a>

    </div>

    <div class="nav-spacer"></div>

    <div class="status">
        Server 2
    </div>

</nav>

<main class="page">

    <div
        class="player paused"
        id="player"
    >

        <video
            id="video"
            playsinline
            webkit-playsinline
            preload="metadata"
        ></video>

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <div
                class="loading-text"
                id="loadingText"
            >
                Loading video...
            </div>

        </div>

        <div class="top">

            <div class="title">

                <span class="dot"></span>

                Now Playing — Watch 2

            </div>

        </div>

        <button
            class="center-play"
            id="centerPlay"
            aria-label="Play / Pause"
        >
            ▶
        </button>

        <div
            class="controls"
            id="controls"
        >

            <div class="control-group">

                <button
                    class="control-btn"
                    id="playBtn"
                    aria-label="Play / Pause"
                >
                    ▶
                </button>

                <button
                    class="control-btn"
                    id="muteBtn"
                    aria-label="Mute"
                >
                    🔊
                </button>

                <input
                    class="volume"
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value="1"
                >

                <span
                    class="time"
                    id="currentTime"
                >
                    0:00
                </span>

                <span class="time">
                    /
                </span>

                <span
                    class="time"
                    id="duration"
                >
                    0:00
                </span>

            </div>

            <div class="progress-wrap">

                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>

            <div class="control-group right">

                <select
                    class="quality"
                    id="quality"
                >

                    <option>
                        Auto
                    </option>

                </select>

                <button
                    class="control-btn"
                    id="fullscreenBtn"
                    aria-label="Fullscreen"
                >
                    ⛶
                </button>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

/* =========================
   WATCH 2 SOURCE
========================= */

const VIDEO_URL =
"https://proxy.zxcstream.xyz/proxy?data=yKfuqFQ8qNSnLJ-HIwHbC1CJ6yo9x6wzrJTAaH1nRFG4oCmxeIAq5ymmUFpHVm0gzUVkso5xkVfsp5R7y1YeZ6ognf9MlPoDsEC4mjNELbnIa8qy-_Ot3bpacf1dVsc6qqIHbPM72Q6ra46Npfj6LEAUOLLwWQvbdTmTFE9e0p80kdAkHJtEAy72LlgOtYLNRICQAvTBBBnESOE";


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById("player");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const muteBtn =
    document.getElementById("muteBtn");

const volume =
    document.getElementById("volume");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* =========================
   PLAY
========================= */

function togglePlay() {

    if (video.paused) {

        video.play().catch(
            error => {
                console.error(
                    "Playback failed:",
                    error
                );
            }
        );

    } else {

        video.pause();

    }

}

playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);

video.addEventListener(
    "click",
    togglePlay
);


/* =========================
   PLAY STATE
========================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent =
            "❚❚";

        centerPlay.textContent =
            "❚❚";

        player.classList.remove(
            "paused"
        );

        resetControlsTimer();

    }
);

video.addEventListener(
    "pause",
    () => {

        playBtn.textContent =
            "▶";

        centerPlay.textContent =
            "▶";

        player.classList.add(
            "paused"
        );

        showControls();

    }
);


/* =========================
   TIME
========================= */

function formatTime(
    seconds
) {

    if (
        !Number.isFinite(seconds)
    ) {
        return "0:00";
    }

    seconds =
        Math.floor(seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes).padStart(
                2,
                "0"
            ) +
            ":" +
            String(secs).padStart(
                2,
                "0"
            )
        );

    }

    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    () => {

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                video.duration
            )
        ) {
            return;
        }

        video.currentTime =
            (
                Number(progress.value) /
                100
            ) *
            video.duration;

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted =
            video.volume === 0;

        updateMute();

    }
);

function updateMute() {

    muteBtn.textContent =
        video.muted ||
        video.volume === 0
            ? "🔇"
            : "🔊";

}

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMute();

    }
);


/* =========================
   FULLSCREEN
========================= */

async function toggleFullscreen() {

    const fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (fullscreen) {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        } else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

        return;

    }

    try {

        if (
            player.requestFullscreen
        ) {

            await player.requestFullscreen();

        } else if (
            player.webkitRequestFullscreen
        ) {

            player.webkitRequestFullscreen();

        }

    } catch (error) {

        console.error(
            "Fullscreen failed:",
            error
        );

    }

}

fullscreenBtn.addEventListener(
    "click",
    toggleFullscreen
);


/* =========================
   CONTROLS AUTO HIDE
========================= */

let controlsTimer = null;

function showControls() {

    player.classList.remove(
        "controls-hidden"
    );

}

function hideControls() {

    if (
        video.paused
    ) {
        return;
    }

    player.classList.add(
        "controls-hidden"
    );

}

function resetControlsTimer() {

    showControls();

    clearTimeout(
        controlsTimer
    );

    if (
        !video.paused
    ) {

        controlsTimer =
            setTimeout(
                hideControls,
                2500
            );

    }

}

player.addEventListener(
    "mousemove",
    resetControlsTimer
);

player.addEventListener(
    "touchstart",
    resetControlsTimer,
    {
        passive: true
    }
);

player.addEventListener(
    "touchmove",
    resetControlsTimer,
    {
        passive: true
    }
);


/* =========================
   LOADING
========================= */

video.addEventListener(
    "loadstart",
    () => {

        loadingText.textContent =
            "Loading video...";

        loading.classList.remove(
            "hidden"
        );

    }
);

video.addEventListener(
    "canplay",
    () => {

        loading.classList.add(
            "hidden"
        );

    }
);

video.addEventListener(
    "playing",
    () => {

        loading.classList.add(
            "hidden"
        );

        resetControlsTimer();

    }
);

video.addEventListener(
    "waiting",
    () => {

        loadingText.textContent =
            "Buffering...";

        loading.classList.remove(
            "hidden"
        );

    }
);

video.addEventListener(
    "error",
    () => {

        console.error(
            "Video error:",
            video.error
        );

        loadingText.textContent =
            "Unable to play this video.";

    }
);


/* =========================
   LOAD VIDEO
========================= */

function loadVideo() {

    loadingText.textContent =
        "Loading video...";

    loading.classList.remove(
        "hidden"
    );

    /*
     * First try the URL as a normal
     * browser video source.
     */

    video.src =
        VIDEO_URL;

    video.load();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }

        if (
            event.key === " "
        ) {

            event.preventDefault();

            togglePlay();

        }

        if (
            event.key.toLowerCase() ===
            "k"
        ) {

            togglePlay();

        }

        if (
            event.key.toLowerCase() ===
            "f"
        ) {

            toggleFullscreen();

        }

        if (
            event.key.toLowerCase() ===
            "m"
        ) {

            video.muted =
                !video.muted;

            updateMute();

        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

        }

        resetControlsTimer();

    }
);


/* =========================
   START
========================= */

updateMute();

showControls();

loadVideo();

</script>

</body>
</html>
