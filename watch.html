<script>
/* =========================================================
   BUILT-IN GITHUB SRT SUBTITLES
   File must be next to watch.html:
   ./subtitles.srt
========================================================= */

let subtitleTrack = null;
let subtitleURL = null;
let originalVTTText = null;

async function loadBuiltInSubtitles() {

    try {

        subtitleStatus.textContent =
            "Loading subtitles...";

        const response = await fetch(
            "./subtitles.srt",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const srtText =
            await response.text();

        if (!srtText.trim()) {
            throw new Error(
                "Subtitle file is empty"
            );
        }

        originalVTTText =
            srtToVtt(srtText);

        subtitleSync = 0;

        updateSyncDisplay();

        applySubtitleSync();

        subtitleStatus.textContent =
            "Built-in subtitles loaded";

        autoSyncStatus.textContent =
            "Subtitles loaded automatically from subtitles.srt.";

    } catch (error) {

        console.error(
            "Subtitle loading failed:",
            error
        );

        subtitleStatus.textContent =
            "Could not load subtitles.srt";

        autoSyncStatus.textContent =
            "Make sure subtitles.srt is uploaded next to watch.html.";

    }
}


/* =========================================================
   SRT → VTT
========================================================= */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\uFEFF/g, "")
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();

    /*
     * Convert:
     *
     * 00:01:02,500
     *
     * into:
     *
     * 00:01:02.500
     */

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    /*
     * Remove SRT cue numbers.
     */

    vtt =
        vtt.replace(
            /^\s*\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + vtt;
}


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitleSync() {

    if (!originalVTTText) {
        return;
    }

    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "English";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        true;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    "showing";

            }

        }
    );

    /*
     * Some browsers need a tiny delay before
     * the TextTrack becomes available.
     */

    setTimeout(() => {

        if (
            subtitleTrack &&
            subtitleTrack.track
        ) {

            subtitleTrack.track.mode =
                "showing";

        }

    }, 100);
}


/* =========================================================
   SHIFT VTT FOR SYNC
========================================================= */

function shiftVTT(vtt, offset) {

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;

    return vtt.replace(
        timestampRegex,
        timestamp => {

            const parts =
                timestamp.split(":");

            let hours = 0;
            let minutes = 0;
            let seconds = 0;

            if (parts.length === 3) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }

            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;

            total =
                Math.max(0, total);

            const newHours =
                Math.floor(
                    total / 3600
                );

            const remaining =
                total % 3600;

            const newMinutes =
                Math.floor(
                    remaining / 60
                );

            const newSeconds =
                remaining % 60;

            return (
                String(newHours)
                    .padStart(2, "0")
                + ":"
                + String(newMinutes)
                    .padStart(2, "0")
                + ":"
                + newSeconds
                    .toFixed(3)
                    .padStart(6, "0")
            );

        }
    );
}


/* =========================================================
   MANUAL SYNC
========================================================= */

syncBack.addEventListener(
    "click",
    () => {

        subtitleSync -= 0.5;

        updateSyncDisplay();
        applySubtitleSync();

    }
);

syncForward.addEventListener(
    "click",
    () => {

        subtitleSync += 0.5;

        updateSyncDisplay();
        applySubtitleSync();

    }
);

resetSync.addEventListener(
    "click",
    () => {

        subtitleSync = 0;

        updateSyncDisplay();
        applySubtitleSync();

        syncPointBox.textContent =
            "No sync point set";

        autoSyncStatus.textContent =
            "Sync reset.";

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateSyncDisplay();
updateMuteIcon();

/*
 * Load subtitles automatically.
 *
 * This does NOT wait for the video to load,
 * so the subtitle file can load independently.
 */

loadBuiltInSubtitles();


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (subtitleURL) {

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;

        }

    }
);
</script>
