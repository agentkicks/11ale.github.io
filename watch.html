<script>

/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const muteBtn =
    document.getElementById("muteBtn");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById(
        "closeSubtitlePanel"
    );

const chooseSubtitle =
    document.getElementById(
        "chooseSubtitle"
    );

const subtitleFile =
    document.getElementById(
        "subtitleFile"
    );

const subtitleStatus =
    document.getElementById(
        "subtitleStatus"
    );

const syncBack =
    document.getElementById(
        "syncBack"
    );

const syncForward =
    document.getElementById(
        "syncForward"
    );

const syncValue =
    document.getElementById(
        "syncValue"
    );

const resetSync =
    document.getElementById(
        "resetSync"
    );


/* =========================
   STATE
========================= */

let originalVTTText = null;

let subtitleTrack = null;

let subtitleURL = null;

let subtitleSync = 0;


/* =========================
   TIME
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* =========================
   PLAY
========================= */

function togglePlay() {

    if (video.paused) {

        video.play()
        .catch(error => {

            console.error(
                "Video playback failed:",
                error
            );

        });

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);


/* =========================
   PLAY STATE
========================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";
        centerPlay.textContent = "❚❚";

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";
        centerPlay.textContent = "▶";

    }
);


/* =========================
   METADATA
========================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

        console.log(
            "Video loaded:",
            video.duration
        );

    }
);


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    () => {

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);


/* =========================
   SEEK
========================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                video.duration
            )
        ) {
            return;
        }

        video.currentTime =
            (
                progress.value / 100
            ) * video.duration;

    }
);


/* =========================
   MUTE
========================= */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        muteBtn.textContent =
            video.muted
                ? "🔇"
                : "🔊";

    }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await player.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================
   SUBTITLE PANEL
========================= */

subtitleBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        subtitlePanel.classList.toggle(
            "active"
        );

    }
);


closeSubtitlePanel.addEventListener(
    "click",
    () => {

        subtitlePanel.classList.remove(
            "active"
        );

    }
);


/* =========================
   FILE PICKER
========================= */

chooseSubtitle.addEventListener(
    "click",
    () => {

        subtitleFile.click();

    }
);


/* =========================
   SRT → VTT
========================= */

function srtToVtt(srt) {

    let text =
        srt
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .trim();

    text =
        text.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    text =
        text.replace(
            /^\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + text;
}


/* =========================
   LOAD SUBTITLE
========================= */

subtitleFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const extension =
            file.name
            .split(".")
            .pop()
            .toLowerCase();

        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;
        }

        try {

            let text =
                await file.text();

            if (extension === "srt") {

                text =
                    srtToVtt(text);

            }

            originalVTTText =
                text;

            subtitleSync = 0;

            updateSyncDisplay();

            subtitleStatus.textContent =
                `Loaded: ${file.name}`;

            applySubtitle();

        } catch (error) {

            console.error(
                "Subtitle error:",
                error
            );

            subtitleStatus.textContent =
                "Could not read subtitle.";

        }

    }
);


/* =========================
   APPLY SUBTITLE
========================= */

function applySubtitle() {

    if (!originalVTTText) {
        return;
    }

    const shifted =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob =
        new Blob(
            [shifted],
            {
                type: "text/vtt"
            }
        );

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    if (subtitleTrack) {

        subtitleTrack.remove();

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "Subtitles";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        true;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    "showing";

            }

        }
    );
}


/* =========================
   SHIFT VTT
========================= */

function shiftVTT(
    vtt,
    offset
) {

    const regex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;

    return vtt.replace(
        regex,
        timestamp => {

            const parts =
                timestamp.split(":");

            let hours = 0;
            let minutes = 0;
            let seconds = 0;

            if (
                parts.length === 3
            ) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }

            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;

            total =
                Math.max(0, total);

            const h =
                Math.floor(
                    total / 3600
                );

            const m =
                Math.floor(
                    (total % 3600) / 60
                );

            const s =
                total % 60;

            return (
                String(h).padStart(2, "0") +
                ":" +
                String(m).padStart(2, "0") +
                ":" +
                s.toFixed(3).padStart(6, "0")
            );

        }
    );
}


/* =========================
   SYNC DISPLAY
========================= */

function updateSyncDisplay() {

    let value =
        subtitleSync.toFixed(1);

    if (
        subtitleSync > 0
    ) {

        value =
            "+" + value;

    }

    syncValue.textContent =
        value + "s";
}


/* =========================
   MANUAL SYNC
========================= */

syncBack.addEventListener(
    "click",
    () => {

        subtitleSync -= .5;

        updateSyncDisplay();

        applySubtitle();

    }
);


syncForward.addEventListener(
    "click",
    () => {

        subtitleSync += .5;

        updateSyncDisplay();

        applySubtitle();

    }
);


resetSync.addEventListener(
    "click",
    () => {

        subtitleSync = 0;

        updateSyncDisplay();

        applySubtitle();

    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName === "INPUT"
        ) {
            return;
        }

        if (
            event.key === " "
        ) {

            event.preventDefault();

            togglePlay();

        }

        if (
            event.key.toLowerCase() === "k"
        ) {

            togglePlay();

        }

        if (
            event.key.toLowerCase() === "m"
        ) {

            video.muted =
                !video.muted;

            muteBtn.textContent =
                video.muted
                    ? "🔇"
                    : "🔊";

        }

        if (
            event.key.toLowerCase() === "f"
        ) {

            fullscreenBtn.click();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }

        if (
            event.key === "ArrowRight"
        ) {

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

        }

    }
);


/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            !subtitlePanel.contains(
                event.target
            ) &&
            !subtitleBtn.contains(
                event.target
            )
        ) {

            subtitlePanel.classList.remove(
                "active"
            );

        }

    }
);
