<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cobalt — Watch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    font-family:
        "Poppins",
        Arial,
        sans-serif;

    background: #050507;
    color: white;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.watch-page {
    position: relative;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 100px 20px 40px;

    overflow: hidden;

    isolation: isolate;
}

.poster-background {
    position: fixed;

    inset: 0;

    z-index: -5;

    background-image:
        linear-gradient(
            rgba(5,5,7,.72),
            rgba(5,5,7,.94)
        ),
        url(
            "https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
        );

    background-size: cover;

    background-position: center;

    filter:
        saturate(.75)
        brightness(.7);

    opacity: .5;

    pointer-events: none;
}

.watch-page::after {
    content: "";

    position: fixed;

    inset: 0;

    z-index: -4;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.78) 100%
        );
}

/* =========================
   GLASS NAV
========================= */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1180px, calc(100% - 30px));

    height: 66px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 18px;

    background:
        rgba(12,12,18,.58);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06);

    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;

    gap: 9px;

    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: 700;
}

.logo-dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #ff3657;

    box-shadow:
        0 0 15px rgba(255,54,87,.8);
}

.nav-links {
    display: flex;

    gap: 8px;

    margin-left: 35px;
}

.nav-links a {
    padding: 9px 14px;

    border-radius: 10px;

    color: rgba(255,255,255,.62);

    text-decoration: none;

    font-size: 12px;

    transition: .18s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;

    background:
        rgba(255,255,255,.08);
}

.nav-spacer {
    flex: 1;
}

/* =========================
   PLAYER
========================= */

.custom-player {
    position: relative;

    width: min(1100px, 100%);

    aspect-ratio: 16 / 9;

    background: #000;

    border-radius: 18px;

    overflow: hidden;

    isolation: isolate;

    box-shadow:
        0 24px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.055);

    animation:
        playerAppear .35s ease-out;
}

@keyframes playerAppear {

    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.custom-player video {
    position: relative;

    z-index: 2;

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    outline: none;
}

/* =========================
   TOP OVERLAY
========================= */

.top-overlay {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    padding: 22px 24px;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.18),
            transparent
        );
}

.video-title {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    font-size: 13px;
    font-weight: 600;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);
}

.title-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff3657;

    box-shadow:
        0 0 8px rgba(255,54,87,.75);
}

/* =========================
   CENTER PLAY
========================= */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 72px;
    height: 72px;

    border:
        1px solid rgba(255,255,255,.2);

    border-radius: 50%;

    background:
        rgba(8,8,12,.82);

    backdrop-filter: blur(12px);

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 12;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
}

.custom-player:hover .center-play {
    opacity: .95;
    pointer-events: auto;
}

.center-play:hover {
    background:
        rgba(255,30,55,.88);

    transform:
        translate(-50%,-50%)
        scale(1.06);
}

.center-play span {
    margin-left: 4px;
}

/* =========================
   CONTROLS
========================= */

.video-controls {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    min-height: 82px;

    padding: 30px 18px 13px;

    display: flex;

    align-items: center;

    gap: 10px;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.94) 70%
        );
}

.control-left,
.control-right {
    display: flex;

    align-items: center;

    gap: 7px;
}

.control-right {
    margin-left: auto;
}

.control-btn {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 10px;

    color: white;

    background:
        rgba(255,255,255,.055);

    cursor: pointer;

    font-family:
        "Poppins",
        sans-serif;

    transition:
        background .15s ease,
        transform .15s ease;
}

.control-btn:hover {
    background:
        rgba(255,255,255,.13);
}

.control-btn:active {
    transform: scale(.92);
}

.cc-btn {
    font-size: 11px;

    font-weight: 700;

    letter-spacing: .5px;
}

.video-controls span {
    font-size: 12px;

    font-weight: 500;

    white-space: nowrap;

    color:
        rgba(255,255,255,.82);
}

.time-separator {
    opacity: .35;
}

.progress-wrap {
    flex: 1;

    display: flex;

    align-items: center;

    min-width: 80px;
}

input[type="range"] {
    appearance: none;
    -webkit-appearance: none;

    height: 4px;

    border-radius: 20px;

    cursor: pointer;

    outline: none;

    background:
        rgba(255,255,255,.22);
}

#progress {
    width: 100%;
}

#volume {
    width: 75px;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: none;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}

/* =========================
   SUBTITLE PANEL
========================= */

.subtitle-panel {
    position: absolute;

    right: 18px;
    bottom: 76px;

    width: 300px;

    padding: 17px;

    border-radius: 17px;

    background:
        rgba(12,12,18,.97);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 15px 40px rgba(0,0,0,.65);

    backdrop-filter: blur(18px);

    color: white;

    z-index: 50;

    opacity: 0;

    transform:
        translateY(10px)
        scale(.97);

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.subtitle-panel.active {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

.subtitle-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}

.subtitle-header strong {
    display: block;

    font-size: 15px;
}

.subtitle-header small {
    display: block;

    margin-top: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,.45);
}

.subtitle-header button {
    width: 30px;
    height: 30px;

    border: 0;

    border-radius: 8px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.subtitle-file-btn {
    width: 100%;

    height: 43px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 11px;

    background:
        rgba(255,255,255,.075);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}

.subtitle-file-btn:hover {
    background:
        rgba(255,255,255,.12);
}

.subtitle-status {
    margin-top: 9px;

    padding: 8px 10px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.5);

    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.setting-divider {
    height: 1px;

    margin: 15px 0;

    background:
        rgba(255,255,255,.08);
}

.sync-title {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 9px;

    font-size: 11px;

    font-weight: 600;
}

.sync-help {
    color:
        rgba(255,255,255,.35);

    font-size: 9px;

    font-weight: 400;
}

.sync-controls {
    display: flex;

    align-items: center;

    gap: 8px;
}

.sync-controls button {
    flex: 1;

    height: 37px;

    border: 0;

    border-radius: 9px;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 10px;

    cursor: pointer;
}

#syncValue {
    min-width: 54px;

    text-align: center;

    font-family: monospace;

    font-size: 12px;

    font-weight: 600;
}

.reset-sync {
    width: 100%;

    margin-top: 8px;

    height: 32px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color:
        rgba(255,255,255,.45);

    font-family:
        "Poppins",
        sans-serif;

    font-size: 10px;

    cursor: pointer;
}

.auto-sync-btn {
    width: 100%;

    height: 40px;

    margin-top: 4px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(255,45,80,.16),
            rgba(120,70,255,.12)
        );

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 11px;

    font-weight: 600;

    cursor: pointer;
}

.auto-sync-status {
    margin-top: 7px;

    min-height: 27px;

    text-align: center;

    font-size: 9px;

    line-height: 1.4;

    color:
        rgba(255,255,255,.42);
}

.sync-point-box {
    margin-top: 7px;

    padding: 8px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.055);

    text-align: center;

    font-family: monospace;

    font-size: 9px;

    color:
        rgba(255,255,255,.4);
}

/* VIDEO SUBTITLES */

video::cue {
    background:
        rgba(0,0,0,.72);

    color: white;

    font-family:
        "Poppins",
        Arial,
        sans-serif;

    font-size: 1.05em;

    font-weight: 500;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}

/* FULLSCREEN */

.custom-player:fullscreen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    border-radius: 0;

    box-shadow: none;

    background: #000;
}

.custom-player:fullscreen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

body:has(.custom-player:fullscreen)
.poster-background {
    opacity: 0;

    visibility: hidden;
}

/* MOBILE */

@media(max-width:700px) {

    .watch-page {
        padding:
            90px 12px 12px;
    }

    .navbar {
        top: 10px;

        width: calc(100% - 20px);

        height: 58px;

        padding: 0 13px;
    }

    .nav-links {
        display: none;
    }

    .custom-player {
        border-radius: 14px;
    }

    .video-controls {
        min-height: 68px;

        padding:
            24px 9px 8px;

        gap: 5px;
    }

    .control-btn {
        width: 32px;
        height: 32px;

        border-radius: 8px;
    }

    #volume {
        display: none;
    }

    .video-controls span {
        font-size: 9px;
    }

    .subtitle-panel {
        right: 8px;
        bottom: 62px;

        width:
            min(
                300px,
                calc(100% - 16px)
            );
    }

    .center-play {
        width: 58px;
        height: 58px;

        font-size: 20px;
    }

    .top-overlay {
        padding: 12px 14px;
    }

    .video-title {
        font-size: 10px;
    }
}

</style>

</head>

<body>

     NAVBAR
========================= -->

<nav class="navbar">

    <a

    >
        <span class="logo-dot"></span>

    </a>

    <div class="nav-links">

        <a href="index.html">

        </a>

        <a
            href="watch.html"
            class="active"
        >

        </a>

    </div>

    <div class="nav-spacer"></div>

</nav>


<!-- =========================
     WATCH PAGE
========================= -->

<div class="watch-page">

    <div class="poster-background"></div>

    <div
        class="custom-player"
        id="customPlayer"
    >

        <!-- YOUR VIDEO IS ONLY HERE -->

        <video
            id="video"
            playsinline
            preload="metadata"
            crossorigin="anonymous"
        >

            <source
                src="https://wild-frost-90b0.icarus035.workers.dev/?data=UszpJnE9DIU7yZAetkQaDyJzqXpF0cIOLu3KXP7BaEEGEA7BwSE0isXn1BDgYpUTaGwg1s03wn1BkpHMdIM0bAbmaCTWw1N04Af3FOPEBGhFQkVbADkppo5GR0D46Sq0Q--Gt6gE2VbMGdlWaKNB0W3hwCG3ieL0ZVondAMhGiEZQhIZJtgAyQ-0KzoGdIt8ML9NF2lIV5A"
                type="video/mp4"
            >

        </video>

        <!-- SUBTITLE FILE -->

        <input
            type="file"
            id="subtitleFile"
            accept=".srt,.vtt,text/vtt,application/x-subrip"

            <div class="sync-title">

                </span>

                </span>

            </div>

            <div class="sync-controls">

                <button id="syncBack">
                    −0.5s
                </button>

                <div id="syncValue">
                    0.0s
                </div>

                <button id="syncForward">

                </button>

            </div>

            <button
                class="reset-sync"
                id="resetSync"
            >
                Reset Sync
            </button>

            <div class="setting-divider"></div>

            <div class="sync-title">

                <span>
                    Precise Auto Sync
                </span>

                <span class="sync-help">
                    2-point calibration
                </span>

            </div>

            <button
                class="auto-sync-btn"
                id="markSync"

            </button>

            <div
                class="auto-sync-status"

                Pause the video when a subtitle should appear,
                then set a sync point.

        <!-- CONTROLS -->

        <div class="video-controls">

            <div class="control-left">

                <button
                    id="playBtn"
                    class="control-btn"

                >
                    ▶
                </button>

                <button
                    id="muteBtn"
                    class="control-btn"
                    title="Mute"
                >

                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

                <span id="currentTime">
                    0:00
                </span>

                <span class="time-separator">
                    /
                </span>

                <span id="duration">
                    0:00
                </span>

                <input

                    id="progress"

                    value="0"

                <button
                    id="subtitleBtn"

                    title="Subtitles"

                    CC

        </div>

    </div>

<script>

/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const muteBtn =
    document.getElementById("muteBtn");

const volume =
    document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById("closeSubtitlePanel");

const chooseSubtitle =
    document.getElementById("chooseSubtitle");

const subtitleFile =
    document.getElementById("subtitleFile");

const subtitleStatus =
    document.getElementById("subtitleStatus");

const syncBack =
    document.getElementById("syncBack");

const syncForward =
    document.getElementById("syncForward");

const syncValue =
    document.getElementById("syncValue");

const resetSync =
    document.getElementById("resetSync");

const markSync =
    document.getElementById("markSync");

const autoSyncStatus =
    document.getElementById("autoSyncStatus");

const syncPointBox =
    document.getElementById("syncPointBox");


/* =========================
   STATE
========================= */

let subtitleTrack = null;
let originalVTTText = null;
let subtitleSync = 0;
let subtitleURL = null;

let syncPointVideoTime = null;
let syncPointSubtitleTime = null;

let lastUIUpdate = 0;


/* =========================
   TIME
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${mins}:${secs}`;
}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (video.paused) {

        video.play().catch(error => {

            console.error(
                "Video playback failed:",
                error
            );

        });

    } else {

        video.pause();

    }
}

playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);

video.addEventListener(
    "click",
    togglePlay
);


/* =========================
   VIDEO STATE
========================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

        centerPlay.innerHTML =
            "<span>❚❚</span>";

    }
);

video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

        centerPlay.innerHTML =
            "<span>▶</span>";

    }
);


/* =========================
   VIDEO ERROR
========================= */

video.addEventListener(
    "error",
    () => {

        if (!video.error) return;

        console.error(
            "Video error:",
            video.error.code,
            video.error.message
        );

        subtitleStatus.textContent =
            "Video could not be loaded.";
    }
);


/* =========================
   METADATA
========================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(video.duration);

    }
);


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    () => {

        const now =
            performance.now();

        if (
            now - lastUIUpdate < 100
        ) {
            return;
        }

        lastUIUpdate = now;

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

        if (
            Number.isFinite(video.duration) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);


/* =========================
   SEEK
========================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(video.duration)
        ) {
            return;
        }

        video.currentTime =
            (
                progress.value / 100
            ) * video.duration;

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted = false;

        updateMuteIcon();

    }
);

function updateMuteIcon() {

    muteBtn.textContent =
        video.muted ||
        video.volume === 0
            ? "🔇"
            : "🔊";

}

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

    }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await player.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================
   SUBTITLE PANEL
========================= */

subtitleBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        subtitlePanel.classList.toggle(
            "active"
        );

    }
);

closeSubtitlePanel.addEventListener(
    "click",
    () => {

        subtitlePanel.classList.remove(
            "active"
        );

    }
);


/* =========================
   FILE PICKER
========================= */

chooseSubtitle.addEventListener(
    "click",
    () => {

        subtitleFile.click();

    }
);


/* =========================
   SRT → VTT
========================= */

function srtToVtt(srt) {

    let vtt =
        srt
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .trim();

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    vtt =
        vtt.replace(
            /^\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + vtt;
}


/* =========================
   LOAD SUBTITLE
========================= */

subtitleFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const extension =
            file.name
            .split(".")
            .pop()
            .toLowerCase();

        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;
        }

        try {

            let subtitleText =
                await file.text();

            if (extension === "srt") {

                subtitleText =
                    srtToVtt(
                        subtitleText
                    );

            }

            originalVTTText =
                subtitleText;

            subtitleSync = 0;

            syncPointVideoTime = null;
            syncPointSubtitleTime = null;

            updateSyncDisplay();

            subtitleStatus.textContent =
                `Loaded: ${file.name}`;

            autoSyncStatus.textContent =
                "Pause the video at a known subtitle moment, then press Set Sync Point.";

            syncPointBox.textContent =
                "No sync point set";

            applySubtitleSync();

        } catch (error) {

            console.error(
                "Subtitle error:",
                error
            );

            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);


/* =========================
   APPLY SUBTITLE
========================= */

function applySubtitleSync() {

    if (!originalVTTText) {
        return;
    }

    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "Subtitles";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        true;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    "showing";

            }

        }
    );
}


/* =========================
   SHIFT VTT
========================= */

function shiftVTT(vtt, offset) {

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;

    return vtt.replace(
        timestampRegex,
        timestamp => {

            const parts =
                timestamp.split(":");

            let hours = 0;
            let minutes = 0;
            let seconds = 0;

            if (parts.length === 3) {

                hours =
                    Number(parts[0]);

                minutes =
                    Number(parts[1]);

                seconds =
                    Number(parts[2]);

            } else {

                minutes =
                    Number(parts[0]);

                seconds =
                    Number(parts[1]);

            }

            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;

            total =
                Math.max(0, total);

            const newHours =
                Math.floor(
                    total / 3600
                );

            const remaining =
                total % 3600;

            const newMinutes =
                Math.floor(
                    remaining / 60
                );

            const newSeconds =
                remaining % 60;

            return (
                String(newHours)
                .padStart(2, "0")
                + ":"
                + String(newMinutes)
                .padStart(2, "0")
                + ":"
                + newSeconds
                .toFixed(3)
                .padStart(6, "0")
            );

        }
    );
}


/* =========================
   SYNC
========================= */

function updateSyncDisplay() {

    let value =
        subtitleSync.toFixed(1);

    if (subtitleSync > 0) {
        value = "+" + value;
    }

    syncValue.textContent =
        value + "s";
}

syncBack.addEventListener(
    "click",
    () => {

        subtitleSync -= .5;

        updateSyncDisplay();

        applySubtitleSync();

    }
);

syncForward.addEventListener(
    "click",
    () => {

        subtitleSync += .5;

        updateSyncDisplay();

        applySubtitleSync();

    }
);

resetSync.addEventListener(
    "click",
    () => {

        subtitleSync = 0;

        syncPointVideoTime = null;
        syncPointSubtitleTime = null;

        updateSyncDisplay();

        applySubtitleSync();

        syncPointBox.textContent =
            "No sync point set";

        autoSyncStatus.textContent =
            "Sync reset.";

    }
);


/* =========================
   PARSE SUBTITLES
========================= */

function getSubtitleCues(vtt) {

    const cues = [];

    const lines =
        vtt
        .replace(/\r/g, "")
        .split("\n");

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();

        if (!line.includes("-->")) {
            continue;
        }

        const parts =
            line.split("-->");

        if (parts.length !== 2) {
            continue;
        }

        const start =
            parseVTTTime(
                parts[0].trim()
            );

        const end =
            parseVTTTime(
                parts[1].trim()
            );

        if (
            !Number.isFinite(start) ||
            !Number.isFinite(end)
        ) {
            continue;
        }

        let text = "";

        for (
            let j = i + 1;
            j < lines.length;
            j++
        ) {

            const next =
                lines[j].trim();

            if (!next) {
                break;
            }

            if (next.includes("-->")) {
                break;
            }

            if (!/^\d+$/.test(next)) {

                text +=
                    (text ? " " : "") +
                    next;

            }

        }

        if (text) {

            cues.push({
                start,
                end,
                text:
                    cleanSubtitleText(text)
            });

        }

    }

    return cues;
}


/* =========================
   PARSE TIME
========================= */

function parseVTTTime(time) {

    time =
        time
        .split(" ")[0]
        .trim();

    const parts =
        time.split(":");

    let hours = 0;
    let minutes = 0;
    let seconds = 0;

    if (parts.length === 3) {

        hours =
            Number(parts[0]);

        minutes =
            Number(parts[1]);

        seconds =
            Number(parts[2]);

    } else if (parts.length === 2) {

        minutes =
            Number(parts[0]);

        seconds =
            Number(parts[1]);

    } else {

        return NaN;

    }

    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );
}


/* =========================
   CLEAN TEXT
========================= */

function cleanSubtitleText(text) {

    return text
        .replace(/<[^>]*>/g, "")
        .replace(/\{[^}]*\}/g, "")
        .replace(/&nbsp;/gi, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
}


/* =========================
   FIND CUE
========================= */

function findCueAtTime(cues, time) {

    for (const cue of cues) {

        if (
            time >= cue.start &&
            time <= cue.end
        ) {

            return cue;

        }

    }

    return null;
}


/* =========================
   AUTO SYNC
========================= */

function setSyncPoint() {

    if (!originalVTTText) {

        autoSyncStatus.textContent =
            "Load an SRT or VTT first.";

        return;
    }

    const cues =
        getSubtitleCues(
            originalVTTText
        );

    if (!cues.length) {

        autoSyncStatus.textContent =
            "No valid subtitle cues found.";

        return;
    }

    const videoTime =
        video.currentTime;

    const cue =
        findCueAtTime(
            cues,
            videoTime
        );

    if (!cue) {

        autoSyncStatus.textContent =
            "No subtitle is active at this exact video time.";

        syncPointBox.textContent =
            "No valid cue at current time";

        return;
    }

    subtitleSync =
        Math.round(
            (
                videoTime -
                cue.start
            ) * 100
        ) / 100;

    if (
        Math.abs(subtitleSync) > 30
    ) {

        autoSyncStatus.textContent =
            "That sync point is too far from the subtitle timing.";

        return;
    }

    syncPointVideoTime =
        videoTime;

    syncPointSubtitleTime =
        cue.start;

    updateSyncDisplay();

    applySubtitleSync();

    syncPointBox.textContent =
        "Video " +
        formatTime(videoTime) +
        " → Subtitle " +
        formatTime(cue.start);

    autoSyncStatus.textContent =
        "Sync calculated from an active subtitle.";

}

markSync.addEventListener(
    "click",
    setSyncPoint
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }

        if (
            event.key === " " ||
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            togglePlay();

            return;
        }

        if (
            event.key.toLowerCase() === "m"
        ) {

            event.preventDefault();

            video.muted =
                !video.muted;

            updateMuteIcon();

            return;
        }

        if (
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            fullscreenBtn.click();

            return;
        }

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            return;
        }

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

            return;
        }

        if (
            !subtitlePanel.classList.contains(
                "active"
            )
        ) {
            return;
        }

        if (event.key === "[") {

            subtitleSync -= .5;

            updateSyncDisplay();

            applySubtitleSync();

        }

        if (event.key === "]") {

            subtitleSync += .5;

            updateSyncDisplay();

            applySubtitleSync();

        }

        if (event.key === "\\") {

            subtitleSync = 0;

            updateSyncDisplay();

            applySubtitleSync();

        }

    }
);


/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            !subtitlePanel.contains(
                event.target
            ) &&
            !subtitleBtn.contains(
                event.target
            )
        ) {

            subtitlePanel.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (subtitleURL) {

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;

        }

    }
);


/* =========================
   START
========================= */

updateSyncDisplay();
updateMuteIcon();

</script>

</body>
</html>
