<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #050507;
    color: white;
    font-family: "Poppins", Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
}

.watch-page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow: hidden;
    isolation: isolate;
}

/* BACKGROUND */

.poster-background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background-image:
        linear-gradient(
            rgba(5,5,7,.72),
            rgba(5,5,7,.94)
        ),
        url("https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg");

    background-size: cover;
    background-position: center;
    filter: saturate(.75) brightness(.7);
    opacity: .5;
    pointer-events: none;
}

.watch-page::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.78) 100%
        );
}

/* PLAYER */

.custom-player {
    position: relative;

    width: min(1100px, 100%);
    aspect-ratio: 16 / 9;

    background: #000;
    border-radius: 18px;
    overflow: hidden;
    isolation: isolate;

    box-shadow:
        0 24px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.055);

    animation: playerAppear .35s ease-out;
}

@keyframes playerAppear {
    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.custom-player video {
    position: relative;
    z-index: 2;

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    background: #000;
    outline: none;
}

/* HOME */

.home-button {
    position: absolute;
    top: 18px;
    left: 20px;
    z-index: 100;

    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 9px 14px;

    border-radius: 10px;

    color: white;
    text-decoration: none;

    font-size: 12px;
    font-weight: 600;

    background: rgba(15,15,20,.55);

    border: 1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    transition:
        background .2s ease,
        transform .2s ease;
}

.home-button:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-1px);
}

.home-button:active {
    transform: scale(.96);
}

/* TOP BAR */

.top-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    padding: 22px 24px;

    z-index: 10;
    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.18),
            transparent
        );
}

.video-title {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-left: 90px;

    font-size: 13px;
    font-weight: 600;

    text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.title-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff3657;

    box-shadow:
        0 0 8px rgba(255,54,87,.75);
}

/* CENTER PLAY */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: 72px;
    height: 72px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;

    background: rgba(8,8,12,.82);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: white;
    font-size: 25px;

    cursor: pointer;

    z-index: 12;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
}

.custom-player:hover .center-play,
.custom-player:focus-within .center-play {
    opacity: .95;
    pointer-events: auto;
}

.center-play:hover {
    background: rgba(255,30,55,.88);

    transform:
        translate(-50%,-50%)
        scale(1.06);
}

.center-play span {
    margin-left: 4px;
}

/* CONTROLS */

.video-controls {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    min-height: 82px;

    padding: 30px 18px 13px;

    display: flex;
    align-items: center;
    gap: 10px;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.94) 70%
        );
}

.control-left,
.control-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.control-right {
    margin-left: auto;
}

.control-btn {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 10px;

    color: white;
    background: rgba(255,255,255,.055);

    cursor: pointer;

    font-family: "Poppins", sans-serif;

    transition:
        background .15s ease,
        transform .15s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.13);
}

.control-btn:active {
    transform: scale(.92);
}

.cc-btn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
}

.cc-btn.active {
    background: rgba(255,255,255,.16);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08);
}

.cc-btn.off {
    opacity: .45;
}

.video-controls span {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    color: rgba(255,255,255,.82);
}

.time-separator {
    opacity: .35;
}

.progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 80px;
}

input[type="range"] {
    appearance: none;
    -webkit-appearance: none;

    height: 4px;

    border-radius: 20px;

    cursor: pointer;
    outline: none;

    background: rgba(255,255,255,.22);
}

#progress {
    width: 100%;
}

#volume {
    width: 75px;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;
    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: none;
    border-radius: 50%;

    background: white;
    cursor: pointer;
}

/* SUBTITLE PANEL */

.subtitle-panel {
    position: absolute;

    right: 18px;
    bottom: 76px;

    width: 300px;

    padding: 17px;

    border-radius: 17px;

    background: rgba(12,12,18,.97);

    border: 1px solid rgba(255,255,255,.10);

    box-shadow: 0 15px 40px rgba(0,0,0,.65);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    color: white;

    z-index: 50;

    opacity: 0;

    transform:
        translateY(10px)
        scale(.97);

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.subtitle-panel.active {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

.subtitle-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.subtitle-header strong {
    display: block;
    font-size: 15px;
}

.subtitle-header small {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    color: rgba(255,255,255,.45);
}

.subtitle-header button {
    width: 30px;
    height: 30px;

    border: 0;
    border-radius: 8px;

    background: rgba(255,255,255,.06);

    color: white;
    font-size: 20px;

    cursor: pointer;
}

.subtitle-header button:hover {
    background: rgba(255,255,255,.14);
}

.subtitle-file-btn {
    width: 100%;
    height: 43px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 11px;

    background: rgba(255,255,255,.075);

    color: white;

    font-family: "Poppins", sans-serif;

    font-size: 12px;
    font-weight: 600;

    cursor: pointer;
}

.subtitle-file-btn:hover {
    background: rgba(255,255,255,.12);
}

.subtitle-status {
    margin-top: 9px;

    padding: 8px 10px;

    border-radius: 8px;

    background: rgba(255,255,255,.04);

    color: rgba(255,255,255,.5);

    font-size: 10px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.setting-divider {
    height: 1px;
    margin: 15px 0;
    background: rgba(255,255,255,.08);
}

.sync-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 9px;

    font-size: 11px;
    font-weight: 600;
}

.sync-help {
    color: rgba(255,255,255,.35);
    font-size: 9px;
    font-weight: 400;
}

.sync-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.sync-controls button {
    flex: 1;

    height: 37px;

    border: 0;
    border-radius: 9px;

    background: rgba(255,255,255,.07);

    color: white;

    font-family: "Poppins", sans-serif;

    font-size: 10px;

    cursor: pointer;
}

.sync-controls button:hover {
    background: rgba(255,255,255,.12);
}

#syncValue {
    min-width: 54px;

    text-align: center;

    font-family: monospace;

    font-size: 12px;
    font-weight: 600;
}

.reset-sync {
    width: 100%;

    margin-top: 8px;

    height: 32px;

    border: 0;
    border-radius: 8px;

    background: transparent;

    color: rgba(255,255,255,.45);

    font-family: "Poppins", sans-serif;

    font-size: 10px;

    cursor: pointer;
}

.reset-sync:hover {
    color: white;
    background: rgba(255,255,255,.06);
}

.auto-sync-btn {
    width: 100%;

    height: 40px;

    margin-top: 4px;

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(255,45,80,.16),
            rgba(120,70,255,.12)
        );

    color: white;

    font-family: "Poppins", sans-serif;

    font-size: 11px;
    font-weight: 600;

    cursor: pointer;
}

.auto-sync-status {
    margin-top: 7px;

    min-height: 27px;

    text-align: center;

    font-size: 9px;
    line-height: 1.4;

    color: rgba(255,255,255,.42);
}

.sync-point-box {
    margin-top: 7px;

    padding: 8px;

    border-radius: 8px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.055);

    text-align: center;

    font-family: monospace;

    font-size: 9px;

    color: rgba(255,255,255,.4);
}

/* NETFLIX-STYLE SUBTITLES */

video::cue {
    background: transparent;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 1.08em;
    font-weight: 700;

    text-shadow:
        0 2px 3px #000,
        2px 0 3px #000,
        -2px 0 3px #000,
        0 -1px 3px #000;
}

/* FULLSCREEN */

.custom-player:fullscreen,
.custom-player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    border-radius: 0;
    box-shadow: none;

    background: #000;
}

.custom-player:fullscreen video,
.custom-player:-webkit-full-screen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

body:has(.custom-player:fullscreen) .poster-background,
body:has(.custom-player:-webkit-full-screen) .poster-background {
    opacity: 0;
    visibility: hidden;
}

/* VERSION */

.version-badge {
    position: fixed;

    right: 14px;
    bottom: 12px;

    z-index: 99999;

    padding: 6px 10px;

    border-radius: 9px;

    background: rgba(15,15,20,.65);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    color: rgba(255,255,255,.6);

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .4px;

    pointer-events: none;
    user-select: none;
}

/* MOBILE */

@media (max-width: 700px) {

    .watch-page {
        padding: 12px;
        min-height: 100dvh;
    }

    .custom-player {
        width: 100%;
        border-radius: 14px;
    }

    .home-button {
        top: 10px;
        left: 10px;

        padding: 7px 11px;

        font-size: 10px;
    }

    .video-title {
        margin-left: 75px;
        font-size: 10px;
    }

    .top-overlay {
        padding: 12px 14px;
    }

    .video-controls {
        min-height: 68px;
        padding: 24px 9px 8px;
        gap: 5px;
    }

    .control-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
    }

    #volume {
        display: none;
    }

    .video-controls span {
        font-size: 9px;
    }

    .subtitle-panel {
        right: 8px;
        bottom: 62px;

        width: min(300px, calc(100% - 16px));
    }

    .center-play {
        width: 58px;
        height: 58px;
        font-size: 20px;
    }

    .version-badge {
        right: 8px;
        bottom: 8px;
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>

</head>

<script>

/* VERSION */

const SITE_VERSION = "v1.0.2";

document.getElementById("versionBadge").textContent =
    SITE_VERSION;


/* ELEMENTS */

const video = document.getElementById("video");
const player = document.getElementById("customPlayer");

const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");

const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const muteBtn = document.getElementById("muteBtn");
const volume = document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById("closeSubtitlePanel");

const chooseSubtitle =
    document.getElementById("chooseSubtitle");

const subtitleFile =
    document.getElementById("subtitleFile");

const subtitleStatus =
    document.getElementById("subtitleStatus");

const syncBack =
    document.getElementById("syncBack");

const syncForward =
    document.getElementById("syncForward");

const syncValue =
    document.getElementById("syncValue");

const resetSync =
    document.getElementById("resetSync");

const markSync =
    document.getElementById("markSync");

const autoSyncStatus =
    document.getElementById("autoSyncStatus");

const syncPointBox =
    document.getElementById("syncPointBox");

const githubSubtitle =
    document.getElementById("githubSubtitle");


/* STATE */

let subtitleTrack = null;
let originalVTTText = null;
let subtitleSync = 0;
let subtitleURL = null;
let subtitlesEnabled = true;
let lastUIUpdate = 0;


/* TIME */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const mins = Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${mins}:${secs}`;
}


/* PLAY */

function togglePlay() {

    if (video.paused) {

        video.play().catch(error => {

            console.error(
                "Video playback failed:",
                error
            );

        });

    } else {

        video.pause();

    }
}

playBtn.addEventListener("click", togglePlay);
centerPlay.addEventListener("click", togglePlay);

video.addEventListener("click", event => {

    if (event.target === video) {
        togglePlay();
    }

});


/* PLAY STATE */

video.addEventListener("play", () => {

    playBtn.textContent = "❚❚";

    centerPlay.innerHTML =
        "<span>❚❚</span>";

});

video.addEventListener("pause", () => {

    playBtn.textContent = "▶";

    centerPlay.innerHTML =
        "<span>▶</span>";

});


/* VIDEO ERROR */

video.addEventListener("error", () => {

    const error = video.error;

    if (!error) return;

    console.error(
        "Video error:",
        error.code,
        error.message
    );

    console.error(
        "Video source:",
        video.currentSrc
    );

});


/* LOADING */

video.addEventListener("loadstart", () => {
    console.log("Video: loading started");
});

video.addEventListener("loadedmetadata", () => {

    console.log(
        "Video metadata loaded:",
        video.duration
    );

    duration.textContent =
        formatTime(video.duration);

});

video.addEventListener("canplay", () => {
    console.log("Video can play");
});

video.addEventListener("waiting", () => {
    console.log("Video buffering...");
});


/* PROGRESS */

video.addEventListener("timeupdate", () => {

    const now = performance.now();

    if (now - lastUIUpdate < 100) {
        return;
    }

    lastUIUpdate = now;

    currentTime.textContent =
        formatTime(video.currentTime);

    if (
        Number.isFinite(video.duration) &&
        video.duration > 0
    ) {

        progress.value =
            (video.currentTime / video.duration) * 100;

    }

});


/* SEEK */

progress.addEventListener("input", () => {

    if (!Number.isFinite(video.duration)) {
        return;
    }

    video.currentTime =
        (progress.value / 100) * video.duration;

});


/* VOLUME */

volume.addEventListener("input", () => {

    video.volume = Number(volume.value);
    video.muted = false;

    updateMuteIcon();

});

function updateMuteIcon() {

    muteBtn.textContent =
        video.muted || video.volume === 0
            ? "🔇"
            : "🔊";

}

muteBtn.addEventListener("click", () => {

    video.muted = !video.muted;

    updateMuteIcon();

});


/* FULLSCREEN */

async function enterFullscreen() {

    try {

        if (
            typeof player.requestFullscreen ===
            "function"
        ) {

            await player.requestFullscreen();
            return true;

        }

        if (
            typeof player.webkitRequestFullscreen ===
            "function"
        ) {

            player.webkitRequestFullscreen();
            return true;

        }

    } catch (error) {

        console.warn(
            "Fullscreen failed:",
            error
        );

    }

    return false;
}


async function exitFullscreen() {

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();
            return true;

        }

        if (document.webkitFullscreenElement) {

            document.webkitExitFullscreen();
            return true;

        }

    } catch (error) {

        console.warn(
            "Exit fullscreen failed:",
            error
        );

    }

    return false;
}


async function toggleFullscreen() {

    const isIOS =
        /iPhone|iPad|iPod/i.test(
            navigator.userAgent
        ) ||
        (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
        );

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (isFullscreen) {

        await exitFullscreen();
        return;

    }

    if (
        isIOS &&
        typeof video.webkitEnterFullscreen ===
        "function"
    ) {

        try {

            video.webkitEnterFullscreen();
            return;

        } catch (error) {

            console.warn(
                "iOS fullscreen failed:",
                error
            );

        }

    }

    await enterFullscreen();

}

fullscreenBtn.addEventListener(
    "click",
    toggleFullscreen
);


/* SUBTITLE PANEL */

subtitleBtn.addEventListener("click", event => {

    event.stopPropagation();

    /*
        If subtitles are already loaded,
        CC directly toggles them.
    */

    if (subtitleTrack && subtitleTrack.track) {

        setSubtitlesEnabled(
            !subtitlesEnabled
        );

        return;

    }

    /*
        If no subtitles are loaded,
        open settings/import panel.
    */

    subtitlePanel.classList.toggle("active");

});

closeSubtitlePanel.addEventListener("click", () => {

    subtitlePanel.classList.remove("active");

});


/* SUBTITLE TOGGLE */

function setSubtitlesEnabled(enabled) {

    subtitlesEnabled = enabled;

    if (!subtitleTrack || !subtitleTrack.track) {

        subtitleBtn.classList.remove("active");
        subtitleBtn.classList.add("off");

        return;

    }

    subtitleTrack.track.mode =
        enabled
            ? "showing"
            : "hidden";

    subtitleBtn.classList.toggle(
        "active",
        enabled
    );

    subtitleBtn.classList.toggle(
        "off",
        !enabled
    );

    subtitleBtn.textContent =
        enabled
            ? "CC"
            : "CC̸";

}


/* FIND NATIVE GITHUB TRACK */

function setupGithubSubtitle() {

    if (!githubSubtitle) {
        return;
    }

    subtitleTrack = githubSubtitle;

    subtitleTrack.default = true;

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    subtitlesEnabled
                        ? "showing"
                        : "hidden";

                subtitleStatus.textContent =
                    "Loaded: subtitles.srt";

                subtitleBtn.classList.add(
                    "active"
                );

            }

        }
    );

    /*
        Browser loads the track asynchronously.
        Try immediately too.
    */

    setTimeout(() => {

        if (
            subtitleTrack &&
            subtitleTrack.track
        ) {

            subtitleTrack.track.mode =
                subtitlesEnabled
                    ? "showing"
                    : "hidden";

            subtitleStatus.textContent =
                "Loaded: subtitles.srt";

        }

    }, 500);

}

setupGithubSubtitle();


/* FILE PICKER */

chooseSubtitle.addEventListener("click", () => {

    subtitleFile.click();

});


/* SRT → VTT */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();

    vtt =
        vtt.replace(
            /(\d{2}:)?(\d{2}):(\d{2}),(\d{3})/g,
            "$1$2:$3.$4"
        );

    vtt =
        vtt.replace(
            /^\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + vtt;
}


/* LOAD SUBTITLE FILE */

subtitleFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;

        }

        try {

            let subtitleText =
                await file.text();

            if (extension === "srt") {

                subtitleText =
                    srtToVtt(subtitleText);

            }

            originalVTTText =
                subtitleText;

            subtitleSync = 0;

            updateSyncDisplay();

            subtitleStatus.textContent =
                `Loaded: ${file.name}`;

            applySubtitleSync();

            subtitlePanel.classList.remove(
                "active"
            );

        } catch (error) {

            console.error(
                "Subtitle error:",
                error
            );

            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);


/* APPLY IMPORTED SUBTITLE */

function applySubtitleSync() {

    if (!originalVTTText) {
        return;
    }

    const syncedVTT =
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob =
        new Blob(
            [syncedVTT],
            {
                type: "text/vtt"
            }
        );

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    /*
        Remove the GitHub track when
        manually importing another file.
    */

    if (githubSubtitle) {

        githubSubtitle.remove();

    }

    if (subtitleTrack) {

        subtitleTrack.remove();

        subtitleTrack = null;

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "English";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        subtitlesEnabled;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    subtitlesEnabled
                        ? "showing"
                        : "hidden";

                subtitleBtn.classList.toggle(
                    "active",
                    subtitlesEnabled
                );

                subtitleBtn.classList.toggle(
                    "off",
                    !subtitlesEnabled
                );

            }

        }
    );

}


/* SHIFT VTT */

function shiftVTT(vtt, offset) {

    const timestampRegex =
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g;

    return vtt.replace(
        timestampRegex,
        timestamp => {

            const parts =
                timestamp.split(":");

            let hours = 0;
            let minutes = 0;
            let seconds = 0;

            if (parts.length === 3) {

                hours = Number(parts[0]);
                minutes = Number(parts[1]);
                seconds = Number(parts[2]);

            } else {

                minutes = Number(parts[0]);
                seconds = Number(parts[1]);

            }

            let total =
                hours * 3600 +
                minutes * 60 +
                seconds +
                offset;

            total =
                Math.max(0, total);

            const newHours =
                Math.floor(total / 3600);

            const remaining =
                total % 3600;

            const newMinutes =
                Math.floor(remaining / 60);

            const newSeconds =
                remaining % 60;

            return (
                String(newHours).padStart(2, "0")
                + ":"
                + String(newMinutes).padStart(2, "0")
                + ":"
                + newSeconds.toFixed(3).padStart(6, "0")
            );

        }
    );
}


/* SYNC */

function updateSyncDisplay() {

    let value =
        subtitleSync.toFixed(1);

    if (subtitleSync > 0) {
        value = "+" + value;
    }

    syncValue.textContent =
        value + "s";

}

syncBack.addEventListener("click", () => {

    subtitleSync -= 0.5;

    updateSyncDisplay();
    applySubtitleSync();

});

syncForward.addEventListener("click", () => {

    subtitleSync += 0.5;

    updateSyncDisplay();
    applySubtitleSync();

});

resetSync.addEventListener("click", () => {

    subtitleSync = 0;

    updateSyncDisplay();
    applySubtitleSync();

    syncPointBox.textContent =
        "No sync point set";

});


/* AUTO SYNC */

function parseVTTTime(time) {

    time =
        time
            .split(" ")[0]
            .trim();

    const parts =
        time.split(":");

    if (parts.length === 3) {

        return (
            Number(parts[0]) * 3600 +
            Number(parts[1]) * 60 +
            Number(parts[2])
        );

    }

    if (parts.length === 2) {

        return (
            Number(parts[0]) * 60 +
            Number(parts[1])
        );

    }

    return NaN;
}


function getSubtitleCues(vtt) {

    const cues = [];

    const lines =
        vtt
            .replace(/\r/g, "")
            .split("\n");

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();

        if (!line.includes("-->")) {
            continue;
        }

        const parts =
            line.split("-->");

        if (parts.length !== 2) {
            continue;
        }

        const start =
            parseVTTTime(parts[0].trim());

        const end =
            parseVTTTime(parts[1].trim());

        if (
            !Number.isFinite(start) ||
            !Number.isFinite(end)
        ) {
            continue;
        }

        let text = "";

        for (
            let j = i + 1;
            j < lines.length;
            j++
        ) {

            const next =
                lines[j].trim();

            if (!next) break;

            if (next.includes("-->")) break;

            if (!/^\d+$/.test(next)) {

                text +=
                    (text ? " " : "") +
                    next;

            }

        }

        if (text) {

            cues.push({
                start,
                end,
                text
            });

        }

    }

    return cues;
}


function findCueAtTime(cues, time) {

    for (const cue of cues) {

        if (
            time >= cue.start &&
            time <= cue.end
        ) {

            return cue;

        }

    }

    return null;
}


markSync.addEventListener("click", () => {

    if (!originalVTTText) {

        autoSyncStatus.textContent =
            "Load an SRT or VTT first.";

        return;

    }

    const cues =
        getSubtitleCues(
            originalVTTText
        );

    const cue =
        findCueAtTime(
            cues,
            video.currentTime
        );

    if (!cue) {

        autoSyncStatus.textContent =
            "No subtitle is active at this time.";

        return;

    }

    subtitleSync =
        Math.round(
            (
                video.currentTime -
                cue.start
            ) * 100
        ) / 100;

    updateSyncDisplay();

    applySubtitleSync();

    syncPointBox.textContent =
        "Video " +
        formatTime(video.currentTime) +
        " → Subtitle " +
        formatTime(cue.start);

    autoSyncStatus.textContent =
        "Sync calculated.";

});


/* CLOSE PANEL WHEN CLICKING OUTSIDE */

document.addEventListener("click", event => {

    if (
        !subtitlePanel.contains(event.target) &&
        !subtitleBtn.contains(event.target)
    ) {

        subtitlePanel.classList.remove(
            "active"
        );

    }

});


/* KEYBOARD */

document.addEventListener("keydown", event => {

    if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
    ) {
        return;
    }

    if (
        event.key === " " ||
        event.key.toLowerCase() === "k"
    ) {

        event.preventDefault();
        togglePlay();

    }

    if (event.key.toLowerCase() === "m") {

        event.preventDefault();

        video.muted =
            !video.muted;

        updateMuteIcon();

    }

    if (event.key.toLowerCase() === "f") {

        event.preventDefault();
        toggleFullscreen();

    }

    /*
        C = subtitles ON/OFF
    */

    if (event.key.toLowerCase() === "c") {

        event.preventDefault();

        if (
            subtitleTrack &&
            subtitleTrack.track
        ) {

            setSubtitlesEnabled(
                !subtitlesEnabled
            );

        }

    }

    if (event.key === "ArrowLeft") {

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 5
            );

    }

    if (event.key === "ArrowRight") {

        video.currentTime =
            Math.min(
                video.duration || Infinity,
                video.currentTime + 5
            );

    }

});


/* CLEANUP */

window.addEventListener("beforeunload", () => {

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

        subtitleURL = null;

    }

});


/* INITIALIZE */

updateSyncDisplay();
updateMuteIcon();

</script>

</body>
</html>
