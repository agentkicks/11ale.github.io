/* ================================

================================ */

function togglePlay(){

    if(video.paused){

        video.play().catch(err=>{
            console.error("Playback error:",err);
        });

    }else{

        video.pause();

    }

}

playBtn.onclick=togglePlay;
centerPlay.onclick=togglePlay;

video.addEventListener("play",()=>{

    playBtn.textContent="❚❚";
    centerPlay.textContent="❚❚";

});

video.addEventListener("pause",()=>{

    playBtn.textContent="▶";

});


/* ================================
   TIME
================================ */

function formatTime(seconds){

    if(!Number.isFinite(seconds))
        return "0:00";

    seconds=Math.max(0,Math.floor(seconds));

    const h=Math.floor(seconds/3600);

    const m=Math.floor((seconds%3600)/60);

    const s=seconds%60;

    if(h>0){

        return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

    }

    return m+":"+String(s).padStart(2,"0");

}

/* ================================
   QUALITY SWITCH
================================ */

async function switchQuality(quality){

    if(
        !SOURCES[quality] ||
        quality===currentQuality
    ){

        qualityMenu.classList.remove("active");
        return;

    }

    const wasPlaying=!video.paused;

    const savedTime=video.currentTime;

    const oldVolume=video.volume;

    const oldMuted=video.muted;

    currentQuality=quality;

    qualityMenu.classList.remove("active");

    qualityBtn.textContent=
        quality==="480p" ? "480" : "HD";

    document
        .querySelectorAll(".quality-option")
        .forEach(option=>{

            option.classList.toggle(
                "active",
                option.dataset.quality===quality
            );

        });

    /* Save current subtitle tracks */

    const oldTracks=
        Array.from(video.querySelectorAll("track"));

    oldTracks.forEach(track=>track.remove());

    /* Change source */

    video.pause();

    videoSource.src=
        SOURCES[quality];

    video.load();

    /*
       IMPORTANT:
       Wait for the NEW source metadata.
       This prevents the player getting stuck.
    */

    await new Promise(resolve=>{

        let finished=false;

        const finish=()=>{

            if(finished)return;

            finished=true;

            video.removeEventListener(
                "loadedmetadata",
                finish
            );

            video.removeEventListener(
                "error",
                finish
            );

            resolve();

        };

        video.addEventListener(
            "loadedmetadata",
            finish,
            {once:true}
        );

        video.addEventListener(
            "error",
            finish,
            {once:true}
        );

        setTimeout(finish,15000);

    });

    if(
        Number.isFinite(video.duration) &&
        video.duration>0
    ){

        video.currentTime=
            Math.min(
                savedTime,
                Math.max(0,video.duration-.1)
            );

    }

    video.volume=oldVolume;
    video.muted=oldMuted;

    /* Re-add subtitles */

    if(originalVTTText){

        applySubtitleSync();

    }

    if(wasPlaying){

        try{

            await video.play();

        }catch(err){

            console.warn(
                "Autoplay after quality switch failed:",
                err
            );

        }

    }

}

let subtitleTrack=null;
let originalVTTText=null;
let subtitleSync=0;
let subtitleURL=null;
let subtitlesEnabled=true;


function srtToVtt(srt){

    let text=
        srt
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .trim();

    text=
        text.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    text=
        text.replace(/^\d+\s*$/gm,"");

    return "WEBVTT\n\n"+text;

}


async function loadSubtitleText(text,name){

    originalVTTText=text;

    subtitleSync=0;

    updateSync();

    subtitleStatus.textContent=
        "Loaded: "+name;

    applySubtitleSync();

}


async function loadDefaultSubtitles(){

    try{

        const response=
            await fetch(
                "./subtitles.srt",
                {cache:"no-store"}
            );

        if(!response.ok)
            throw new Error(
                "HTTP "+response.status
            );

        const srt=
            await response.text();

        if(!srt.trim())
            throw new Error("Empty subtitle file");

        await loadSubtitleText(
            srtToVtt(srt),
            "subtitles.srt"
        );

    }catch(error){

        console.warn(
            "subtitles.srt not found:",
            error
        );

        subtitleStatus.textContent=
            "No subtitles loaded";

    }

}


chooseSubtitle.onclick=()=>{

subtitleFile.addEventListener(
"change",
async event=>{

    const file=
        event.target.files[0];

    if(!file)return;

    const ext=
        file.name
        .split(".")
        .pop()
        .toLowerCase();

    if(ext!=="srt" && ext!=="vtt"){

        subtitleStatus.textContent=
            "Use an SRT or VTT file.";

        return;

    }

    let text=
        await file.text();

    if(ext==="srt")
        text=srtToVtt(text);

    await loadSubtitleText(
        text,
        file.name
    );

});


function shiftVTT(vtt,offset){

    return vtt.replace(
        /(\d{2}:)?\d{2}:\d{2}\.\d{3}/g,
        timestamp=>{

            const parts=
                timestamp.split(":");

            let h=0;
            let m=0;
            let s=0;

            if(parts.length===3){

                h=Number(parts[0]);
                m=Number(parts[1]);
                s=Number(parts[2]);

            }else{

                m=Number(parts[0]);
                s=Number(parts[1]);

            }

            let total=
                h*3600+
                m*60+
                s+
                offset;

            total=Math.max(0,total);

            h=Math.floor(total/3600);

            const remain=total%3600;

            m=Math.floor(remain/60);

            s=remain%60;

            return(
                String(h).padStart(2,"0")+
                ":"+
                String(m).padStart(2,"0")+
                ":"+
                s.toFixed(3).padStart(6,"0")
            );

        }
    );

}


function applySubtitleSync(){

    if(!originalVTTText)return;

    const synced=
        shiftVTT(
            originalVTTText,
            subtitleSync
        );

    const blob=
        new Blob(
            [synced],
            {type:"text/vtt"}
        );

    if(subtitleURL)
        URL.revokeObjectURL(subtitleURL);

    subtitleURL=
        URL.createObjectURL(blob);

    if(subtitleTrack)
        subtitleTrack.remove();

    subtitleTrack=
        document.createElement("track");

    subtitleTrack.kind="subtitles";
    subtitleTrack.label="English";
    subtitleTrack.srclang="en";
    subtitleTrack.src=subtitleURL;
    subtitleTrack.default=true;

    video.appendChild(subtitleTrack);

    subtitleTrack.addEventListener(
        "load",
        ()=>{

            if(subtitleTrack.track){

                subtitleTrack.track.mode=
                    subtitlesEnabled
                    ? "showing"
                    : "hidden";

            }

        }
    );

}


function updateSync(){

    syncValue.textContent=
        (subtitleSync>0?"+":"")+
        subtitleSync.toFixed(1)+"s";

}


syncBack.onclick=()=>{

    subtitleSync-=.5;
    updateSync();

};

e=>{

    if(
        e.key===" " ||
        e.key.toLowerCase()==="k"
    ){

        e.preventDefault();
        togglePlay();

    }

    if(e.key.toLowerCase()==="m"){

        video.muted=!video.muted;
        updateMute();

    }

    if(e.key.toLowerCase()==="f"){

        fullscreenBtn.click();

    }

    if(e.key.toLowerCase()==="c"){

        subtitleBtn.click();

    }

    if(e.key.toLowerCase()==="q"){

        qualityMenu.classList.toggle("active");

    }

    if(e.key==="ArrowLeft"){

        video.currentTime=
            Math.max(
                0,
                video.currentTime-5
            );

    }

    if(e.key==="ArrowRight"){

        video.currentTime=
            Math.min(
                video.duration||Infinity,
                video.currentTime+5
            );

    }

});
