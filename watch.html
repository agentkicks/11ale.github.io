<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #050507;
    color: #fff;
    font-family: "Poppins", Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
}

.watch-page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 35px;
    overflow: hidden;
    isolation: isolate;
}

/* BACKGROUND */

.poster-background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background-image:
        linear-gradient(
            rgba(5,5,7,.72),
            rgba(5,5,7,.94)
        ),
        url("https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg");

    background-size: cover;
    background-position: center;

    filter: saturate(.75) brightness(.7);
    opacity: .5;
    pointer-events: none;
}

.watch-page::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.78) 100%
        );
}

/* PLAYER */

.custom-player {
    position: relative;
    width: min(1100px, 100%);
    aspect-ratio: 16 / 9;

    background: #000;
    border-radius: 18px;
    overflow: hidden;
    isolation: isolate;

    box-shadow:
        0 24px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.055);

    animation: playerAppear .35s ease-out;
}

@keyframes playerAppear {
    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.custom-player video {
    position: relative;
    z-index: 2;

    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;
    background: #000;
    outline: none;
}

/* HOME */

.home-button {
    position: absolute;
    top: 18px;
    left: 20px;
    z-index: 100;

    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 9px 14px;

    border-radius: 10px;

    color: white;
    text-decoration: none;

    font-size: 12px;
    font-weight: 600;

    background: rgba(15,15,20,.55);
    border: 1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    transition: .2s ease;
}

.home-button:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-1px);
}

.home-button:active {
    transform: scale(.96);
}

/* TOP */

.top-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    padding: 22px 24px;

    z-index: 10;
    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.18),
            transparent
        );
}

.video-title {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-left: 90px;

    font-size: 13px;
    font-weight: 600;

    text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.title-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #ff3657;

    box-shadow:
        0 0 8px rgba(255,54,87,.75);
}

/* CENTER PLAY */

.center-play {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: 72px;
    height: 72px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;

    background: rgba(8,8,12,.82);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: white;
    font-size: 25px;

    cursor: pointer;
    z-index: 12;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
}

.custom-player.controls-visible .center-play {
    opacity: .95;
    pointer-events: auto;
}

.center-play:hover {
    background: rgba(255,30,55,.88);
    transform: translate(-50%,-50%) scale(1.06);
}

.center-play span {
    margin-left: 4px;
}

/* CONTROLS */

.video-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;

    min-height: 82px;
    padding: 30px 18px 13px;

    display: flex;
    align-items: center;
    gap: 10px;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.94) 70%
        );

    opacity: 1;
    transform: translateY(0);

    transition:
        opacity .25s ease,
        transform .25s ease;

    pointer-events: auto;
}

.custom-player.controls-hidden .video-controls {
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
}

.control-left,
.control-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.control-right {
    margin-left: auto;
}

.control-btn {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 10px;

    color: white;
    background: rgba(255,255,255,.055);

    cursor: pointer;
    font-family: "Poppins", sans-serif;

    transition:
        background .15s ease,
        transform .15s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.13);
}

.control-btn:active {
    transform: scale(.92);
}

.cc-btn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
}

.video-controls span {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    color: rgba(255,255,255,.82);
}

.time-separator {
    opacity: .35;
}

.progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 80px;
}

input[type="range"] {
    appearance: none;
    -webkit-appearance: none;

    height: 4px;
    border-radius: 20px;

    cursor: pointer;
    outline: none;

    background: rgba(255,255,255,.22);
}

#progress {
    width: 100%;
}

#volume {
    width: 75px;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;
    background: white;
    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: none;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

/* SETTINGS */

.subtitle-panel {
    position: absolute;

    right: 18px;
    bottom: 76px;

    width: 310px;
    max-height: calc(100% - 95px);
    overflow-y: auto;

    padding: 17px;

    border-radius: 17px;

    background: rgba(12,12,18,.97);
    border: 1px solid rgba(255,255,255,.10);

    box-shadow: 0 15px 40px rgba(0,0,0,.65);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    color: white;
    z-index: 50;

    opacity: 0;
    transform: translateY(10px) scale(.97);

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.subtitle-panel.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.subtitle-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.subtitle-header strong {
    display: block;
    font-size: 15px;
}

.subtitle-header small {
    display: block;

}

.subtitle-header button {

    background: rgba(255,255,255,.06);

    color: white;

}

.subtitle-header button:hover {
    background: rgba(255,255,255,.14);
}

.subtitle-file-btn {

    background: rgba(255,255,255,.075);

}

.subtitle-file-btn:hover {

}

.subtitle-status {

    color: rgba(255,255,255,.5);

    font-size: 10px;

    overflow: hidden;

}

.setting-divider {
    height: 1px;

    background: rgba(255,255,255,.08);

.quality-title {

    font-size: 11px;
    font-weight: 600;

.quality-current {
    color: rgba(255,255,255,.4);

    font-weight: 400;
}

.quality-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.quality-option {
    height: 37px;

    border: 0;
    border-radius: 9px;

    background: rgba(255,255,255,.07);

    color: white;

    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 600;

    cursor: pointer;

    transition: .15s ease;
}

.quality-option:hover {
    background: rgba(255,255,255,.13);
}

.quality-option.active {
    background: rgba(255,54,87,.22);
    border: 1px solid rgba(255,54,87,.45);
}

.quality-loading {
    margin-top: 8px;

    color: rgba(255,255,255,.4);
    font-size: 9px;

video::cue {

.server-section {

@keyframes serverAppear {

    }
}

.server-heading {

.server-heading span {
    font-size: 14px;

}

.server-heading small {
    color: rgba(255,255,255,.38);

}

.server-list {

    flex-wrap: wrap;
}

.server-card {
    min-width: 210px;

    align-items: center;
    gap: 11px;

    padding: 12px 14px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;

    background: rgba(255,255,255,.045);

    color: white;
    cursor: pointer;

    font-family: "Poppins", sans-serif;

    transition:

        border .2s ease,
        transform .2s ease;
}

.server-card:hover {
    background: rgba(255,255,255,.09);
    transform: translateY(-1px);
}

.server-card.active {
    border-color: rgba(255,54,87,.45);

    background:
        linear-gradient(

            rgba(255,54,87,.13),
            rgba(100,60,255,.08)

}

.server-icon {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background: rgba(255,255,255,.08);

    font-size: 12px;
}

.server-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
}

.server-info strong {
    font-size: 11px;
}

.server-info small {
    color: rgba(255,255,255,.4);
    font-size: 9px;
}

.server-status {
    margin-left: auto;
    color: #49e88a;
    font-size: 9px;
}

/* FULLSCREEN */

.custom-player:fullscreen,
.custom-player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    max-width: none;

    border-radius: 0;
    box-shadow: none;

    background: #000;
}

.custom-player:fullscreen video,
.custom-player:-webkit-full-screen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

body:has(.custom-player:fullscreen) .poster-background,
body:has(.custom-player:-webkit-full-screen) .poster-background {
    opacity: 0;
    visibility: hidden;
}

/* VERSION */

.version-badge {

    right: 14px;
    bottom: 12px;

/* MOBILE / IPAD */

@media (max-width: 700px) {

    }

    .quality-options {
        grid-template-columns: repeat(3, 1fr);

    .version-badge {

    }

@media (pointer: coarse) {

@media (prefers-reduced-motion: reduce) {

    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>

/* =========================
   TIME
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    seconds =
        Math.max(0, Math.floor(seconds));

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* =========================

function togglePlay() {

    } else {

    }

}

function showControls() {

}

    ) {

    } else {

        } else {

        }

    }

}

function updateProgress() {

    if (
        Number.isFinite(video.duration) &&
        video.duration > 0

            (video.currentTime / video.duration) * 100;

    }

    currentTime.textContent =

    progressFrame =

}

progressFrame =

/* =========================
   QUALITY SWITCHING
========================= */

async function changeQuality(quality) {

    const newSource =
        qualitySources[quality];

    if (!newSource) return;

    if (currentQuality === quality) {
        return;
    }

    const savedTime =
        video.currentTime;

    const wasPlaying =
        !video.paused;

    const savedVolume =
        video.volume;

    const wasMuted =
        video.muted;

    qualityLoading.textContent =
        "Switching quality...";

    qualityButtons.forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.quality === quality
        );

    });

    currentQuality = quality;

    qualityCurrent.textContent =
        quality === "auto"
            ? "Auto"
            : quality + "p";

    /*
       Keep the same video element so
       subtitles and controls remain attached.
    */

    video.pause();

    videoSource.src =
        newSource;

    video.load();

    const restorePlayback =
        () => {

            if (
                Number.isFinite(video.duration)
            ) {

                video.currentTime =
                    Math.min(
                        savedTime,
                        Math.max(
                            0,
                            video.duration - 0.1
                        )
                    );

            }

            video.volume =
                savedVolume;

            video.muted =
                wasMuted;

            qualityLoading.textContent =
                "Quality: " +
                (
                    quality === "auto"
                        ? "Auto"
                        : quality + "p"
                );

            video.removeEventListener(
                "loadedmetadata",
                restorePlayback
            );

            if (wasPlaying) {

                video.play().catch(() => {});

            }

        };

    video.addEventListener(
        "loadedmetadata",
        restorePlayback
    );

}

qualityButtons.forEach(button => {

async function toggleFullscreen() {

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (isFullscreen) {

        try {

            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }

        } catch (error) {
            console.warn(error);
        }

        showControls();

        return;
    }

    const isIOS =
        /iPhone|iPad|iPod/i.test(
            navigator.userAgent
        ) ||
        (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
        );

    if (
        isIOS &&
        typeof video.webkitEnterFullscreen === "function"
    ) {

        try {

            video.webkitEnterFullscreen();

        } catch (error) {

            console.warn(
                "iOS fullscreen failed:",
                error
            );

        }

        return;
    }

    try {

        if (player.requestFullscreen) {

            await player.requestFullscreen();

        } else if (player.webkitRequestFullscreen) {

            player.webkitRequestFullscreen();

        }

    } catch (error) {

        console.warn(
            "Fullscreen failed:",
            error
        );

    }

    showControls();

}

/* =========================
   SRT TO VTT
========================= */

function srtToVtt(srt) {

    let vtt =
        srt
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .trim();

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    vtt =
        vtt.replace(
            /^\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + vtt;

}


/* =========================
   SUBTITLE LOAD
========================= */

function applySubtitle() {

    if (!originalVTTText) {
        return;
    }

    const blob =
        new Blob(
            [originalVTTText],
            {
                type: "text/vtt"
            }
        );

    if (subtitleURL) {

        URL.revokeObjectURL(
            subtitleURL
        );

    }

    subtitleURL =
        URL.createObjectURL(blob);

    if (subtitleTrack) {

        subtitleTrack.remove();

    }

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind =
        "subtitles";

    subtitleTrack.label =
        "English";

    subtitleTrack.srclang =
        "en";

    subtitleTrack.src =
        subtitleURL;

    subtitleTrack.default =
        subtitlesEnabled;

    video.appendChild(
        subtitleTrack
    );

    subtitleTrack.addEventListener(
        "load",
        () => {

            if (
                subtitleTrack &&
                subtitleTrack.track
            ) {

                subtitleTrack.track.mode =
                    subtitlesEnabled
                        ? "showing"
                        : "hidden";

            }

        }
    );

}

async function loadSubtitleText(
    subtitleText,
    filename
) {

    originalVTTText =
        subtitleText;

    subtitleStatus.textContent =
        "Loaded: " + filename;

    applySubtitle();

}


/* =========================
   DEFAULT SUBTITLES
========================= */

async function loadDefaultSubtitles() {

    try {

        subtitleStatus.textContent =
            "Loading subtitles.srt...";

        const response =
            await fetch(
                "./subtitles.srt",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const srt =
            await response.text();

        if (!srt.trim()) {
            throw new Error(
                "Subtitle file is empty"
            );
        }

        const vtt =
            srtToVtt(srt);

        await loadSubtitleText(
            vtt,
            "subtitles.srt"
        );

    } catch (error) {

        console.warn(
            "Could not load subtitles.srt:",
            error
        );

        subtitleStatus.textContent =
            "No subtitles loaded";

    }

}


/* =========================
   MANUAL IMPORT
========================= */

subtitleFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        if (
            extension !== "srt" &&
            extension !== "vtt"
        ) {

            subtitleStatus.textContent =
                "Please select an SRT or VTT file.";

            subtitleFile.value = "";

            return;

        }

        try {

            let text =
                await file.text();

            if (extension === "srt") {

                text =
                    srtToVtt(text);

            }

            await loadSubtitleText(
                text,
                file.name
            );

        } catch (error) {

            console.error(error);

            subtitleStatus.textContent =
                "Could not read subtitle file.";

        }

    }
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }

        if (
            event.key === " " ||
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            togglePlay();

        }

        if (
            event.key.toLowerCase() === "m"
        ) {

            event.preventDefault();

            video.muted =
                !video.muted;

            updateMuteIcon();

        }

        if (
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            toggleFullscreen();

        }

        if (
            event.key.toLowerCase() === "c"
        ) {

            event.preventDefault();

            toggleSubtitles();

        }

        if (event.key === "ArrowLeft") {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            showControls();

        }

        if (event.key === "ArrowRight") {

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );

            showControls();

        }

    }
);
