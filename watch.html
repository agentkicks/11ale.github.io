<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>CineView — Watch</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#050507;
    color:#fff;
    font-family:"Poppins",Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.22);
    border-radius:20px;
}

.watch-page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:105px 20px 35px;
    overflow:hidden;
    isolation:isolate;
}

/* BACKGROUND */

.poster-background{
    position:fixed;
    inset:-25px;
    z-index:-5;

    background-image:
        linear-gradient(
            rgba(5,5,7,.62),
            rgba(5,5,7,.91)
        ),
        url("BND.png");

    background-size:cover;
    background-position:center;

    filter:blur(10px) saturate(.85) brightness(.7);
    opacity:.75;

    pointer-events:none;
    transform:scale(1.04);
}

.watch-page::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.78) 100%
        );
}

/* NAVBAR */

.navbar{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    width:min(1150px,calc(100% - 30px));
    min-height:64px;

    display:flex;
    align-items:center;

    padding:0 22px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    background:rgba(15,15,20,.58);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:0 15px 45px rgba(0,0,0,.4);

    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:21px;
    font-weight:700;
    letter-spacing:-.5px;

    text-decoration:none;
    color:white;
    white-space:nowrap;
}

.logo img{
    width:31px;
    height:31px;
    object-fit:contain;
    border-radius:8px;
}

.logo span{
    color:#ff3155;
}

.nav-links{
    display:flex;
    gap:7px;
    margin-left:32px;
}

.nav-links a{
    position:relative;

    color:rgba(255,255,255,.6);
    text-decoration:none;

    padding:9px 14px;
    border-radius:10px;

    font-size:13px;

    transition:.2s ease;
}

.nav-links a:hover{
    color:#fff;
    background:rgba(255,255,255,.08);
    transform:translateY(-1px);
}

.nav-links a.active{
    color:#fff;
    background:rgba(255,255,255,.08);
}

.nav-links a.active::after{
    content:"";

    position:absolute;
    left:50%;
    bottom:3px;

    width:18px;
    height:2px;

    transform:translateX(-50%);

    border-radius:10px;
    background:#ff3155;

    box-shadow:0 0 8px rgba(255,49,85,.7);
}

.nav-spacer{
    flex:1;
}

.nav-status{
    padding:8px 12px;

    border-radius:10px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);

    color:rgba(255,255,255,.55);
    font-size:11px;
}

/* PLAYER */

.custom-player{
    position:relative;

    width:min(1100px,100%);
    aspect-ratio:16 / 9;

    background:#000;

    border-radius:18px;
    overflow:hidden;
    isolation:isolate;

    box-shadow:
        0 24px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.055);
}

.custom-player video{
    position:relative;
    z-index:2;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
    outline:none;
}

/* LOADING */

.loading-overlay{
    position:absolute;
    inset:0;

    z-index:40;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.3);

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:opacity .2s ease;
}

.custom-player.loading .loading-overlay{
    opacity:1;
    visibility:visible;
}

.loading-spinner{
    width:42px;
    height:42px;

    border:3px solid rgba(255,255,255,.18);
    border-top-color:#ff3155;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.loading-text{
    margin-top:12px;

    color:rgba(255,255,255,.7);
    font-size:11px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOP */

.top-overlay{
    position:absolute;
    top:0;
    left:0;
    right:0;

    padding:22px 24px;

    z-index:10;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,.18),
            transparent
        );
}

.video-title{
    display:inline-flex;
    align-items:center;
    gap:9px;

    font-size:13px;
    font-weight:600;

    text-shadow:0 2px 8px rgba(0,0,0,.7);
}

.title-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff3657;

    box-shadow:0 0 8px rgba(255,54,87,.75);
}

/* CENTER PLAY */

.center-play{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:72px;
    height:72px;

    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;

    background:rgba(8,8,12,.82);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    color:#fff;
    font-size:25px;

    cursor:pointer;

    z-index:30;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
}

/* ONLY show when paused AND NOT LOADING */

.custom-player.video-paused:not(.loading) .center-play{
    opacity:.95;
    visibility:visible;
    pointer-events:auto;
}

/* NEVER show while playing */

.custom-player.video-playing .center-play,
.custom-player.loading .center-play{
    opacity:0 !important;
    visibility:hidden !important;
    pointer-events:none !important;
}

.center-play:hover{
    background:rgba(255,30,55,.88);
    transform:translate(-50%,-50%) scale(1.06);
}

.center-play:active{
    transform:translate(-50%,-50%) scale(.94);
}

/* CONTROLS */

.video-controls{
    position:absolute;

    bottom:0;
    left:0;
    right:0;

    min-height:82px;

    padding:30px 18px 13px;

    display:flex;
    align-items:center;

    gap:10px;

    z-index:20;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.94) 70%
        );

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.custom-player.controls-hidden .video-controls{
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
}

.control-left,
.control-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.control-right{
    margin-left:auto;
}

.control-btn{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:10px;

    color:#fff;
    background:rgba(255,255,255,.055);

    cursor:pointer;

    font-family:"Poppins",sans-serif;

    transition:.15s ease;
}

.control-btn:hover{
    background:rgba(255,255,255,.13);
}

.control-btn:active{
    transform:scale(.92);
}

.cc-btn{
    font-size:11px;
    font-weight:700;
}

.video-controls span{
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
    color:rgba(255,255,255,.82);
}

.time-separator{
    opacity:.35;
}

.progress-wrap{
    flex:1;
    display:flex;
    align-items:center;
    min-width:80px;
}

input[type="range"]{
    appearance:none;
    -webkit-appearance:none;

    height:4px;

    border-radius:20px;

    cursor:pointer;
    outline:none;

    background:rgba(255,255,255,.22);
}

#progress{
    width:100%;
}

#volume{
    width:75px;
}

input[type="range"]::-webkit-slider-thumb{
    appearance:none;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#fff;
}

input[type="range"]::-moz-range-thumb{
    width:13px;
    height:13px;

    border:none;
    border-radius:50%;

    background:#fff;
}

/* QUALITY */

.quality-select{
    height:38px;

    padding:0 10px;

    border:0;
    border-radius:10px;

    background:rgba(255,255,255,.055);

    color:#fff;

    font-family:"Poppins",sans-serif;
    font-size:10px;
    font-weight:600;

    outline:none;
    cursor:pointer;
}

.quality-select:hover{
    background:rgba(255,255,255,.13);
}

.quality-select:disabled{
    opacity:.55;
    cursor:wait;
}

.quality-select option{
    background:#111116;
    color:#fff;
}

/* SUBTITLES */

video::cue{
    background:transparent !important;

    color:#fff;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size:1.08em;
    font-weight:500;

    text-shadow:
        0 2px 4px rgba(0,0,0,.95),
        0 0 7px rgba(0,0,0,.75);
}

.subtitle-panel{
    position:absolute;

    right:18px;
    bottom:76px;

    width:300px;

    padding:17px;

    border-radius:17px;

    background:rgba(12,12,18,.97);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:0 15px 40px rgba(0,0,0,.65);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:#fff;

    z-index:50;

    opacity:0;

    transform:translateY(10px) scale(.97);

    pointer-events:none;

    transition:.2s ease;
}

.subtitle-panel.active{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.subtitle-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.subtitle-header strong{
    display:block;
    font-size:15px;
}

.subtitle-header small{
    display:block;

    margin-top:2px;

    font-size:10px;

    color:rgba(255,255,255,.45);
}

.subtitle-header button{
    width:30px;
    height:30px;

    border:0;
    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:#fff;
    font-size:20px;

    cursor:pointer;
}

.subtitle-options{
    display:flex;
    flex-direction:column;
    gap:7px;

    margin-bottom:10px;
}

.subtitle-option{
    width:100%;
    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;

    background:rgba(255,255,255,.045);

    color:#fff;

    font-family:"Poppins",sans-serif;
    font-size:11px;

    cursor:pointer;
}

.subtitle-option.active{
    border-color:rgba(255,49,85,.5);
    background:rgba(255,49,85,.12);
}

.subtitle-option-status{
    color:#49e88a;
    font-size:9px;
}

.subtitle-file-btn{
    width:100%;
    height:43px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:11px;

    background:rgba(255,255,255,.075);

    color:#fff;

    font-family:"Poppins",sans-serif;
    font-size:12px;
    font-weight:600;

    cursor:pointer;
}

.subtitle-status{
    margin-top:9px;

    padding:8px 10px;

    border-radius:8px;

    background:rgba(255,255,255,.04);

    color:rgba(255,255,255,.5);

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* SERVERS */

.server-section{
    width:min(1100px,100%);
    margin-top:18px;
}

.server-heading{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:10px;
}

.server-heading span{
    font-size:14px;
    font-weight:700;
}

.server-heading small{
    color:rgba(255,255,255,.38);
    font-size:10px;
}

.server-list{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.server-card{
    min-width:210px;

    display:flex;
    align-items:center;
    gap:11px;

    padding:12px 14px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;

    background:rgba(255,255,255,.045);

    color:#fff;

    cursor:pointer;

    font-family:"Poppins",sans-serif;

    transition:.2s ease;
}

.server-card:hover{
    background:rgba(255,255,255,.09);
    transform:translateY(-1px);
}

.server-card.active{
    border-color:rgba(255,54,87,.45);

    background:
        linear-gradient(
            135deg,
            rgba(255,54,87,.13),
            rgba(100,60,255,.08)
        );
}

.server-icon{
    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:rgba(255,255,255,.08);

    font-size:12px;
}

.server-info{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
}

.server-info strong{
    font-size:11px;
}

.server-info small{
    color:rgba(255,255,255,.4);
    font-size:9px;
}

.server-status{
    margin-left:auto;
    color:#49e88a;
    font-size:9px;
}

/* VERSION */

.version-badge{
    position:fixed;

    right:14px;
    bottom:12px;

    z-index:99999;

    padding:6px 10px;

    border-radius:9px;

    background:rgba(15,15,20,.65);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);

    color:rgba(255,255,255,.6);

    font-size:10px;
    font-weight:600;

    pointer-events:none;
}

/* MOBILE */

@media(max-width:900px){

    .watch-page{
        padding:95px 12px 30px;
    }

    .navbar{
        top:10px;
        height:58px;
        padding:0 15px;
    }

    .custom-player{
        border-radius:14px;
    }

    .quality-select{
        height:32px;
        padding:0 7px;
        font-size:9px;
    }

    .control-btn{
        width:34px;
        height:34px;
    }
}

@media(max-width:700px){

    .watch-page{
        padding:82px 12px 30px;
    }

    .navbar{
        width:calc(100% - 20px);
    }

    .nav-links{
        margin-left:12px;
        gap:2px;
    }

    .nav-links a{
        padding:8px 9px;
        font-size:10px;
    }

    .nav-status{
        display:none;
    }

    .logo{
        font-size:17px;
    }

    .logo img{
        width:27px;
        height:27px;
    }

    .video-controls{
        min-height:68px;
        padding:24px 9px 8px;
        gap:5px;
    }

    .control-btn{
        width:32px;
        height:32px;
        border-radius:8px;
    }

    #volume{
        display:none;
    }

    .video-controls span{
        font-size:9px;
    }

    .quality-select{
        height:32px;
        border-radius:8px;
        font-size:8px;
    }

    .subtitle-panel{
        right:8px;
        bottom:62px;
        width:min(300px,calc(100% - 16px));
    }

    .center-play{
        width:58px;
        height:58px;
        font-size:20px;
    }

    .server-list{
        flex-direction:column;
    }

    .server-card{
        width:100%;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<div class="version-badge" id="versionBadge">
    v1.0.6
</div>

<div class="watch-page">

    <div class="poster-background"></div>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="logo.png" alt="CineView">
            Cine<span>View</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="watch.html" class="active">
                Watch
            </a>

            <!-- NO WAY HOME BUTTON -->
            <a href="watch2.html">
                No Way Home
            </a>

        </div>

        <div class="nav-spacer"></div>

        <div class="nav-status">
            Brand New Day
        </div>

    </nav>


    <!-- PLAYER -->
    <div
        class="custom-player video-paused"
        id="customPlayer"
    >

        <video
            id="video"
            playsinline
            webkit-playsinline
            x-webkit-airplay="allow"
            preload="metadata"
        >
            <source
                id="videoSource"
                src="https://old-smoke-c852.icarus043.workers.dev/?data=Hp_uaUkJlAONqEwebXsY2Pyshr6O4gJP3eWPXN6RHR1dSz6sX92cKJBFigEtK5hrl-CVfkRvT7E81DHcMXc9Q1qGIkYr9Jsqe0o-dFhpI360AlXUfdyc56E6xfYdkM6qdq-PNj_30I2qucU184lGlV8EQkbbC7LKVbYBCqT5QnkMJeTv_gegvS8iNJV9gryB4EYGHfiy6XdE"
                type="video/mp4"
            >
        </video>

        <!-- LOADING -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">
                Loading video...
            </div>
        </div>

        <input
            type="file"
            id="subtitleFile"
            accept=".srt,.vtt,text/vtt,application/x-subrip"
            hidden
        >

        <!-- CENTER PLAY -->
        <button
            class="center-play"
            id="centerPlay"
            aria-label="Play"
        >
            ▶
        </button>

        <div class="top-overlay">
            <div class="video-title">
                <span class="title-dot"></span>
                Spider-Man: Brand New Day
            </div>
        </div>

        <!-- SUBTITLE PANEL -->
        <div class="subtitle-panel" id="subtitlePanel">

            <div class="subtitle-header">

                <div>
                    <strong>Subtitles</strong>
                    <small>Select a subtitle source</small>
                </div>

                <button id="closeSubtitlePanel">
                    ×
                </button>

            </div>

            <div class="subtitle-options">

                <button
                    class="subtitle-option"
                    id="githubSubtitle"
                >
                    <span>English</span>

                    <span
                        class="subtitle-option-status"
                        id="githubSubtitleStatus"
                    >
                        OFF
                    </span>
                </button>

                <button
                    class="subtitle-option active"
                    id="noneSubtitle"

                    <span>Off</span>
                    <span class="subtitle-option-status">—</span>
                </button>

            </div>

            <button
                class="subtitle-file-btn"
                id="chooseSubtitle"

                ＋ Import Subtitle

            <div

        </div>


        <!-- CONTROLS -->
        <div class="video-controls">

            <div class="control-left">

                <button
                    id="playBtn"
                    class="control-btn"

                >
                    ▶
                </button>

                <button
                    id="muteBtn"
                    class="control-btn"
                    title="Mute"
                >
                    🔊
                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

                <span id="currentTime">0:00</span>

                <span class="time-separator">/</span>

                <span id="duration">0:00</span>

            </div>

            <div class="progress-wrap">

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>

            <div class="control-right">

                <select
                    id="qualitySelect"
                    class="quality-select"
                >
                    <option value="auto">Auto</option>
                    <option value="1080p">1080p</option>
                    <option value="480p">480p</option>
                </select>

                <button
                    id="subtitleBtn"
                    class="control-btn cc-btn"
                >
                    CC
                </button>

                <button
                    id="subtitleSettingsBtn"
                    class="control-btn"
                >
                    ⚙
                </button>

                <button
                    id="fullscreenBtn"
                    class="control-btn"
                >
                    ⛶
                </button>

            </div>

        </div>

    </div>


    <!-- SERVERS -->
    <div class="server-section">

        <div class="server-heading">
            <span>Servers</span>
            <small>Select a playback server</small>
        </div>

        <div class="server-list">

            <button
                class="server-card active"
                onclick="selectServer('cineview',this)"
            >

                <span class="server-icon">▶</span>

                <span class="server-info">
                    <strong>CineView</strong>

<script>
/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const videoSource =
    document.getElementById("videoSource");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const muteBtn =
    document.getElementById("muteBtn");

const volume =
    document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const subtitleBtn =
    document.getElementById("subtitleBtn");

const subtitleSettingsBtn =
    document.getElementById("subtitleSettingsBtn");

const subtitlePanel =
    document.getElementById("subtitlePanel");

const closeSubtitlePanel =
    document.getElementById("closeSubtitlePanel");

const chooseSubtitle =
    document.getElementById("chooseSubtitle");

const subtitleFile =
    document.getElementById("subtitleFile");

const subtitleStatus =
    document.getElementById("subtitleStatus");

const qualitySelect =
    document.getElementById("qualitySelect");

const githubSubtitle =
    document.getElementById("githubSubtitle");

const githubSubtitleStatus =
    document.getElementById("githubSubtitleStatus");

const noneSubtitle =
    document.getElementById("noneSubtitle");

const loadingText =
    document.getElementById("loadingText");


/* =========================================================
   QUALITY SOURCES
========================================================= */

const QUALITY_SOURCES = {

    auto:
        "https://old-smoke-c852.icarus043.workers.dev/?data=Hp_uaUkJlAONqEwebXsY2Pyshr6O4gJP3eWPXN6RHR1dSz6sX92cKJBFigEtK5hrl-CVfkRvT7E81DHcMXc9Q1qGIkYr9Jsqe0o-dFhpI360AlXUfdyc56E6xfYdkM6qdq-PNj_30I2qucU184lGlV8EQkbbC7LKVbYBCqT5QnkMJeTv_gegvS8iNJV9gryB4EYGHfiy6XdE",

    "1080p":
        "https://old-smoke-c852.icarus043.workers.dev/?data=Hp_uaUkJlAONqEwebXsY2Pyshr6O4gJP3eWPXN6RHR1dSz6sX92cKJBFigEtK5hrl-CVfkRvT7E81DHcMXc9Q1qGIkYr9Jsqe0o-dFhpI360AlXUfdyc56E6xfYdkM6qdq-PNj_30I2qucU184lGlV8EQkbbC7LKVbYBCqT5QnkMJeTv_gegvS8iNJV9gryB4EYGHfiy6XdE",

    "480p":
        "https://old-smoke-c852.icarus043.workers.dev/?data=Hp_uaUkJlAONqEwebXsY2Pyshr6O4gJP3eWPXN6RHR1dSz6sX92cKJBFigEtK5hrl-CVfkRvT7E81DHcMXc9Q1qGIkYr9Jsqe0o-dFhpI360AlXUfdyc56E6xfYdkM6qdq-PNj_30I2qucU184lGlV8EQkbbC7LKVbYBCqT5QnkMJeTv_gegvS8iNJV9gryB4EYGHfiy6XdE"
};

let currentQuality = "auto";
let switchingQuality = false;


/* =========================================================
   SUBTITLES
========================================================= */

const GITHUB_SUBTITLE_URL = "subtitles.srt";

let subtitleTrack = null;
let subtitleURL = null;
let subtitlesEnabled = false;


/* =========================================================
   LOADING STATE
========================================================= */

function setLoading(state,text="Loading video..."){

    if(state){

        player.classList.add("loading");

        loadingText.textContent = text;

        /*
            VERY IMPORTANT:
            While loading, force the center button hidden.
        */

        centerPlay.style.opacity = "0";
        centerPlay.style.visibility = "hidden";
        centerPlay.style.pointerEvents = "none";

    }else{

        player.classList.remove("loading");

        centerPlay.style.opacity = "";
        centerPlay.style.visibility = "";
        centerPlay.style.pointerEvents = "";

        updatePlayerState();
    }
}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }

    seconds = Math.max(0,Math.floor(seconds));

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;

    if(hours > 0){

        return (
            hours +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0")
        );
    }

    return (
        minutes +
        ":" +
        String(secs).padStart(2,"0")
    );
}


/* =========================================================
   PLAYER STATE
========================================================= */

function updatePlayerState(){

    /*
        NEVER change the play button while loading.
    */

    if(player.classList.contains("loading")){
        return;
    }

    if(video.paused){

        player.classList.remove("video-playing");
        player.classList.add("video-paused");

        playBtn.textContent = "▶";
        centerPlay.innerHTML = "<span>▶</span>";

    }else{

        player.classList.remove("video-paused");
        player.classList.add("video-playing");

        playBtn.textContent = "❚❚";

        centerPlay.innerHTML = "<span>❚❚</span>";
    }
}


/* =========================================================
   PLAY
========================================================= */

function togglePlay(){

    if(player.classList.contains("loading")){
        return;
    }

    if(video.paused){

        video.play().catch(error=>{
            console.error("Playback failed:",error);
        });

    }else{

        video.pause();

    }
}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener("loadstart",()=>{

    if(video.readyState < 3){
        setLoading(true,"Loading video...");
    }

});

video.addEventListener("waiting",()=>{

    setLoading(true,"Buffering...");

});

video.addEventListener("stalled",()=>{

    setLoading(true,"Buffering...");

});

video.addEventListener("canplay",()=>{

    setLoading(false);

});

video.addEventListener("playing",()=>{

    setLoading(false);

    updatePlayerState();

    resetControlsTimer();

});

video.addEventListener("play",()=>{

    if(!player.classList.contains("loading")){
        updatePlayerState();
    }

    resetControlsTimer();

});

video.addEventListener("pause",()=>{

    setLoading(false);

    updatePlayerState();

    showControls();

    clearTimeout(controlsTimer);

});

video.addEventListener("ended",()=>{

    setLoading(false);

    updatePlayerState();

    showControls();

    clearTimeout(controlsTimer);

});

playBtn.addEventListener("click",togglePlay);

centerPlay.addEventListener("click",togglePlay);


/* =========================================================
   VIDEO CLICK
========================================================= */

video.addEventListener("click",()=>{

    if(player.classList.contains("loading")){
        return;
    }

    togglePlay();

    resetControlsTimer();

});


/* =========================================================
   PROGRESS
========================================================= */

let lastUIUpdate = 0;

video.addEventListener("timeupdate",()=>{

    const now = performance.now();

    if(now-lastUIUpdate < 100){
        return;
    }

    lastUIUpdate = now;

    currentTime.textContent =
        formatTime(video.currentTime);

    if(
        Number.isFinite(video.duration) &&
        video.duration > 0
    ){

        progress.value =
            (video.currentTime / video.duration) * 100;
    }

});

video.addEventListener("loadedmetadata",()=>{

    duration.textContent =
        formatTime(video.duration);

});

progress.addEventListener("input",()=>{

    if(!Number.isFinite(video.duration)){
        return;
    }

    video.currentTime =
        (progress.value / 100) *
        video.duration;

    resetControlsTimer();

});


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener("input",()=>{

    video.volume =
        Number(volume.value);

    video.muted = false;

    updateMuteIcon();

});

function updateMuteIcon(){

    muteBtn.textContent =
        video.muted || video.volume === 0
            ? "🔇"
            : "🔊";
}

muteBtn.addEventListener("click",()=>{

    video.muted = !video.muted;

    updateMuteIcon();

    resetControlsTimer();

});


/* =========================================================
   QUALITY
========================================================= */

qualitySelect.addEventListener("change",async()=>{

    const selected =
        qualitySelect.value;

    if(
        selected === currentQuality ||
        switchingQuality
    ){
        return;
    }

    switchingQuality = true;

    const oldQuality =
        currentQuality;

    const oldTime =
        video.currentTime;

    const wasPlaying =
        !video.paused;

    qualitySelect.disabled = true;

    setLoading(true,"Switching quality...");

    try{

        const newURL =
            QUALITY_SOURCES[selected];

        if(!newURL){
            throw new Error("Quality source missing");
        }

        videoSource.src = newURL;

        video.load();

        await new Promise((resolve,reject)=>{

            let done = false;

            const timeout =
                setTimeout(()=>{
                    cleanup();
                    reject(new Error("Video timeout"));
                },15000);

            function cleanup(){

                if(done){
                    return;
                }

                done = true;

                clearTimeout(timeout);

                video.removeEventListener(
                    "canplay",
                    success
                );

                video.removeEventListener(
                    "error",
                    failure
                );
            }

            function success(){

                cleanup();
                resolve();
            }

            function failure(){

                cleanup();
                reject(new Error("Video failed"));
            }

            video.addEventListener(
                "canplay",
                success,
                {once:true}
            );

            video.addEventListener(
                "error",
                failure,
                {once:true}
            );

        });

        currentQuality = selected;

        if(Number.isFinite(video.duration)){

            video.currentTime =
                Math.min(
                    oldTime,
                    Math.max(
                        0,
                        video.duration-.1
                    )
                );
        }

        setLoading(false);

        if(wasPlaying){

            await video.play().catch(()=>{});

        }

    }catch(error){

        console.warn(
            "Quality switch failed:",
            error
        );

        qualitySelect.value = oldQuality;

        currentQuality = oldQuality;

        videoSource.src =
            QUALITY_SOURCES[oldQuality];

        video.load();

        video.addEventListener(
            "loadedmetadata",
            ()=>{

                if(Number.isFinite(oldTime)){

                    video.currentTime =
                        Math.min(
                            oldTime,
                            video.duration || oldTime
                        );
                }

                setLoading(false);

                if(wasPlaying){
                    video.play().catch(()=>{});
                }

            },
            {once:true}
        );

    }finally{

        switchingQuality = false;

        qualitySelect.disabled = false;

    }

    resetControlsTimer();

});


/* =========================================================
   SUBTITLE PANEL
========================================================= */

subtitleSettingsBtn.addEventListener("click",event=>{

    event.stopPropagation();

    subtitlePanel.classList.toggle("active");

    resetControlsTimer();

});

closeSubtitlePanel.addEventListener("click",()=>{

    subtitlePanel.classList.remove("active");

});


/* =========================================================
   SUBTITLE BUTTON
========================================================= */

function updateSubtitleButton(){

    subtitleBtn.style.opacity =
        subtitlesEnabled ? "1" : ".45";
}

function toggleSubtitles(){

    subtitlesEnabled =
        !subtitlesEnabled;

    if(
        subtitleTrack &&
        subtitleTrack.track
    ){

        subtitleTrack.track.mode =
            subtitlesEnabled
                ? "showing"
                : "hidden";
    }

    updateSubtitleButton();

    resetControlsTimer();
}

subtitleBtn.addEventListener(
    "click",
    toggleSubtitles
);


/* =========================================================
   SRT → VTT
========================================================= */

function srtToVtt(srt){

    let vtt =
        srt
            .replace(/\r\n/g,"\n")
            .replace(/\r/g,"\n")
            .trim();

    vtt =
        vtt.replace(
            /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
            "$1.$2"
        );

    vtt =
        vtt.replace(
            /^\d+\s*$/gm,
            ""
        );

    return "WEBVTT\n\n" + vtt;
}


/* =========================================================
   APPLY SUBTITLE
========================================================= */

function applySubtitle(
    subtitleText,
    filename
){

    if(subtitleURL){
        URL.revokeObjectURL(subtitleURL);
    }

    if(subtitleTrack){
        subtitleTrack.remove();
        subtitleTrack = null;
    }

    const blob =
        new Blob(
            [subtitleText],
            {type:"text/vtt"}
        );

    subtitleURL =
        URL.createObjectURL(blob);

    subtitleTrack =
        document.createElement("track");

    subtitleTrack.kind = "subtitles";
    subtitleTrack.label = "English";
    subtitleTrack.srclang = "en";
    subtitleTrack.src = subtitleURL;
    subtitleTrack.default = true;

    video.appendChild(subtitleTrack);

    subtitleTrack.addEventListener("load",()=>{

        if(
            subtitleTrack &&
            subtitleTrack.track
        ){

            subtitleTrack.track.mode =
                subtitlesEnabled
                    ? "showing"
                    : "hidden";
        }

    });

    subtitleStatus.textContent =
        "English — " + filename;

    githubSubtitleStatus.textContent =
        "ON";

    githubSubtitle.classList.add("active");
    noneSubtitle.classList.remove("active");
}


/* =========================================================
   LOAD SUBTITLE
========================================================= */

async function loadGitHubSubtitle(){

    subtitleStatus.textContent =
        "Loading subtitles.srt...";

    try{

        const response =
            await fetch(
                GITHUB_SUBTITLE_URL,
                {cache:"no-cache"}
            );

        if(!response.ok){
            throw new Error(
                "Subtitle file not found"
            );
        }

        let text =
            await response.text();

        text = srtToVtt(text);

        subtitlesEnabled = true;

        applySubtitle(
            text,
            "subtitles.srt"
        );

        updateSubtitleButton();

    }catch(error){

        console.error(error);

        subtitleStatus.textContent =
            "subtitles.srt not found";

        githubSubtitleStatus.textContent =
            "ERROR";
    }
}


/* =========================================================
   SUBTITLE PRESET
========================================================= */

githubSubtitle.addEventListener(
    "click",
    ()=>{

        if(
            subtitleTrack &&
            githubSubtitle.classList.contains("active")
        ){

            subtitlesEnabled =
                !subtitlesEnabled;

            if(subtitleTrack.track){

                subtitleTrack.track.mode =
                    subtitlesEnabled
                        ? "showing"
                        : "hidden";
            }

            githubSubtitleStatus.textContent =
                subtitlesEnabled ? "ON" : "OFF";

            updateSubtitleButton();

            return;
        }

        loadGitHubSubtitle();
    }
);


/* =========================================================
   OFF
========================================================= */

noneSubtitle.addEventListener(
    "click",
    ()=>{

        subtitlesEnabled = false;

        if(
            subtitleTrack &&
            subtitleTrack.track
        ){

            subtitleTrack.track.mode = "hidden";
        }

        githubSubtitleStatus.textContent =
            "OFF";

        githubSubtitle.classList.remove(
            "active"
        );

        noneSubtitle.classList.add(
            "active"
        );

        subtitleStatus.textContent =
            "Subtitles disabled";

        updateSubtitleButton();
    }
);


/* =========================================================
   IMPORT SUBTITLE
========================================================= */

chooseSubtitle.addEventListener(
    "click",
    ()=>{
        subtitleFile.click();
    }
);

subtitleFile.addEventListener(
    "change",
    async event=>{

        const file =
            event.target.files[0];

        if(!file){
            return;
        }

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        if(
            extension !== "srt" &&
            extension !== "vtt"
        ){

            subtitleStatus.textContent =
                "Use an SRT or VTT file.";

            return;
        }

        try{

            let text =
                await file.text();

            if(extension === "srt"){
                text = srtToVtt(text);
            }

            subtitlesEnabled = true;

            applySubtitle(
                text,
                file.name
            );

            updateSubtitleButton();

        }catch(error){

            console.error(error);

            subtitleStatus.textContent =
                "Could not read subtitle file.";
        }
    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen(){

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if(isFullscreen){

        if(document.exitFullscreen){

            await document.exitFullscreen()
                .catch(()=>{});

        }else if(document.webkitExitFullscreen){

            document.webkitExitFullscreen();
        }

        return;
    }

    if(
        typeof video.webkitEnterFullscreen ===
        "function"
    ){

        try{

            video.webkitEnterFullscreen();

            return;

        }catch(error){
            console.warn(error);
        }
    }

    try{

        if(player.requestFullscreen){

            await player.requestFullscreen();

        }else if(player.webkitRequestFullscreen){

            player.webkitRequestFullscreen();
        }

    }catch(error){

        console.warn(
            "Fullscreen failed:",
            error
        );
    }
}

fullscreenBtn.addEventListener(
    "click",
    toggleFullscreen
);


/* =========================================================
   CONTROLS AUTO HIDE
========================================================= */

let controlsTimer = null;

function showControls(){

    player.classList.remove(
        "controls-hidden"
    );
}

function hideControls(){

    if(
        video.paused ||
        player.classList.contains("loading") ||
        subtitlePanel.classList.contains("active")
    ){
        return;
    }

    player.classList.add(
        "controls-hidden"
    );
}

function resetControlsTimer(){

    showControls();

    clearTimeout(controlsTimer);

    if(
        !video.paused &&
        !player.classList.contains("loading")
    ){

        controlsTimer =
            setTimeout(
                hideControls,
                3000
            );
    }
}


/* =========================================================
   PLAYER INTERACTION
========================================================= */

player.addEventListener(
    "mousemove",
    resetControlsTimer
);

player.addEventListener(
    "touchstart",
    resetControlsTimer,
    {passive:true}
);

player.addEventListener(
    "touchmove",
    resetControlsTimer,
    {passive:true}
);

player.addEventListener(
    "mouseenter",
    resetControlsTimer
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.target.tagName === "INPUT" ||
            event.target.tagName === "SELECT" ||
            event.target.tagName === "TEXTAREA"
        ){
            return;
        }

        if(
            event.key === " " ||
            event.key.toLowerCase() === "k"
        ){

            event.preventDefault();

            togglePlay();
        }

        if(
            event.key.toLowerCase() === "m"
        ){

            video.muted = !video.muted;

            updateMuteIcon();
        }

        if(
            event.key.toLowerCase() === "f"
        ){

            toggleFullscreen();
        }

        if(
            event.key.toLowerCase() === "c"
        ){

            toggleSubtitles();
        }

        if(event.key === "ArrowLeft"){

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );
        }

        if(event.key === "ArrowRight"){

            video.currentTime =
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + 5
                );
        }

        resetControlsTimer();
    }
);


/* =========================================================
   SERVERS
========================================================= */

function selectServer(server,button){

    document
        .querySelectorAll(".server-card")
        .forEach(card=>{
            card.classList.remove("active");
        });

    button.classList.add("active");

    if(server === "cineview"){

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        return;
    }

    if(server === "alternate"){

        window.location.href =
            "https://zxcstream.xyz/player/movie/969681";
    }
}


/* =========================================================
   ERROR HANDLING
========================================================= */

video.addEventListener(
    "error",
    ()=>{

        if(!video.error){
            return;
        }

        setLoading(false);

        console.error(
            "Video error:",
            video.error.code,
            video.error.message
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

document.addEventListener(
    "fullscreenchange",
    ()=>{
        if(document.fullscreenElement){
            resetControlsTimer();
        }else{
            showControls();
        }
    }
);

document.addEventListener(
    "webkitfullscreenchange",
    ()=>{
        if(document.webkitFullscreenElement){
            resetControlsTimer();
        }else{
            showControls();
        }
    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(subtitleURL){

            URL.revokeObjectURL(
                subtitleURL
            );

            subtitleURL = null;
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updatePlayerState();
updateMuteIcon();
updateSubtitleButton();
showControls();

</script>
