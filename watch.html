<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CineView — Watch</title>

<style>

@import url(
'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap'
);

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    min-height: 100%;

    background: #050507;

    color: white;

    font-family:
        Poppins,
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;

    overflow-x: hidden;
}

/* ========================================
   BACKGROUND
======================================== */

.page-background {

    position: fixed;

    inset: 0;

    z-index: -5;

    background:

        linear-gradient(
            rgba(5,5,7,.78),
            rgba(5,5,7,.96)
        ),

        url(
            "https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
        );

    background-size: cover;

    background-position: center;

    filter:
        saturate(.7)
        brightness(.7);

    pointer-events: none;
}

/* ========================================
   NAVBAR
======================================== */

.navbar {

    position: fixed;

    top: 18px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(
            1150px,
            calc(100% - 30px)
        );

    height: 64px;

    display: flex;

    align-items: center;

    padding: 0 22px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(15,15,20,.58);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);

    z-index: 100;
}

.logo {

    font-size: 21px;

    font-weight: 700;

    letter-spacing: -.5px;
}

.logo span {
    color: #ff3155;
}

.nav-links {

    display: flex;

    gap: 7px;

    margin-left: 32px;
}

.nav-links a {

    padding:
        9px 14px;

    border-radius: 10px;

    color:
        rgba(255,255,255,.6);

    text-decoration: none;

    font-size: 13px;

    transition: .2s;
}

.nav-links a:hover,
.nav-links a.active {

    color: white;

    background:
        rgba(255,255,255,.08);
}

/* ========================================
   WATCH PAGE
======================================== */

.watch-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        105px 20px 40px;
}

/* ========================================
   PLAYER
======================================== */

.custom-player {

    position: relative;

    width:
        min(
            1100px,
            100%
        );

    aspect-ratio:
        16 / 9;

    background: #000;

    border-radius: 18px;

    overflow: hidden;

    isolation: isolate;

    box-shadow:

        0 25px 80px
        rgba(0,0,0,.75),

        0 0 0 1px
        rgba(255,255,255,.07);
}

/* ========================================
   VIDEO
======================================== */

.custom-player video {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

    background: #000;

    outline: none;

    z-index: 2;
}

/* ========================================
   PLAYER TOP
======================================== */

.player-top {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    padding: 20px;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );
}

.back-btn {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        9px 13px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(15,15,20,.55);

    backdrop-filter:
        blur(15px);

    color: white;

    text-decoration: none;

    font-size: 12px;

    pointer-events: auto;

    transition: .2s;
}

.back-btn:hover {

    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-1px);
}

/* ========================================
   CENTER PLAY
======================================== */

.center-play {

    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 72px;

    height: 72px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(10,10,15,.8);

    backdrop-filter:
        blur(15px);

    color: white;

    font-size: 23px;

    cursor: pointer;

    z-index: 15;

    transition:
        transform .2s,
        background .2s;
}

.center-play:hover {

    transform:
        translate(-50%, -50%)
        scale(1.07);

    background:
        #ff3155;
}

/* ========================================
   CONTROLS
======================================== */

.video-controls {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 20;

    min-height: 82px;

    padding:
        30px 18px 13px;

    display: flex;

    align-items: center;

    gap: 9px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(0,0,0,.96)
        );
}

.control-btn {

    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.065);

    color: white;

    cursor: pointer;

    font-family: Poppins;

    transition: .15s;
}

.control-btn:hover {

    background:
        rgba(255,255,255,.14);
}

.control-btn:active {

    transform:
        scale(.92);
}

.time {

    font-size: 11px;

    color:
        rgba(255,255,255,.75);

    white-space: nowrap;
}

/* ========================================
   PROGRESS
======================================== */

.progress {

    flex: 1;

    height: 4px;

    min-width: 50px;

    appearance: none;

    -webkit-appearance: none;

    border-radius: 20px;

    background:
        rgba(255,255,255,.22);

    outline: none;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {

    appearance: none;

    width: 13px;

    height: 13px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}

.progress::-moz-range-thumb {

    width: 13px;

    height: 13px;

    border: 0;

    border-radius: 50%;

    background: white;
}

/* ========================================
   FULLSCREEN
======================================== */

.custom-player:fullscreen {

    width: 100vw;

    height: 100vh;

    border-radius: 0;

    box-shadow: none;
}

.custom-player:fullscreen video {

    width: 100%;

    height: 100%;

    object-fit: contain;
}

/* ========================================
   MOBILE
======================================== */

@media(max-width:700px) {

    .navbar {

        top: 10px;

        height: 58px;

        padding: 0 15px;
    }

    .nav-links {
        display: none;
    }

    .watch-page {

        padding:
            85px 10px 20px;
    }

    .custom-player {

        border-radius: 13px;
    }

    .video-controls {

        min-height: 66px;

        padding:
            25px 8px 8px;

        gap: 5px;
    }

    .control-btn {

        width: 32px;

        height: 32px;

        border-radius: 8px;
    }

    .center-play {

        width: 56px;

        height: 56px;

        font-size: 19px;
    }

    .time {

        font-size: 9px;
    }
}

</style>

</head>

<body>

<div class="page-background"></div>

<!-- =====================================
     NAVBAR
===================================== -->

<nav class="navbar">

    <div class="logo">
        Cine<span>View</span>
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a
            href="watch.html"
            class="active"
        >
            Watch
        </a>

    </div>

</nav>


<!-- =====================================
     WATCH PAGE
===================================== -->

<main class="watch-page">

    <div
        class="custom-player"
        id="customPlayer"
    >

        <!-- VIDEO IS ONLY HERE -->
        <video
            id="video"
            playsinline
            preload="metadata"
            crossorigin="anonymous"
        >

            <source
                src="https://wild-frost-90b0.icarus035.workers.dev/?data=UszpJnE9DIU7yZAetkQaDyJzqXpF0cIOLu3KXP7BaEEGEA7BwSE0isXn1BDgYpUTaGwg1s03wn1BkpHMdIM0bAbmaCTWw1N04Af3FOPEBGhFQkVbADkppo5GR0D46Sq0Q--Gt6gE2VbMGdlWaKNB0W3hwCG3ieL0ZVondAMhGiEZQhIZJtgAy-0KzoGdIt8ML9NF2lIV5A"
                type="video/mp4"
            >

        </video>


        <!-- TOP -->

        <div class="player-top">

            <a
                href="index.html"
                class="back-btn"
            >
                ← Home
            </a>

        </div>


        <!-- CENTER PLAY -->

        <button
            class="center-play"
            id="centerPlay"
            aria-label="Play"
        >
            ▶
        </button>


        <!-- CONTROLS -->

        <div class="video-controls">

            <button
                class="control-btn"
                id="playBtn"
            >
                ▶
            </button>

            <button
                class="control-btn"
                id="muteBtn"
            >
                🔊
            </button>

            <span
                class="time"
                id="currentTime"
            >
                0:00
            </span>

            <input
                class="progress"
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span
                class="time"
                id="duration"
            >
                0:00
            </span>

            <button
                class="control-btn"
                id="fullscreenBtn"
            >
                ⛶
            </button>

        </div>

    </div>

</main>


<script>

/* ========================================
   ELEMENTS
======================================== */

const video =
    document.getElementById("video");

const player =
    document.getElementById("customPlayer");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const muteBtn =
    document.getElementById("muteBtn");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* ========================================
   FORMAT TIME
======================================== */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* ========================================
   PLAY / PAUSE
======================================== */

function togglePlay() {

    if (video.paused) {

        video.play()
        .then(() => {

            playBtn.textContent = "❚❚";

            centerPlay.textContent = "❚❚";

        })
        .catch(error => {

            console.error(
                "Video playback error:",
                error
            );

        });

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);


/* ========================================
   VIDEO STATE
======================================== */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

        centerPlay.textContent = "❚❚";

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

        centerPlay.textContent = "▶";

    }
);


/* ========================================
   METADATA
======================================== */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(video.duration);

        console.log(
            "Video loaded:",
            video.duration
        );

    }
);


/* ========================================
   PROGRESS
======================================== */

video.addEventListener(
    "timeupdate",
    () => {

        currentTime.textContent =
            formatTime(video.currentTime);

        if (
            Number.isFinite(video.duration) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

        }

    }
);


/* ========================================
   SEEK
======================================== */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(video.duration)
        ) {
            return;
        }

        video.currentTime =
            (
                progress.value / 100
            ) * video.duration;

    }
);


/* ========================================
   MUTE
======================================== */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        muteBtn.textContent =
            video.muted
                ? "🔇"
                : "🔊";

    }
);


/* ========================================
   FULLSCREEN
======================================== */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await player.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ========================================
   VIDEO ERROR
======================================== */

video.addEventListener(
    "error",
    () => {

        console.error(
            "VIDEO ERROR:",
            video.error
        );

    }
);

</script>

</body>
</html>
